<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AOV Reports — Simpson &amp; Wood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.49.0/dist/tabler-icons.min.css" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<link rel="stylesheet" href="sw-design.css">
<style>
  body{padding-bottom:40px;}
  .wrap{max-width:1500px; margin:0 auto; padding:0;}
  header .brand{flex:1 1 auto;} header .brand > div{min-width:0;}
  #signinScreen, #notAuthorised{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;}
  #signinScreen img, #notAuthorised img{height:44px; margin-bottom:28px;}
  #signinScreen h2, #notAuthorised h2{font-weight:700; text-transform:uppercase; font-size:20px; margin:0 0 8px;}
  #signinScreen p, #notAuthorised p{color:var(--grey); font-size:14px; max-width:340px; margin:0 0 20px;}
  #signinScreen .err{color:var(--red); font-size:13px; margin-top:16px; max-width:320px;}
  #notAuthorised{display:none;} #appRoot{display:none;}
  .ms-btn{display:flex;}
  main{padding:16px;}
  .tabs .wrap{display:flex; gap:4px; width:100%;}
  .card{min-width:0; padding:16px;}
  .section-label{font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.02em; font-size:20px; margin:0 0 12px;}
  .fld > label, label.l{display:block; font-family:'Barlow Condensed',sans-serif; font-size:14.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--grey); margin:0 0 6px;}
  input[type=text], input[type=date], select, textarea{width:100%; min-height:44px; padding:10px 12px; font-family:'Barlow',sans-serif; font-size:16px; border:1.5px solid var(--field); border-radius:8px; background:#fff; color:var(--ink); margin-bottom:14px;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--red);}
  select{appearance:none; -webkit-appearance:none; padding-right:34px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%235c5c5c' d='M5 7l5 5 5-5z'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; background-size:18px;}
  textarea{resize:vertical; min-height:64px; line-height:1.4;}
  .fgrid{display:grid; grid-template-columns:minmax(0,1fr); column-gap:16px;} .fgrid > .full{grid-column:1 / -1;}
  @media (min-width:640px){ .fgrid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (min-width:1100px){ .fgrid.three{grid-template-columns:repeat(3,minmax(0,1fr));} }
  .tick{display:flex; gap:10px; align-items:flex-start; font-size:15px; font-weight:600; margin:0 0 10px; cursor:pointer;} .tick input{width:20px; height:20px; flex:0 0 auto; margin-top:1px;}
  .banner{display:none; font-weight:600;}
  .banner.ok{background:var(--green-bg); color:var(--green); border-color:var(--green-line);}
  .banner.wait{background:var(--amber-bg); color:#4d3300; border-color:var(--amber-line);}
  .tag{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:6px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; background:#eeece7; color:var(--grey);}
  .tag.ok{background:var(--green-bg); color:var(--green);} .tag.bad{background:var(--red-tint); color:var(--red-dark);} .tag.wait{background:var(--amber-bg); color:var(--amber);}
  .tag.info{background:var(--blue-bg); color:var(--blue);} .tag.over{background:var(--red); color:#fff;} .tag.test{background:var(--test-bg); color:var(--test-ink);}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:9px 16px; font-size:15px; font-weight:700; background:#fff; border:1.5px solid var(--field); border-radius:8px; cursor:pointer; color:var(--ink);}
  .btn.red{background:var(--red); border-color:var(--red); color:#fff;} .btn.dark{background:var(--ink); border-color:var(--ink); color:#fff;} .btn.green{background:var(--green); border-color:var(--green); color:#fff;}
  .btn.sm{min-height:38px; padding:6px 12px; font-size:14px;} .btn.warn{border-color:var(--red); color:var(--red);} .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btns{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
  .box{border:1px solid var(--line); border-radius:10px; padding:12px; margin:0 0 12px; background:#fff;}
  .box.warn{background:var(--amber-bg); border-color:var(--amber-line); color:#4d3300;} .box.bad{background:var(--red-tint); border-color:var(--bad-line); color:var(--bad-ink);}
  .box.good{background:var(--green-bg); border-color:var(--green-line); color:var(--green);} .box.info{background:var(--blue-bg); border-color:var(--blue-line); color:var(--blue);}
  .box h4{margin:0 0 6px; font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; font-size:17px;}
  .small{font-size:13px; color:var(--grey);}
  .gt-title{font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; font-size:22px; margin:0 0 4px;} .gt-sub{color:var(--grey); font-size:14px; margin:0 0 12px;}
  .list-line{display:flex; justify-content:space-between; gap:8px; align-items:center; padding:9px 0; border-top:1px solid var(--line); flex-wrap:wrap;} .list-line:first-child{border-top:none;}
  .empty-note, .loading-note{text-align:center; color:var(--grey); font-size:14.5px; padding:18px 0;}
  .layout{display:grid; grid-template-columns:minmax(0,1fr); gap:14px; align-items:start;}
  @media (min-width:1000px){ .layout.split{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);} }
  table.t{width:100%; border-collapse:collapse; font-size:14px;} table.t th, table.t td{border-top:1px solid var(--line); padding:7px 6px; text-align:left; vertical-align:top;}
  table.t th{font-size:12px; color:var(--grey); text-transform:uppercase; letter-spacing:.03em;} table.t tr.grp td{background:var(--soft); font-weight:700;}
  table.t tr.click{cursor:pointer;} table.t tr.click:hover td{background:var(--red-tint);}
  .tw{overflow-x:auto;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px;}
  .ph-grid{display:flex; flex-wrap:wrap; gap:10px;} .ph-grid figure{margin:0; width:150px;} .ph-grid img{width:150px; height:112px; object-fit:cover; border-radius:8px; border:1px solid var(--line);}
  .ph-grid figcaption{font-size:12px; color:var(--grey);}
  @media (max-width:640px){ main{padding:12px;} .card{padding:14px;} header h1{font-size:16px;} header .who .name{display:none;} }
</style>
</head>
<body>
<div id="signinScreen">
  <img src="sw-logo.png" alt="Simpson & Wood">
  <h2>AOV Reports</h2>
  <p>Sign in with your Simpson &amp; Wood Microsoft account.</p>
  <button class="ms-btn" id="msSignInBtn"><i class="ti ti-brand-windows"></i> Sign in with Microsoft</button>
  <div class="err" id="signinErr"></div>
</div>
<div id="notAuthorised">
  <img src="sw-logo.png" alt="Simpson & Wood">
  <h2>AOV Reports</h2>
  <p>You're signed in as <b id="notAuthEmail"></b>. This page is for QS and management.</p>
  <div class="btns"><a class="btn" href="index.html">Back to home</a><button class="btn" id="signOutBtn2">Sign out</button></div>
</div>
<div id="appRoot">
  <header>
    <a class="brand" href="index.html" title="Home"><img src="sw-logo-white.png" alt="Simpson & Wood"><div><h1>AOV Reports</h1><p id="versionLabel">v1.0</p></div></a>
    <div class="right"><div class="who"><div class="name" id="whoName">—</div><button id="signOutBtn">Sign out</button></div></div>
  </header>
  <nav class="tabs"><div class="wrap" id="tabsBar"></div></nav>
  <main><div class="wrap"><div id="banner" class="banner"></div><div id="view"></div></div></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, OAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection,
  getDocs, doc, getDoc, query, where, serverTimestamp, setDoc as fsSetDoc
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import * as SWS from './sw-shared.js';
import * as A from './aov-shared.js';
const { esc } = A;

const VERSION = "v1.0";
document.getElementById('versionLabel').textContent = VERSION + ' · Management';
const firebaseConfig = {
  apiKey: "AIzaSyB5foKhRfIMG91bD5QyT7hHd1XBbeQGucw",
  authDomain: "simpson-wood-engineer-app.firebaseapp.com",
  projectId: "simpson-wood-engineer-app",
  storageBucket: "simpson-wood-engineer-app.firebasestorage.app",
  messagingSenderId: "201961281346",
  appId: "1:201961281346:web:3c7386b73b41ce9df35adb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
const msProvider = new OAuthProvider('microsoft.com');
msProvider.setCustomParameters({ tenant: 'abd23e0c-2d96-49ad-a280-99ff317f7d60' });
SWS.swSetup({ db, auth, page: 'aov-report', version: VERSION });
const viewingAs = () => SWS.swViewingAs();
const isVaError = e => e && String(e.message || '').includes(SWS.SW_VA_MSG);
const setDoc = SWS.swGuard(fsSetDoc);

const S = { user: null, level: 'engineer', position: '', isDirector: false, sites: [], visits: [], rules: [], reports: [], audit: [], staff: {}, sigs: {}, tab: 'sites', q: '', filter: 'all', sel: null, review: null, results: {}, photos: null, busy: false };
const $ = id => document.getElementById(id);
const meEmail = () => { const va = viewingAs(); return va ? va.email : String((S.user && S.user.email) || '').toLowerCase(); };
const meName = () => { const va = viewingAs(); return va ? va.name : ((S.user && (S.user.displayName || S.user.email)) || ''); };
const isMgmt = () => S.level === 'management';
const banner = (txt, cls = 'wait') => { const b = $('banner'); if (!txt) { b.style.display = 'none'; return; } b.className = 'banner ' + cls; b.textContent = txt; b.style.display = 'block'; };
const clean = o => JSON.parse(JSON.stringify(o, (k, v) => (k[0] === '_' ? undefined : (v === undefined ? null : v))));
function write(p, what) {
  return Promise.resolve(p).then(() => true).catch(e => {
    if (isVaError(e)) { banner(SWS.SW_VA_MSG, 'wait'); return false; }
    console.error(what, e); SWS.swReport('save', what + ' didn\'t save: ' + (e && (e.code || e.message) || 'unknown'));
    banner(what + ' did not save (' + (e && (e.code || e.message) || 'error') + ').', 'wait'); return false;
  });
}
const audit = (action, extra = {}) => { if (viewingAs()) return; write(setDoc(doc(collection(db, 'aovAudit')), { at: serverTimestamp(), atISO: new Date().toISOString(), by: meEmail(), action, ...extra }), 'Audit record'); };

function describeAuthError(err) {
  if (err.code === 'auth/unauthorized-domain') return 'This site\'s domain isn\'t authorised in Firebase yet.';
  if (err.code === 'auth/operation-not-allowed') return 'Microsoft sign-in isn\'t enabled in Firebase yet.';
  if (['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(err.code)) return null;
  return 'Sign-in failed — ' + (err.code || err.message || 'unknown error') + '.';
}
$('msSignInBtn').addEventListener('click', () => {
  const errBox = $('signinErr'); errBox.textContent = '';
  signInWithPopup(auth, msProvider).catch(err => {
    if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') { signInWithRedirect(auth, msProvider).catch(e2 => { const m = describeAuthError(e2); if (m) errBox.textContent = m; }); return; }
    const m = describeAuthError(err); if (m) errBox.textContent = m;
  });
});
$('signOutBtn').addEventListener('click', () => signOut(auth));
$('signOutBtn2').addEventListener('click', () => signOut(auth));
getRedirectResult(auth).catch(err => { $('signinErr').textContent = 'Sign-in failed — ' + (err.message || 'try again.'); });

let booted = false;
onAuthStateChanged(auth, async user => {
  S.user = user;
  if (!user) { $('signinScreen').style.display = 'flex'; $('appRoot').style.display = 'none'; $('notAuthorised').style.display = 'none'; return; }
  $('signinScreen').style.display = 'none';
  if (booted) return; booted = true;
  const va = await SWS.swViewAsInit(user);
  try { const a = await SWS.swAccess(va ? va.email : user.email); S.level = a.level; S.position = a.position; } catch (e) {}
  if (!isMgmt()) { $('notAuthEmail').textContent = user.email; $('notAuthorised').style.display = 'flex'; return; }
  $('appRoot').style.display = 'block';
  $('whoName').textContent = va ? va.name : (user.displayName || user.email);
  S.isDirector = S.position === 'Director' || meEmail() === SWS.SW_OWNER;
  SWS.swExtrasStart({ page: 'aov-report', version: VERSION, level: S.level, news: NEWS, help: HELP, tab: () => (TABS.find(t => t[0] === S.tab) || [])[1] });
  SWS.swuStart();
  load();
});
window.swUpdateBlocker = () => S.busy ? 'Wait until it has finished saving, then tap Update.' : '';

const TABS = [['sites', 'Sites', 'ti-building'], ['review', 'To review', 'ti-checklist'], ['issued', 'Issued', 'ti-file-certificate'], ['rules', 'Rules', 'ti-ruler-2'], ['audit', 'Audit', 'ti-history']];
function buildTabs() {
  const n = S.visits.filter(v => v.status === 'Ready for QS' && !v.testData).length, ns = S.sites.filter(s => s.setupStatus === 'Ready for QS').length;
  $('tabsBar').innerHTML = TABS.map(t => `<button type="button" class="tab ${S.tab === t[0] ? 'active' : ''}" data-tab="${t[0]}"><i class="ti ${t[2]}"></i> ${t[1]}${t[0] === 'review' && n ? ` <span class="count">${n}</span>` : ''}${t[0] === 'sites' && ns ? ` <span class="count">${ns}</span>` : ''}</button>`).join('');
}
async function load() {
  $('view').innerHTML = '<div class="loading-note">Loading…</div>';
  const g = async (c, quiet) => { try { return (await getDocs(collection(db, c))).docs.map(d => ({ id: d.id, ...d.data() })); } catch (e) { if (navigator.onLine && !quiet) SWS.swReport('load', `AOV reports: ${c} didn't load: ${e.code || e.message}`); return []; } };
  const [sites, visits, rules, reports, staff, sigs, aud] = await Promise.all([g('aovSites'), g('aovTests'), g('aovRules'), g('aovReports'), g('staff'), g('staffSignatures', true), g('aovAudit', true)]);
  S.sites = sites.filter(x => !x.deletedFlag).sort((a, b) => String(a.siteName).localeCompare(String(b.siteName)));
  S.visits = visits.filter(x => !x.deletedFlag).map(v => ({ ...v, _id: v.id })).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  S.rules = rules.sort((a, b) => (b.version || 0) - (a.version || 0)); S.reports = reports;
  S.staff = {}; staff.forEach(s => S.staff[String(s.email || s.id).toLowerCase()] = s);
  S.sigs = {}; sigs.forEach(s => S.sigs[s.id.toLowerCase()] = s);
  S.audit = aud.sort((a, b) => String(b.atISO || '').localeCompare(String(a.atISO || ''))).slice(0, 300);
  const want = new URLSearchParams(location.search).get('site'); if (want) { const s = S.sites.find(x => x.siteRef === want || x.id === want); if (s) S.sel = s.id; }
  render();
}
const approvedRules = () => S.rules.find(r => r.status === 'Approved');
const rulesObj = r => ({ ...A.clone(A.DEFAULT_RULES), ...((r && r.rules) || {}) });
function render() { buildTabs(); $('view').innerHTML = ({ sites: sitesHTML, review: reviewHTML, issued: issuedHTML, rules: rulesHTML, audit: auditHTML }[S.tab])(); }
const tag = (c, t) => `<span class="tag ${c}">${esc(t)}</span>`;
const setupTag = s => s.setupStatus === 'Approved' ? tag('ok', 'Set-up approved') : s.setupStatus === 'Ready for QS' ? tag('wait', 'Set-up to approve') : s.setupStatus === 'Changed' ? tag('wait', 'Changed since approval') : tag('', 'Set-up draft');
const dueTag = s => { if (!s.dueMonth) return tag('', 'No report issued yet'); const st = A.dueState(s.dueMonth); return tag(st === 'overdue' ? 'over' : st === 'due' ? 'bad' : 'info', st === 'overdue' ? 'Overdue since ' + A.monthLabel(A.addMonths(s.dueMonth, 1)) : 'Due ' + A.monthLabel(s.dueMonth)); };
const nameOf = e => (S.staff[String(e || '').toLowerCase()] || {}).name || e || '';

// ═══ SITES ═══
const FILTERS = [['all', 'All'], ['setup', 'Set-up to approve'], ['due', 'Due this month'], ['overdue', 'Overdue'], ['open', 'Visit in progress']];
function matchSite(s) {
  if (S.q && !(`${s.siteName} ${s.siteRef} ${s.postcode || ''}`.toLowerCase().includes(S.q.toLowerCase()))) return false;
  switch (S.filter) { case 'setup': return ['Ready for QS', 'Changed'].includes(s.setupStatus); case 'due': return A.dueState(s.dueMonth) === 'due'; case 'overdue': return A.dueState(s.dueMonth) === 'overdue'; case 'open': return S.visits.some(v => v.siteRef === s.siteRef && ['Draft', 'Returned'].includes(v.status)); }
  return true;
}
function sitesHTML() {
  const list = S.sites.filter(matchSite);
  let h = `<div class="layout ${S.sel ? 'split' : ''}"><div class="card"><p class="section-label">Sites</p><input type="text" id="siteQ" placeholder="Search name, reference or postcode" value="${esc(S.q)}">
   <div class="chips">${FILTERS.map(f => `<button class="chip ${S.filter === f[0] ? 'on' : ''}" data-filter="${f[0]}">${f[1]}</button>`).join('')}</div>`;
  h += list.length ? `<div class="tw"><table class="t"><tr><th>Site</th><th>Set-up</th><th>Due</th></tr>${list.map(s => `<tr class="click" data-open="${esc(s.id)}"><td><b>${esc(s.siteName)}</b><div class="small">${esc(s.siteRef)}</div></td><td>${setupTag(s)}</td><td>${dueTag(s)}</td></tr>`).join('')}</table></div>` : '<div class="empty-note">No sites match.</div>';
  h += `</div>`;
  if (S.sel) h += sitePanelHTML(S.sites.find(s => s.id === S.sel));
  return h + `</div>`;
}
function sitePanelHTML(s) {
  if (!s) return '';
  const { gaps, flags } = A.setupGaps(s), visits = S.visits.filter(v => v.siteRef === s.siteRef);
  let h = `<div class="card" id="sitePanel"><div class="btns" style="margin-top:0"><button class="btn sm" data-close="1">Close</button><a class="btn sm" href="aov-test.html?site=${encodeURIComponent(s.siteRef)}">Open in the engineer app</a></div>
   <div class="small">${esc(s.siteRef)}</div><h2 class="gt-title">${esc(s.siteName)}</h2><p class="gt-sub">${esc([s.addressLine, s.postcode].filter(Boolean).join(', '))}${s.contact ? ' · ' + esc(s.contact) : ''}</p><div class="chips">${setupTag(s)}${dueTag(s)}</div>`;
  h += `<div class="fgrid three"><div class="fld"><label>Full service every</label><select id="sInt">${[6, 12].map(n => `<option value="${n}" ${Number(s.intervalMonths || 12) === n ? 'selected' : ''}>${n} months</option>`).join('')}</select></div>
   <div class="fld"><label>System working within (s)</label><input type="text" id="sT90" inputmode="numeric" value="${esc((s.timings || {}).systemS ?? 90)}"></div>
   <div class="fld"><label>Doors / dampers open within (s)</label><input type="text" id="sT60" inputmode="numeric" value="${esc((s.timings || {}).openS ?? 60)}"></div></div>
   <div class="btns"><button class="btn sm" data-act="savesite" data-id="${esc(s.id)}">Save interval and times</button></div>`;
  // set-up approval (the baseline): a Director approves
  h += `<p class="section-label" style="margin-top:8px">Equipment and scenarios</p>`;
  if (gaps.length) h += `<div class="box bad"><h4>Not finished</h4>${gaps.map(g => '• ' + esc(g)).join('<br>')}</div>`;
  if (flags.length) h += `<div class="box warn"><h4>To look at</h4>${flags.map(g => '• ' + esc(g)).join('<br>')}</div>`;
  h += `<div class="tw">${equipTable(s)}</div>`;
  h += `<p class="section-label" style="margin-top:12px">Scenarios</p>${(s.scenarios || []).filter(c => !c.retired).map(c => `<div class="list-line"><div><b>${esc(c.name || 'Scenario')}</b> <span class="small">${esc(A.systemName(s, c.systemId))}</span><div class="small">${esc(c.inputType || '')} ${esc(c.inputRef || '')} ${esc(c.inputLocation || '')} · ${esc(A.METHODS[c.method || 'endToEnd'])}</div><div class="small">Opens: ${esc(Object.entries(c.expected || {}).filter(([, v]) => v === 'open').map(([id]) => assetLabel(s, id)).join(', ') || '—')} · Stays shut: ${esc(Object.entries(c.expected || {}).filter(([, v]) => v === 'closed').map(([id]) => assetLabel(s, id)).join(', ') || '—')}</div></div></div>`).join('') || '<div class="small">None.</div>'}`;
  h += `<p class="section-label" style="margin-top:12px">Power supplies</p>${(s.supplies || []).filter(p => !p.retired).map(p => { const c = A.batteryCalc(p, rulesObj(approvedRules())), age = A.batteryAge(p, rulesObj(approvedRules())); return `<div class="list-line"><div><b>${esc(p.name || 'Supply')}</b> <span class="small">${esc(p.model || '')}</span><div class="small">${c.missing.length ? 'Battery calculation needs: ' + esc(c.missing.join(', ')) : `Needs ${A.fmt(c.needAh, 1)} Ah, fitted ${A.fmt(c.bankAh, 1)} Ah (${c.ok ? 'OK' : 'too small'}), about ${A.fmt(c.runtimeH, 0)} h standby as fitted`}${age.replaceBy ? ` · replace by ${A.shortDate(age.replaceBy)}` : ''}</div></div>${c.missing.length ? tag('wait', 'Unresolved') : c.ok ? tag('ok', 'Big enough') : tag('bad', 'Too small')}</div>`; }).join('') || '<div class="small">None.</div>'}`;
  if (['Ready for QS', 'Changed', 'Draft'].includes(s.setupStatus)) {

    }
    case 'returnsetup': { const s = S.sites.find(x => x.id === d.id); const note = ($('sNote').value || '').trim(); if (!note) return alert('Write a note so the engineer knows what to change.'); if (await saveSiteFields(s, { setupStatus: 'Draft', setupReturnNote: note })) { audit('setup-returned', { siteRef: s.siteRef }); render(); } return; }
    case 'baseline': { const v = S.visits.find(x => x._id === d.id), s = S.sites.find(x => x.siteRef === v.siteRef); if (!confirm('Judge these results against the set-up approved since? Only do this if the answers recorded cover what the approved scenarios need.')) return; const bd = { by: meEmail(), at: new Date().toISOString(), setupVersion: s.setupVersion || 1 }; await saveVisitFields(v, { baselineDecision: bd, setupApprovedAtTest: true, siteSnapshot: { ...v.siteSnapshot, scenarios: s.scenarios, setupStatus: 'Approved' } }); audit('baseline-decision', { visitId: v._id, setupVersion: bd.setupVersion }); return render(); }
    case 'return': { const v = S.visits.find(x => x._id === d.id); const note = ($('retNote').value || '').trim(); if (!note) return alert('Say what needs doing.'); const keys = [...document.querySelectorAll('.reopen:checked')].map(x => x.value); const rn = [...(v.returnNotes || []), { note, keys, by: meEmail(), byName: meName(), at: new Date().toISOString() }]; if (await saveVisitFields(v, { status: 'Returned', returnNotes: rn, qsNotes: $('qsNotes').value })) { audit('visit-returned', { visitId: v._id }); S.review = null; banner('Returned to the engineers.', 'ok'); render(); } return; }
    case 'discard': { const v = S.visits.find(x => x._id === d.id); if (!confirm('Discard this practice run?')) return; await saveVisitFields(v, { deletedFlag: true, deletedBy: meEmail(), deletedAt: new Date().toISOString() }); S.visits = S.visits.filter(x => x._id !== v._id); S.review = null; return render(); }
    case 'photos': { const box = $('revPhotos'); box.textContent = 'Loading…'; try { const s = await getDocs(query(collection(db, 'aovPhotos'), where('visitId', '==', d.id))); S.photos = s.docs.map(x => x.data()).sort((a, b) => a.n - b.n); box.innerHTML = photosHTML(); } catch (er) { box.textContent = 'Photos did not load.'; } return; }
    case 'issue': return issue(d.id);
    case 'revise': return revise(d.id);
    case 'newrules': return newRules();
    case 'savedraft': { const r = S.rules.find(x => x.id === d.id); readDraft(r); if (await write(setDoc(doc(db, 'aovRules', r.id), clean({ rules: r.rules, checked: r.checked }), { merge: true }), 'Rules draft')) banner('Draft saved.', 'ok'); return; }
    case 'approverules': return approveRules(d.id);
  }
});
