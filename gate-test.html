<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gates &amp; Doors Inspection — Simpson &amp; Wood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.49.0/dist/tabler-icons.min.css" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<link rel="stylesheet" href="sw-design.css">
<style>
  body{padding-bottom:40px;}
  .wrap{max-width:1500px; margin:0 auto; padding:0;}
  header .brand{flex:1 1 auto;} header .brand > div{min-width:0;}   /* long title: … rather than running under the buttons */

  /* ---- sign-in ---- */
  #signinScreen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;}
  #signinScreen img{height:44px; margin-bottom:28px;}
  #signinScreen h2{font-weight:700; text-transform:uppercase; font-size:20px; margin:0 0 8px;}
  #signinScreen p{color:var(--grey); font-size:14px; max-width:320px; margin:0 0 26px;}
  #signinScreen .err{color:var(--red); font-size:13px; margin-top:16px; max-width:320px;}
  .ms-btn{display:flex;}
  #appRoot{display:none;}

  /* ---- site bar ---- */
  .site-bar{background:var(--card); border-bottom:1px solid var(--line); padding:12px 16px;}
  .site-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .site-row select{flex:1 1 260px; max-width:520px; margin:0;}
  .site-btn{display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:9px 14px; font-size:14.5px; font-weight:700; background:#fff; border:1.5px solid var(--field); border-radius:8px; cursor:pointer; white-space:nowrap;}
  .site-btn i{font-size:17px;}
  .site-btn.dark{background:var(--ink); color:#fff; border-color:var(--ink);}
  .site-btn.dashed{border-style:dashed; color:var(--grey);}
  .site-status{font-size:12.5px; color:var(--grey); margin:5px 0 0;}
  .site-note{border-radius:8px; padding:10px 12px; font-size:14px; font-weight:600; margin-top:8px; border:1px solid;}
  .site-note.bad{background:var(--red-tint); color:var(--bad-ink); border-color:var(--bad-line);}
  #addSiteForm{margin-top:12px; max-width:900px;}

  /* ---- tabs: the guide's red-tint pills ---- */
  .tabs .wrap{display:flex; gap:4px; width:100%;}
  header .who button{white-space:nowrap;}

  main{padding:16px;}
  .log-layout{display:grid; grid-template-columns:minmax(0,1fr); gap:0 16px; align-items:start;}
  @media (min-width:1100px){ .log-layout{grid-template-columns:320px minmax(0,1fr);} .log-side{position:sticky; top:70px;} }
  .card{min-width:0; padding:16px;}
  .section-label{font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.02em; font-size:20px; color:var(--ink); margin:0 0 12px;}

  /* ---- fields: labels are the guide's .lbl ---- */
  .fld > label, .card > label, .site-bar label, .edit-panel label{display:block; font-family:'Barlow Condensed',sans-serif; font-size:14.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--grey); margin:0 0 6px;}
  label .req{color:var(--red);}
  label .hint{display:block; font-family:'Barlow',sans-serif; font-weight:400; text-transform:none; letter-spacing:0; color:var(--grey); font-size:12.5px; margin-top:2px;}
  input[type=text], input[type=date], select, textarea, input[type=file]{
    width:100%; min-height:44px; padding:10px 12px; font-family:'Barlow',sans-serif; font-size:16px;
    border:1.5px solid var(--field); border-radius:8px; background:#fff; color:var(--ink); margin-bottom:14px;
  }
  input[type=text]:focus, input[type=date]:focus, select:focus, textarea:focus{outline:none; border-color:var(--red);}
  textarea{resize:vertical; min-height:64px; line-height:1.4;}
  select{appearance:none; -webkit-appearance:none; padding-right:34px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%235c5c5c' d='M5 7l5 5 5-5z'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; background-size:18px;}
  select:disabled{background-color:var(--soft); color:var(--grey);}
  select:disabled option:disabled{color:#ccc;}
  .field-error{border-color:var(--red) !important; box-shadow:0 0 0 3px var(--red-tint);}
  .error-msg{color:var(--red); font-size:13px; margin:-10px 0 12px; display:none;}

  /* form grid: label + box + error stay together in a .fld */
  .fgrid{display:grid; grid-template-columns:minmax(0,1fr); column-gap:16px;}
  .fgrid > .full{grid-column:1 / -1;}
  .fgrid > .contents{display:contents;}
  .fld{min-width:0;}
  @media (min-width:640px){ .fgrid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (min-width:1300px){ .fgrid{grid-template-columns:repeat(3,minmax(0,1fr));} }
  .checks-grid{display:grid; grid-template-columns:minmax(0,1fr); column-gap:28px; margin-bottom:6px;}
  @media (min-width:1000px){ .checks-grid{grid-template-columns:repeat(2,minmax(0,1fr));} .checks-grid .check-item:nth-child(2){border-top:none; padding-top:0;} }

  .radio-row{display:flex; gap:6px; margin:0; flex-shrink:0; flex-wrap:wrap;}
  .radio-opt{display:flex; align-items:center; justify-content:center; min-height:44px; border:1.5px solid var(--field); border-radius:8px; padding:8px 14px; text-align:center; font-weight:700; font-size:15px; cursor:pointer; user-select:none; color:var(--grey); min-width:62px; background:#fff;}
  .radio-opt input{display:none;}
  .radio-opt.pass-sel{border-color:var(--green); background:var(--green-bg); color:var(--green);}
  .radio-opt.fail-sel{border-color:var(--red); background:var(--red-tint); color:var(--red-dark);}
  .radio-opt.na-sel{border-color:var(--grey); background:var(--soft); color:var(--grey);}
  .edit-panel{margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; width:100%;}
  .edit-panel .check-item{padding:6px 0;}
  .id-locked-note{font-size:12.5px; color:var(--grey); margin:0 0 12px; font-style:italic;}
  .edited-marker{font-size:11px; font-weight:700; color:var(--amber); background:var(--amber-bg); padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em;}
  .btn-edit-own, .del-btn, .restore-btn, .photos-btn{min-height:40px; background:#fff; border:1.5px solid var(--field); color:var(--ink); font-size:14px; font-weight:700; padding:7px 12px; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:5px;}
  .btn-edit-own i, .photos-btn i{font-size:16px;}
  .del-btn{border-color:var(--red); color:var(--red);}
  .restore-btn{border-color:var(--ink);}
  .btn-save-edit{flex:1; min-height:44px; background:var(--green); color:#fff; border:none; padding:10px; border-radius:8px; font-weight:700; font-size:15px; cursor:pointer;}
  .btn-cancel-edit{flex:1; min-height:44px; background:#fff; border:1.5px solid var(--field); color:var(--ink); padding:10px; border-radius:8px; font-weight:700; font-size:15px; cursor:pointer;}
  .loading-spinner{display:flex; align-items:center; gap:8px; color:var(--grey); font-size:13.5px; padding:10px 0 0;}
  .loading-spinner .dot{width:7px; height:7px; border-radius:50%; background:var(--red); animation:pulse 1s infinite ease-in-out;}
  .loading-spinner .dot:nth-child(2){animation-delay:.15s;} .loading-spinner .dot:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  /* photos (v19.0: kept apart from the test, loaded when asked for) */
  .photo-row{display:flex; flex-wrap:wrap; gap:10px; margin:8px 0 4px;}
  .photo-row figure{margin:0;}
  .photo-row img, .reference-photo{display:block; width:150px; height:112px; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:zoom-in; background:var(--soft);}
  .photo-row figcaption{font-size:12px; color:var(--grey); margin-top:3px;}
  .photo-note{font-size:13px; color:var(--grey); margin:6px 0;}
  .photo-full{max-width:100%; max-height:76vh; display:block; margin:0 auto; border-radius:8px;}
  .sw-modal.photo-modal{max-width:900px;}

  .id-preview{background:var(--soft); border:1.5px dashed var(--field); border-radius:8px; padding:10px 12px; font-size:16px; font-weight:700; color:var(--ink); margin-bottom:6px; min-height:44px; letter-spacing:.02em; word-break:break-word;}
  .id-preview.pending{color:var(--grey); font-weight:400; font-style:italic; font-size:14px;}
  .id-note{font-size:12.5px; color:var(--grey); margin:0 0 14px;}
  .id-note.retest{color:var(--red); font-weight:600;}

  .check-item{display:flex; align-items:center; justify-content:space-between; gap:10px; border-top:1px solid var(--line); padding:9px 0; flex-wrap:wrap;}
  .check-item:first-child{border-top:none; padding-top:0;}
  .check-item .check-label{flex:1; min-width:160px; font-size:15px; font-weight:600; color:var(--ink);}
  .check-item .error-msg{width:100%; margin:2px 0 0;}

  .entry{border:1px solid var(--line); border-radius:12px; margin-bottom:14px; overflow:hidden;}
  .entry-head{background:var(--ink); color:#fff; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .entry-head .etag{background:var(--red); font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:13px; letter-spacing:.05em; padding:3px 9px; border-radius:6px; text-transform:uppercase; flex-shrink:0;}
  .entry-head .eq-id{font-weight:600; font-size:14px; flex:1; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry-head button{background:none; border:none; color:var(--hdr-link); font-size:14px; cursor:pointer; font-weight:600; flex-shrink:0; min-height:36px;}
  .entry-body{padding:14px;}

  .add-btn{width:100%; min-height:52px; padding:13px; background:#fff; border:2px dashed var(--red); color:var(--red); border-radius:10px; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:17px; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; margin-bottom:6px;}
  .empty-note{text-align:center; color:var(--grey); font-size:14.5px; padding:18px 0;}

  .save-entry-btn{width:100%; min-height:52px; padding:14px; background:var(--red); color:#fff; border:none; border-radius:10px; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:19px; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; margin-top:6px;}
  .save-entry-btn:hover{background:var(--red-dark);}
  @media (min-width:1000px){ .save-entry-btn{max-width:420px;} }

  .banner{display:none; font-weight:600;}
  .banner.ok{background:var(--green-bg); color:var(--green); border-color:var(--green-line);}
  .banner.wait{background:var(--amber-bg); color:#4d3300; border-color:var(--amber-line);}
  .banner button{background:#fff; border:1.5px solid currentColor; color:inherit; border-radius:8px; padding:4px 10px; font-weight:700; font-size:13.5px; cursor:pointer; margin-left:8px;}

  .today-item{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line);}
  .today-item:first-child{border-top:none;}
  .today-item .id{font-weight:700; font-size:15px; word-break:break-word;}
  .today-item .cat{font-size:12.5px; color:var(--grey);}
  .sent-tag{font-size:12px; font-weight:700; padding:2px 8px; border-radius:20px; white-space:nowrap;}
  .sent-tag.ok{background:var(--green-bg); color:var(--green);}
  .sent-tag.wait{background:var(--amber-bg); color:var(--amber);}

  /* ---- register ---- */
  .reg-count{display:flex; gap:22px; flex-wrap:wrap; align-items:flex-end; margin:0 0 14px;}
  .reg-count .n{font-family:'Barlow Condensed',sans-serif; font-size:30px; font-weight:700; line-height:1.05;}
  .reg-count .l{font-size:12px; color:var(--grey); text-transform:uppercase; letter-spacing:.03em; font-weight:600;}
  .reg-count .of{font-size:13.5px; color:var(--grey); font-weight:600; align-self:center;}
  .reg-tools{display:grid; grid-template-columns:minmax(0,1fr); gap:0 12px;}
  @media (min-width:900px){ .reg-tools{grid-template-columns:minmax(0,2fr) minmax(0,3fr);} }
  .reg-filters-btn{display:none; width:100%; min-height:44px; padding:10px; margin-bottom:12px; background:#fff; border:1.5px solid var(--field); border-radius:8px; font-weight:700; font-size:15px; cursor:pointer;}
  .reg-filters{display:flex; gap:8px 12px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .reg-filters select{flex:1 1 200px; margin:0;}
  .reg-filters label.tick{align-items:center; font-size:15px; font-weight:600; margin:0; min-height:40px;}
  @media (max-width:699px){
    .reg-filters-btn{display:block;}
    .reg-filters{display:none;}
    .reg-filters.open{display:flex;}
    .reg-filters select{flex-basis:100%;}
  }
  .reg-subtabs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .reg-subtabs .chip{min-height:38px;}
  #regList{display:grid; grid-template-columns:minmax(0,1fr); gap:10px; align-items:start;}
  @media (min-width:700px){ #regList{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (min-width:1150px){ #regList{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));} }
  #regList .reg-item.editing-full{grid-column:1 / -1;}
  #regList > .history-empty, #regList > .loading-note{grid-column:1 / -1;}

  .reg-item{border:1px solid var(--line); border-radius:12px; padding:12px; min-width:0; background:#fff;}
  .reg-item.overdue{border-color:var(--red); background:#fff8f8;}
  .reg-item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px;}
  .reg-item .eq{font-weight:700; font-size:16px; word-break:break-word; overflow-wrap:anywhere;}
  .reg-item .cat{font-size:12px; color:var(--grey); text-transform:uppercase; letter-spacing:.03em; font-weight:600;}
  .reg-item .meta{font-size:13px; color:var(--grey); margin-top:4px;}
  .reg-item .meta.overdue-text{color:var(--red); font-weight:700;}
  .st{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;}
  .st.pass{background:var(--green-bg); color:var(--green);}
  .st.fail{background:var(--red-tint); color:var(--red-dark);}
  .st.overdue{background:var(--red); color:#fff;}
  .st.wait{background:var(--amber-bg); color:var(--amber);}
  .st.flagged{background:#eeece7; color:var(--grey);}
  .reg-item-bottom{display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:8px; flex-wrap:wrap;}
  .expand-btn{background:none; border:none; color:var(--grey); font-size:14px; font-weight:600; cursor:pointer; text-decoration:underline; padding:10px 0; min-height:40px;}
  .retest-btn{min-height:44px; background:#fff; border:1.5px solid var(--red); color:var(--red); font-size:15px; font-weight:700; padding:8px 16px; border-radius:8px; cursor:pointer;}
  .hist-list{margin-top:10px; border-top:1px dashed var(--line); padding-top:8px;}
  .hist-row{padding:8px 0; border-bottom:1px solid var(--line);}
  .hist-row:last-child{border-bottom:none;}
  .hist-row-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; flex-wrap:wrap;}
  .hist-btns{display:flex; gap:6px; flex-wrap:wrap;}
  .hist-date{font-size:14px; font-weight:600; display:flex; align-items:center; flex-wrap:wrap; gap:6px;}
  .hist-meta{font-size:12.5px; color:var(--grey); margin-top:1px;}
  .history-empty{color:var(--grey); font-size:14px; text-align:center; padding:16px 0;}
  .loading-note{color:var(--grey); font-size:14px; text-align:center; padding:6px 0;}

  /* last time / since last report */
  .last-time{background:var(--soft); border:1px solid var(--line); border-left:4px solid var(--grey); border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:14px;}
  .last-time.was-fail{border-left-color:var(--red);}
  .last-time .lt-head{font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:15px; margin:0 0 6px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;}
  .last-time .lt-row{margin:4px 0 0;}
  .lt-label{font-weight:700; color:var(--grey); font-size:12px; text-transform:uppercase; letter-spacing:.03em; display:block;}
  .lt-text{white-space:pre-wrap;}
  .hist-detail{font-size:13.5px; color:var(--ink); margin-top:4px; line-height:1.45;}
  .hist-detail .lt-label{font-size:11.5px; margin-top:4px;}
  .since-tag{font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; display:inline-block; margin-top:5px;}
  .since-tag.retested{background:var(--green-bg); color:var(--green);}
  .since-tag.newitem{background:var(--blue-bg); color:var(--blue);}
  .since-tag.notyet{background:#eeece7; color:var(--grey);}
  .since-tag.notyet.was-fail{background:var(--red-tint); color:var(--red-dark);}
  .retest-summary{display:none; background:var(--amber-bg); color:#4d3300; border:1px solid var(--amber-line); border-radius:10px; padding:10px 12px; font-size:14.5px; font-weight:600; margin-bottom:12px; cursor:pointer;}
  .retest-summary .sub{display:block; font-weight:400; font-size:13.5px; margin-top:2px;}

  .undo-toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:400; display:flex; align-items:center; gap:12px; background:var(--ink); color:#fff; padding:11px 14px; border-radius:10px; font-size:14px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.25); width:max-content; max-width:calc(100vw - 24px);}
  .undo-toast button{background:#fff; color:var(--ink); border:none; border-radius:8px; padding:8px 14px; font-weight:700; font-size:14px; cursor:pointer; flex-shrink:0;}

  /* type-ahead suggestions */
  .sug-box{position:absolute; z-index:300; background:#fff; border:1.5px solid var(--ink); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.18); max-height:300px; overflow:auto;}
  .sug-head{font-size:12px; font-weight:700; color:var(--grey); text-transform:uppercase; letter-spacing:.03em; padding:8px 12px 2px;}
  .sug-opt{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 12px; font-size:15.5px; cursor:pointer; border-top:1px solid var(--line);}
  .sug-opt:first-child, .sug-head + .sug-opt{border-top:none;}
  .sug-opt small{color:var(--grey); font-size:12.5px; white-space:nowrap;}
  .sug-opt:hover, .sug-opt.on{background:var(--red-tint);}
  .sug-note{position:absolute; z-index:300; background:var(--ink); color:#fff; font-size:13px; font-weight:600; padding:6px 10px; border-radius:6px;}

  @media (max-width:640px){
    header h1{font-size:16px;}
    header .who .name{display:none;}
    main{padding:12px;}
    .card{padding:14px;}
    .tabs .wrap{gap:2px;}
  }
  /* ---- gates & doors (v1.0): additions to the isolator page's styles ---- */
  .wrap{max-width:1200px;}
  .gt-title{font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; font-size:22px; margin:0 0 4px;}
  .gt-sub{color:var(--grey); font-size:14px; margin:0 0 12px;}
  .inst-grid{display:grid; grid-template-columns:minmax(0,1fr); gap:10px;}
  @media (min-width:760px){ .inst-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (min-width:1150px){ .inst-grid{grid-template-columns:repeat(3,minmax(0,1fr));} }
  .inst-card{border:1px solid var(--line); border-radius:12px; padding:12px; background:#fff; cursor:pointer;}
  .inst-card:hover{border-color:var(--ink);}
  .inst-card .nm{font-weight:700; font-size:16px;} .inst-card .ty{font-size:12px; color:var(--grey); text-transform:uppercase; letter-spacing:.03em; font-weight:600;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .tag{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; background:#eeece7; color:var(--grey);}
  .tag.ok{background:var(--green-bg); color:var(--green);} .tag.bad{background:var(--red-tint); color:var(--red-dark);}
  .tag.wait{background:var(--amber-bg); color:var(--amber);} .tag.info{background:var(--blue-bg); color:var(--blue);} .tag.dark{background:var(--ink); color:#fff;}
  .tag.over{background:var(--red); color:#fff;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:9px 16px; font-size:15px; font-weight:700; background:#fff; border:1.5px solid var(--field); border-radius:8px; cursor:pointer; color:var(--ink);}
  .btn.red{background:var(--red); border-color:var(--red); color:#fff;} .btn.dark{background:var(--ink); border-color:var(--ink); color:#fff;}
  .btn.green{background:var(--green); border-color:var(--green); color:#fff;} .btn.sm{min-height:38px; padding:6px 12px; font-size:14px;}
  .btn.warn{border-color:var(--red); color:var(--red);} .btn:disabled{opacity:.45; cursor:not-allowed;}

<body>

<div id="signinScreen">

  <button class="ms-btn" id="msSignInBtn">Sign in with Microsoft</button>

</div>

<div id="appRoot">
  <header>
    <a class="brand" href="index.html" title="Home">
      <img src="sw-logo-white.png" alt="Simpson & Wood">
      <div><h1>Gates &amp; Doors Inspection</h1><p id="versionLabel">v1.0</p></div>
    </a>

  </header>

  </div></main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, OAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
  onAuthStateChanged, signOut, reauthenticateWithPopup as _reauthPopup
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection,

  setDoc as fsSetDoc, writeBatch as fsWriteBatch
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import * as SWS from './sw-shared.js';
import * as G from './gate-shared.js';
const { esc, TYPES, typeLabel, leafList, ANSWER_STATES, NOT_DONE_STATES, TASK_OUTCOMES, PROTECTION, INTERVALS, METRICS } = G;

const VERSION = "v1.0";
document.getElementById('versionLabel').textContent = VERSION;
console.log('Gates & doors inspection', VERSION, 'shared', G.GATE_SHARED_VERSION);

const firebaseConfig = {
  apiKey: "AIzaSyB5foKhRfIMG91bD5QyT7hHd1XBbeQGucw",
  authDomain: "simpson-wood-engineer-app.firebaseapp.com",
  projectId: "simpson-wood-engineer-app",
  storageBucket: "simpson-wood-engineer-app.firebasestorage.app",
  messagingSenderId: "201961281346",
  appId: "1:201961281346:web:3c7386b73b41ce9df35adb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
const msProvider = new OAuthProvider('microsoft.com');
msProvider.setCustomParameters({ tenant: 'abd23e0c-2d96-49ad-a280-99ff317f7d60' });
msProvider.addScope('Mail.Send');   // for the unsafe notice only (standards §1.1)

SWS.swSetup({ db, auth, page: 'gate-test', version: VERSION });
const viewingAs = () => SWS.swViewingAs();
const isVaError = e => e && String(e.message || '').includes(SWS.SW_VA_MSG);
const setDoc = SWS.swGuard(fsSetDoc), writeBatch = SWS.swGuardBatch(fsWriteBatch);
const reauthenticateWithPopup = SWS.swGuard(_reauthPopup);

// ── State ─────────────────────────────────────────────────────────────────
const S = {
  user: null, level: 'engineer', sites: [], site: null, insts: [], inst: null, test: null, tests: [], prev: null,
  rules: G.clone(G.DEFAULT_RULES), rulesApproved: false, rulesId: null, testers: [], directors: [], view: 'home',
  wiz: { step: 0 }, open: new Set(['checks', 'force']), photos: [], access: null, plan: null
};
const $ = id => document.getElementById(id);
const meEmail = () => { const va = viewingAs(); return va ? va.email : String((S.user && S.user.email) || '').toLowerCase(); };
const meName = () => { const va = viewingAs(); return va ? va.name : ((S.user && (S.user.displayName || S.user.email)) || ''); };
const K = id => String(id).replace(/[.\/]/g, '_');      // Firestore-safe key
const banner = (txt, cls = 'wait') => { const b = $('banner'); if (!txt) { b.style.display = 'none'; return; } b.className = 'banner ' + cls; b.textContent = txt; b.style.display = 'block'; };
const scrollTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

// Every write goes through this: not awaited (offline-safe), failures reported.
function write(p, what) {
  Promise.resolve(p).catch(e => {
    if (isVaError(e)) { banner(SWS.SW_VA_MSG, 'wait'); return; }
    console.error(what, e); SWS.swReport('save', what + ' didn\'t save: ' + (e && (e.code || e.message) || 'unknown'));
    banner(what + ' did not save (' + (e && (e.code || e.message) || 'error') + '). Tell Rob if it keeps happening.', 'wait');
  });
}
const clean = o => JSON.parse(JSON.stringify(o, (k, v) => (k[0] === '_' ? undefined : (v === undefined ? null : v))));
const audit = (action, extra = {}) => { if (viewingAs()) return; write(setDoc(doc(collection(db, 'gateAudit')), { at: serverTimestamp(), atISO: new Date().toISOString(), by: meEmail(), action, ...extra }), 'Audit record'); };

// ── Sign-in ───────────────────────────────────────────────────────────────
function describeAuthError(err) {
  if (err.code === 'auth/unauthorized-domain') return 'This site\'s domain isn\'t authorised in Firebase yet.';
  if (err.code === 'auth/operation-not-allowed') return 'Microsoft sign-in isn\'t enabled in Firebase yet.';
  if (['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(err.code)) return null;
  return 'Sign-in failed — ' + (err.code || err.message || 'unknown error') + '.';
}
function keepToken(result) {
  try {
    const cred = OAuthProvider.credentialFromResult(result);
    if (cred && cred.accessToken) sessionStorage.setItem('gate-graph', JSON.stringify({ t: cred.accessToken, exp: Date.now() + 50 * 60000, who: ((result.user && result.user.email) || '').toLowerCase() }));
  } catch (e) { console.warn('token not kept', e); }
}
const storedToken = () => { try { const o = JSON.parse(sessionStorage.getItem('gate-graph') || 'null'); return o && o.exp > Date.now() && o.who === String(auth.currentUser && auth.currentUser.email || '').toLowerCase() ? o.t : null; } catch (e) { return null; } };
$('msSignInBtn').addEventListener('click', () => {
  const errBox = $('signinErr'); errBox.textContent = '';
  signInWithPopup(auth, msProvider).then(keepToken).catch(err => {
    if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
      signInWithRedirect(auth, msProvider).catch(err2 => { const m = describeAuthError(err2); if (m) errBox.textContent = m; });
      return;
    }
    const m = describeAuthError(err); if (m) errBox.textContent = m;
  });
});
$('signOutBtn').addEventListener('click', () => signOut(auth));
getRedirectResult(auth).then(r => { if (r) keepToken(r); }).catch(err => { $('signinErr').textContent = 'Sign-in failed — ' + (err.message || 'try again.'); });

let booted = false;
onAuthStateChanged(auth, async user => {
  S.user = user;
  if (!user) { $('signinScreen').style.display = 'flex'; $('appRoot').style.display = 'none'; return; }
  $('signinScreen').style.display = 'none'; $('appRoot').style.display = 'block';
  if (booted) return; booted = true;
  const va = await SWS.swViewAsInit(user);
  $('whoName').textContent = va ? va.name : (user.displayName || user.email);
  try { S.level = (await SWS.swAccess(va ? va.email : user.email)).level; } catch (e) {}
  SWS.swExtrasStart({ page: 'gate-test', version: VERSION, level: S.level, news: NEWS, help: HELP, tab: () => ({ home: 'Sites', inst: 'Gate or door', wiz: 'Set-up', insp: 'Inspection' }[S.view] || '') });
  SWS.swuStart();
  boot();
});
window.swUpdateBlocker = () => {
  if (S.test && S.test._dirty) return 'Your inspection is still saving. Wait a moment, then tap Update.';
  if (S.view === 'insp' || S.view === 'wiz') return 'Finish or leave the form you are in, then tap Update.';
  if (SWS.swuMine().some(x => !x.failed)) return 'Wait until your work has sent (the yellow bar goes), then tap Update.';
  return '';
};

// ── Loading ───────────────────────────────────────────────────────────────
async function boot() {
  try {
    const [sitesS, rulesS, testersS, staffS] = await Promise.all([
      getDocs(collection(db, 'gateSites')), getDocs(collection(db, 'gateRules')),
      getDocs(collection(db, 'gateTesters')), getDocs(query(collection(db, 'staff'), where('position', '==', 'Director')))
    ]);
    S.sites = sitesS.docs.map(d => ({ id: d.id, ...d.data() })).filter(s => !s.deletedFlag).sort((a, b) => String(a.siteName).localeCompare(String(b.siteName)));
    const approved = rulesS.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.status === 'Approved').sort((a, b) => (b.version || 0) - (a.version || 0));
    if (approved.length) { S.rules = approved[0].rules; S.rulesApproved = true; S.rulesId = approved[0].id; S.rulesVersion = approved[0].version; }
    S.testers = testersS.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => t.active !== false);
    S.directors = staffS.docs.map(d => String(d.data().email || d.id).toLowerCase());
  } catch (e) {
    console.error(e); if (navigator.onLine) SWS.swReport('load', 'Gate lists didn\'t load: ' + (e.code || e.message));
    banner('The site list could not load (' + (e.code || e.message) + '). If you have no signal, anything already saved on this phone still shows.', 'wait');
  }
  const want = new URLSearchParams(location.search).get('site');
  if (want) { const s = S.sites.find(x => x.siteRef === want || x.id === want); if (s) { S.site = s; await loadInsts(); } }
  go('home');
}
async function loadInsts() {
  S.insts = [];
  if (!S.site) return;
  try {
    const snap = await getDocs(query(collection(db, 'gateInstallations'), where('siteRef', '==', S.site.siteRef)));
    S.insts = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(i => !i.deletedFlag).sort((a, b) => String(a.name).localeCompare(String(b.name)));
  } catch (e) { if (navigator.onLine) SWS.swReport('load', 'Gate list didn\'t load: ' + (e.code || e.message)); }
}
async function loadTests(instId) {
  try {
    const snap = await getDocs(query(collection(db, 'gateTests'), where('installationId', '==', instId)));
    S.tests = snap.docs.map(d => ({ _id: d.id, ...d.data() })).filter(t => !t.deletedFlag).sort((a, b) => String(b.date).localeCompare(String(a.date)) || 0);
  } catch (e) { S.tests = []; if (navigator.onLine) SWS.swReport('load', 'Past inspections didn\'t load: ' + (e.code || e.message)); }
  S.prev = S.tests.find(t => t.kind === 'periodic' && t.status === 'Approved' && !t.testData) || null;
}

// ── Navigation ────────────────────────────────────────────────────────────
function go(view) {
  S.view = view; banner('');
  const v = $('view');
  v.innerHTML = ({ home: homeHTML, inst: instHTML, wiz: wizHTML, insp: inspHTML }[view])();
  scrollTop();
}
function rerender() {
  const y = window.scrollY, v = $('view');

}
const crumb = (...parts) => `<div class="crumb">${parts.map(p => p).join(' <span class="small">›</span> ')}</div>`;
const link = (act, txt, extra = '') => `<a data-act="${act}" ${extra}>${txt}</a>`;

  const t = [];
  const st = G.dueState(i.dueMonth);
  if (!i.setupStatus || i.setupStatus === 'Draft') t.push('<span class="tag wait">Set-up not approved</span>');

  if (i.dueMonth) t.push(`<span class="tag ${st === 'overdue' ? 'over' : st === 'due' ? 'bad' : 'info'}">${st === 'overdue' ? 'Overdue since ' + G.monthLabel(G.addMonths(i.dueMonth, 1)) : 'Due ' + G.monthLabel(i.dueMonth)}</span>`);
  if (i.testData) t.push('<span class="tag dark">Practice</span>');
  return t.join('');
};

// ═══ HOME: pick a site, see its gates ═══
function homeHTML() {
  const opts = S.sites.map(s => `<option value="${esc(s.id)}" ${S.site && S.site.id === s.id ? 'selected' : ''}>${esc(s.siteName)} (${esc(s.siteRef)})</option>`).join('');
  let h = `<div class="card"><p class="section-label">Site</p>

    <button class="btn" data-act="refresh"><i class="ti ti-refresh"></i> Refresh</button>
    <button class="btn" data-act="newsite"><i class="ti ti-plus"></i> Add a new site</button></div>
    <div id="newSiteBox"></div></div>`;
  if (!S.rulesApproved) h += `<div class="box warn"><h4>Practice only for force tests</h4>The test rules have not been approved yet, so any inspection you start is saved as <b>practice</b>. Real force testing starts once management approves the rules.</div>`;
  if (S.site) {
    h += `<div class="card"><p class="section-label">${esc(S.site.siteName)}</p><p class="gt-sub">${esc([S.site.addressLine, S.site.postcode].filter(Boolean).join(', '))}</p>`;
    if (!S.insts.length) h += `<div class="empty-note">No gates or doors on this site yet.</div>`;
    else h += `<div class="inst-grid">${S.insts.map(i => `<div class="inst-card" data-act="openinst" data-id="${esc(i.id)}"><div class="ty">${esc(typeLabel(i.type))}</div><div class="nm">${esc(i.name)}</div><div class="small">${esc(i.location || '')}</div><div class="chips">${statusTags(i)}</div></div>`).join('')}</div>`;

}
function newSiteForm() {
  return `<div class="fgrid" style="margin-top:12px"><div class="fld"><label>Customer / site name</label><input type="text" id="nsName"></div>
  <div class="fld"><label>Site reference <span class="hint">Suggested. It can't be changed later.</span></label><input type="text" id="nsRef"></div>
  <div class="fld"><label>Address line</label><input type="text" id="nsAddr"></div>
  <div class="fld"><label>Postcode</label><input type="text" id="nsPost" style="text-transform:uppercase"></div>
  <div class="fld full"><label>Agreed with / limits</label><input type="text" id="nsAgreed"></div></div>

}
function suggestRef(name) { const w = String(name).toUpperCase().replace(/[^A-Z0-9 ]/g, '').split(/\s+/).filter(Boolean); let r = (w.length > 1 ? w.map(x => x[0]).join('') : (w[0] || 'SITE').slice(0, 5)); let n = r, k = 1; while (S.sites.some(s => s.siteRef === n)) n = r + (++k); return n; }
async function saveSite() {
  const name = $('nsName').value.trim(), ref = ($('nsRef').value.trim() || suggestRef(name)).toUpperCase().replace(/\s+/g, '-');
  if (!name) return alert('Give the site a name.');
  if (S.sites.some(s => s.siteRef === ref)) return alert('That site reference is already used.');
  const rec = { siteRef: ref, siteName: name, addressLine: $('nsAddr').value.trim(), postcode: $('nsPost').value.trim().toUpperCase(), agreedWith: $('nsAgreed').value.trim(), createdBy: meEmail(), createdAt: serverTimestamp() };
  write(setDoc(doc(db, 'gateSites', ref), rec), 'New site'); audit('site-created', { siteRef: ref });
  const local = { id: ref, ...rec, createdAt: null }; S.sites.push(local); S.sites.sort((a, b) => String(a.siteName).localeCompare(String(b.siteName)));
  S.site = local; S.insts = []; rerender();
}

// ═══ ONE GATE OR DOOR ═══
async function openInst(id) {
  S.inst = S.insts.find(i => i.id === id); if (!S.inst) return;
  S.access = null; S.tests = []; S.prev = null;
  go('inst');
  await loadTests(id);
  try { const a = await getDoc(doc(db, 'gateAccess', id)); S.access = a.exists() ? (a.data().codes || '') : ''; } catch (e) { S.access = ''; }
  if (S.view === 'inst' && S.inst && S.inst.id === id) rerender();
}
function instHTML() {
  const i = S.inst; if (!i) return '';
  const mine = (S.tests || []).filter(t => t.kind === 'periodic' && ['Draft', 'Returned'].includes(t.status) && t.engineerEmail === meEmail());
  const setupT = (S.tests || []).find(t => t.kind === 'setup');
  const hasPlan = (i.hazards || []).length > 0 && !(TYPES[i.type] || {}).unsupported;
  let h = crumb(link('home', 'Sites'), link('home', esc(S.site ? S.site.siteName : '')), `<b>${esc(i.name)}</b>`);
  h += `<div class="card"><div class="ty small">${esc(typeLabel(i.type))} · ${i.operation === 'Manual' ? 'Manual' : 'Powered'}</div><h2 class="gt-title">${esc(i.name)}</h2><p class="gt-sub">${esc(i.location || '')}</p><div class="chips">${statusTags(i)}${i.intervalMonths ? `<span class="tag info">Every ${i.intervalMonths} months</span>` : ''}</div>`;
  if (setupT && setupT.status !== 'Approved') h += `<div class="box info" style="margin-top:10px">Set-up sent to QS: <b>${esc(setupT.status)}</b>${setupT.returnNote ? ' — ' + esc(setupT.returnNote) : ''}</div>`;
  if (i.setupChangedAfterApproval) h += `<div class="box warn" style="margin-top:10px">The set-up was changed after it was approved. Send it to QS again.</div>`;
  h += `<div class="btns"><button class="btn red" data-act="startinsp" ${hasPlan ? '' : 'disabled'}><i class="ti ti-clipboard-check"></i> Start inspection</button>
   <button class="btn" data-act="editsetup"><i class="ti ti-edit"></i> ${i.setupStatus === 'Approved' ? 'View / change set-up' : 'Set-up and risk assessment'}</button></div>`;

function compressImage(file, maxSide = 1280, targetKB = 200) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, maxSide / Math.max(img.width, img.height)), w = Math.round(img.width * sc), h = Math.round(img.height * sc);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      let q = 0.8, out = c.toDataURL('image/jpeg', q);
      while (out.length * 0.75 > targetKB * 1024 && q > 0.35) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(url); resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That photo could not be read.')); };
    img.src = url;
  });
}
async function addPhoto(file) {
  if (!file) return;
  try {
    const data = await compressImage(file), n = (S.photos.reduce((m, p) => Math.max(m, p.n || 0), 0)) + 1, cap = ($('photoCap') || {}).value || '';
    const id = `${S.test._id}_${n}`;
    const rec = { testId: S.test._id, installationId: S.inst.id, siteRef: S.inst.siteRef, n, caption: cap, photoBase64: data, engineerEmail: meEmail(), testData: !!S.test.testData, createdAt: serverTimestamp() };
    saveTest(true);
    write(setDoc(doc(db, 'gatePhotos', id), rec), 'Photo');
    S.photos.push({ id, ...rec, createdAt: null }); S.open.add('photos'); rerender();
  } catch (e) { alert(e.message || 'Photo failed.'); }
}

const MS_WINDOW_MS = 2 * 60000;
function msWhy(err) {
  const c = (err && err.code) || '';

  if (c === 'auth/popup-blocked') return 'Your phone blocked the Microsoft window.';
  if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return 'The Microsoft window was closed before it finished.';
  if (c === 'auth/user-mismatch') return 'That was a different Microsoft account. Choose your Simpson & Wood one.';
  if (c === 'auth/network-request-failed') return 'No signal.';
  if (c === 'gate/ms-timeout') return 'The Microsoft window did not finish.';
  return 'Microsoft sign-in failed (' + (c || (err && err.message) || 'unknown') + ').';
}
function getToken() {   // must be called straight from the tap: the window opens at once

  let timer; const p = reauthenticateWithPopup(auth.currentUser, msProvider);
  p.then(keepToken, () => {});
  const late = new Promise((_, rej) => { timer = setTimeout(() => rej(Object.assign(new Error('timeout'), { code: 'gate/ms-timeout' })), MS_WINDOW_MS); });
  return Promise.race([p, late]).then(() => { clearTimeout(timer); const x = storedToken(); if (!x) throw new Error('Microsoft did not give the app permission to send email.'); return x; }, err => { clearTimeout(timer); throw new Error(msWhy(err)); });
}

}

  if (gaps.length && !(t.limited && String(t.limited.reason || '').trim())) return alert('Say why it was not finished, so it can be sent as a limited inspection.');
  if (t.defects.some(d => d.severity === 'Unsafe' && !((t.notices || {})[d.id] || {}).sent)) return alert('Send the unsafe notice first (Defects).');
  const bad = t.defects.find(d => !String(d.text || '').trim()); if (bad) return alert('A defect has no description.');
  t.limited = gaps.length ? { ...t.limited, items: gaps.map(g => g.text).slice(0, 60) } : null;
  t.planSnapshot = S.plan.points.map(p => ({ id: K(p.id), label: p.label, kind: p.kind, hazardClass: p.hazardClass, direction: p.direction, leaf: p.leaf, group: p.group || null }));
  t.checkSnapshot = S.plan.checks.map(c => ({ id: K(c.id), label: c.label, kind: c.kind }));
  t.taskSnapshot = (i.tasks || []).map(x => ({ id: x.id, text: x.text }));
  t.deviceSnapshot = (i.devices || []).filter(d => !d.retired).map(d => ({ id: d.id, name: d.name, kind: d.kind || '' }));
  t.hazardSnapshot = (i.hazards || []).map(h => ({ id: h.id, label: h.label, protection: h.protection, cls: h.cls }));
  t.overall = G.overallLabel(t, S.plan, S.rules).label;
  t.intervalMonths = i.intervalMonths; t.setupStatusAtTest = i.setupStatus || 'Draft';
  t.signOff = { name: meName(), at: new Date().toISOString() };
  t.status = 'Submitted'; t.qsed = false;
  saveTest(true);
  SWS.swuAdd({ c: 'gateTests', id: t._id, label: i.name, app: 'Gates and doors', site: i.siteName });
  audit('inspection-submitted', { installationId: i.id, testId: t._id });
  S.tests = [{ ...G.clone(t), _id: t._id }, ...(S.tests || []).filter(x => x._id !== t._id)];
  banner(`${i.name} saved on this phone. Sending to the office…`, 'wait');
  S.test = null; go('inst');
}

// ═══ Events ═══
function setPath(path, val) {
  const parts = path.split('.'); let o = parts[0] === 'inst' ? S.inst : S.test;
  for (let k = 1; k < parts.length - 1; k++) { if (o[parts[k]] == null || typeof o[parts[k]] !== 'object') o[parts[k]] = {}; o = o[parts[k]]; }
  o[parts[parts.length - 1]] = val;
}
const touched = path => { if (path.startsWith('inst')) queueInstSave(); else saveTest(); };

function onReading(el) {
  const pk = el.dataset.pk, idx = +el.dataset.i, m = el.dataset.m, t = S.test;
  const p = S.plan.points.find(x => K(x.id) === pk); if (!p) return;
  const rds = t.readings[pk] = t.readings[pk] || [];
  while (rds.length <= idx) rds.push({ fd: null, td: null, fs: null, fe: null });
  const r = G.parseReading(el.value), errEl = $('rerr_' + pk);
  rds[idx][m] = r.value != null ? r.value : null;
  const lim = G.pointLimits(p, S.rules);
  el.classList.toggle('over', r.value != null && r.value > lim[m]);
  el.classList.toggle('unusual', r.value != null && G.isUnusual(m, r.value));
  if (r.error) { errEl.textContent = r.error; errEl.style.display = 'block'; } else if (r.value != null && G.isUnusual(m, r.value)) { errEl.textContent = 'That is a very high number. Check the tester screen.'; errEl.style.display = 'block'; } else errEl.style.display = 'none';
  const ev = G.evaluatePoint(p, rds, S.rules);
  if (ev.state !== 'empty' && !rds[idx].at && METRICS.every(x => rds[idx][x.k] != null)) rds[idx].at = new Date().toISOString();
  const card = $('pt_' + pk); card.className = 'pt ' + ev.state;
  $('sum_' + pk).innerHTML = sumHTML(p);
  const rowsEl = $('rows_' + pk), want = Math.max(rds.length, ev.required || 1);
  for (let k = rowsEl.children.length; k < want; k++) rowsEl.insertAdjacentHTML('beforeend', rowHTML(pk, k, rds[k], false));
  if (ev.complete && p.kind !== 'followup') { /* follow-up targets update when sections next render */ }
  saveTest();
}

document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList && el.classList.contains('rdi')) return onReading(el);
  const bind = el.dataset && el.dataset.bind; if (!bind || el.tagName === 'SELECT' || el.type === 'checkbox') return;
  let v = el.value; if (el.dataset.num) v = v === '' ? null : Number(v);
  setPath(bind, v); touched(bind);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'siteSel') { S.site = S.sites.find(s => s.id === el.value) || null; loadInsts().then(rerender); return; }
  if (el.id === 'photoIn') { addPhoto(el.files[0]); el.value = ''; return; }
  const bind = el.dataset && el.dataset.bind; if (!bind) return;
  if (el.tagName !== 'SELECT' && el.type !== 'checkbox') return;
  let v = el.type === 'checkbox' ? el.checked : el.value; if (el.dataset.num) v = v === '' ? null : Number(v);
  if (bind === 'test.testerId') { const tt = S.testers.find(x => x.id === v); S.test.tester = tt ? { id: tt.id, name: tt.name, serial: tt.serial || '', calibrationDue: tt.calibrationDue || '', calibrationDate: tt.calibrationDate || '' } : null; saveTest(); return rerender(); }
  if (bind === 'inst.type' && S.inst.hazards && S.inst.hazards.length && !confirm('Changing the type keeps your hazards. Check them again on the Hazards step. Continue?')) return rerender();
  if (bind === 'inst.type') S.inst.leaves = null;
  setPath(bind, v); touched(bind);
  if (el.dataset.rr) rerender();
});
document.addEventListener('toggle', e => { const s = e.target.dataset && e.target.dataset.sec; if (s) { if (e.target.open) S.open.add(s); else S.open.delete(s); } }, true);

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, i = S.inst, t = S.test;
  switch (a) {
    case 'home': S.inst = null; S.test = null; await loadInsts(); return go('home');
    case 'inst': if (S.view === 'insp' && t && t._dirty) saveTest(true); if (S.view === 'wiz') saveInst(); S.test = null; if (i) { await openInst(i.id); } return;
    case 'refresh': await boot(); return;
    case 'newsite': $('newSiteBox').innerHTML = newSiteForm(); $('nsName').addEventListener('input', () => { if (!$('nsRef').dataset.touched) $('nsRef').value = suggestRef($('nsName').value); }); $('nsRef').addEventListener('input', () => $('nsRef').dataset.touched = '1'); return;
    case 'savesite': return saveSite();
    case 'openinst': return openInst(el.dataset.id);
    case 'newinst': return startWizard(newInstObj(''), 0);
    case 'editsetup': return startWizard(i, 1);
    case 'startinsp': return startInspection();
    case 'resumeinsp': return startInspection(el.dataset.id);
    case 'saveaccess': write(setDoc(doc(db, 'gateAccess', i.id), { codes: $('accessCodes').value, installationId: i.id, siteRef: i.siteRef, updatedBy: meEmail(), updatedAt: serverTimestamp() }), 'Access notes'); S.access = $('accessCodes').value; banner('Access notes saved.', 'ok'); return;
    // wizard
    case 'set': setPath(el.dataset.path, el.dataset.val); queueInstSave(); return rerender();
    case 'multi': { const parts = el.dataset.path; const cur = (() => { const pp = parts.split('.'); let o = S.inst; for (let k = 1; k < pp.length; k++) o = o && o[pp[k]]; return Array.isArray(o) ? o : []; })(); const v = el.dataset.val; setPath(parts, cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v]); queueInstSave(); return rerender(); }
    case 'step': S.wiz.step = +el.dataset.n; if (i.name || i.type) saveInst(); return rerender();
    case 'next': if (S.wiz.step === 1 && (!i.name || !i.type || !i.location)) return alert('Give it a name, say where it is and choose the type.'); if (S.wiz.step === 0 && !i.route) return alert('Choose how we are coming to this one.'); S.wiz.step++; saveInst(); return go('wiz');
    case 'back': S.wiz.step--; return go('wiz');
    case 'savedraft': if (i.name || i.type) { saveInst(); banner('Saved.', 'ok'); } S.test = null; await loadInsts(); return i.name ? openInst(i.id) : go('home');
    case 'seedhz': i.hazards = G.seedHazards(i.type); saveInst(); return rerender();
    case 'addhz': i.hazards = [...(i.hazards || []), { id: G.newId('h'), label: '', location: '', movement: 'both', cls: 'crush', mainEdge: false, protection: 'none', evidence: '', verifyBy: 'direct' }]; return rerender();
    case 'delhz': if (confirm('Delete this hazard?')) { i.hazards.splice(+el.dataset.n, 1); saveInst(); rerender(); } return;
    case 'adddev': i.devices = [...(i.devices || []), { id: G.newId('d'), name: '', kind: G.DEVICE_KINDS[0], location: '', battery: {} }]; return rerender();
    case 'deldev': if (confirm('Remove this device?')) { i.devices.splice(+el.dataset.n, 1); saveInst(); rerender(); } return;
    case 'addtask': i.tasks = [...(i.tasks || []), { id: G.newId('t'), text: '' }]; return rerender();
    case 'deltask': i.tasks.splice(+el.dataset.n, 1); return rerender();
    case 'proposetask': { const txt = prompt('What change to the checklist do you propose?'); if (txt && txt.trim()) { write(setDoc(doc(collection(db, 'gateProposals')), { installationId: i.id, installationName: i.name, siteRef: i.siteRef, text: txt.trim(), by: meEmail(), status: 'Open', createdAt: serverTimestamp() }), 'Proposal'); banner('Sent to QS for approval.', 'ok'); } return; }
    case 'submitsetup': return submitSetup();
    // inspection
    case 'check': { const o = t.checks[el.dataset.pk] = t.checks[el.dataset.pk] || {}; o.st = el.dataset.val; saveTest(); return rerender(); }
    case 'device': { const o = t.devices[el.dataset.id] = t.devices[el.dataset.id] || {}; o.result = el.dataset.val; saveTest(); return rerender(); }
    case 'task': { const o = t.tasks[el.dataset.id] = t.tasks[el.dataset.id] || {}; o.outcome = el.dataset.val; saveTest(); return rerender(); }
    case 'notdone': { const note = prompt('Why? (a few words)') || ''; t.notDone[el.dataset.pk] = { st: el.dataset.val, note }; saveTest(); return rerender(); }
    case 'undonot': delete t.notDone[el.dataset.pk]; saveTest(); return rerender();
    case 'startretest': { const pk = el.dataset.pk, rds = t.readings[pk] || []; if (rds.length) (t.history[pk] = t.history[pk] || []).push({ at: new Date().toISOString(), reason: 'Settings changed', readings: rds }); t.readings[pk] = []; t.retestNeeded[pk] = false; saveTest(); return rerender(); }
    case 'battery': {
      const d = i.devices.find(x => x.id === el.dataset.id); if (!d || t.batteries.some(x => x.deviceId === d.id)) return;
      const on = G.todayISO(); t.batteries.push({ deviceId: d.id, deviceName: d.name, replacedOn: on });
      write(setDoc(doc(db, 'gateBatteryLog', `${t._id}_${d.id}`), { installationId: i.id, siteRef: i.siteRef, deviceId: d.id, deviceName: d.name, replacedOn: on, testId: t._id, by: meEmail(), testData: !!t.testData, createdAt: serverTimestamp() }), 'Battery record');
      if (!t.testData) { d.battery = { ...(d.battery || {}), lastReplaced: on }; write(setDoc(doc(db, 'gateInstallations', i.id), { devices: clean(i.devices) }, { merge: true }), 'Battery date'); }
      saveTest(); return rerender();
    }
    case 'addadj': {
      const cat = $('adjCat').value, leafId = $('adjLeaf').value, lf = leafList(i).find(l => l.id === leafId);
      const adj = { id: G.newId('a'), category: cat || null, leaf: leafId, leafLabel: lf ? lf.label : '', direction: $('adjDir').value, what: $('adjWhat').value.trim(), unsure: !cat, at: new Date().toISOString() };
      if (!adj.what) return alert('Say what you changed.');
      const r = G.suggestRetest(adj, S.plan, S.rules); adj.ids = r.ids.map(K); adj.why = r.why;
      adj.ids.forEach(pk => { if ((t.readings[pk] || []).length) t.retestNeeded[pk] = true; });
      t.adjustments.push(adj); S.open.add('adj'); S.open.add('force'); saveTest(); return rerender();
    }
    case 'adddef': t.defects.push({ id: G.newId('f'), severity: 'Advisory', where: '', text: '', rec: '' }); S.open.add('def'); saveTest(); return rerender();
    case 'deldef': if (confirm('Remove this defect?')) { t.defects.splice(+el.dataset.n, 1); saveTest(); rerender(); } return;
    case 'sendnotice': return sendNotice(el.dataset.id);
    case 'submitinsp': return submitInsp();
    case 'saveleave': saveTest(true); S.test = null; return openInst(i.id);
  }
});
window.addEventListener('beforeunload', e => { if (S.test && S.test._dirty) { saveTest(true); } });
