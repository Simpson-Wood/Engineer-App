<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AOV Testing — Simpson &amp; Wood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.49.0/dist/tabler-icons.min.css" />
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<link rel="stylesheet" href="sw-design.css">
<style>
  body{padding-bottom:40px;}
  .wrap{max-width:1320px; margin:0 auto; padding:0;}
  header .brand{flex:1 1 auto;} header .brand > div{min-width:0;}
  #signinScreen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;}
  #signinScreen img{height:44px; margin-bottom:28px;}
  #signinScreen h2{font-weight:700; text-transform:uppercase; font-size:20px; margin:0 0 8px;}
  #signinScreen p{color:var(--grey); font-size:14px; max-width:320px; margin:0 0 26px;}
  #signinScreen .err{color:var(--red); font-size:13px; margin-top:16px; max-width:320px;}
  .ms-btn{display:flex;}
  #appRoot{display:none;}
  main{padding:16px;}
  .card{min-width:0; padding:16px;}
  .section-label{font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.02em; font-size:20px; color:var(--ink); margin:0 0 12px;}
  .fld > label, .card label.l{display:block; font-family:'Barlow Condensed',sans-serif; font-size:14.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--grey); margin:0 0 6px;}
  label .req{color:var(--red);}
  label .hint{display:block; font-family:'Barlow',sans-serif; font-weight:400; text-transform:none; letter-spacing:0; color:var(--grey); font-size:12.5px; margin-top:2px;}
  input[type=text], input[type=date], input[type=time], select, textarea{
    width:100%; min-height:44px; padding:10px 12px; font-family:'Barlow',sans-serif; font-size:16px;
    border:1.5px solid var(--field); border-radius:8px; background:#fff; color:var(--ink); margin-bottom:14px;
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--red);}
  input:disabled, select:disabled, textarea:disabled{background:var(--soft); color:var(--grey);}
  textarea{resize:vertical; min-height:64px; line-height:1.4;}
  select{appearance:none; -webkit-appearance:none; padding-right:34px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%235c5c5c' d='M5 7l5 5 5-5z'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; background-size:18px;}
  .fgrid{display:grid; grid-template-columns:minmax(0,1fr); column-gap:16px;}
  .fgrid > .full{grid-column:1 / -1;}
  .fld{min-width:0;}
  @media (min-width:640px){ .fgrid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (min-width:1100px){ .fgrid.three{grid-template-columns:repeat(3,minmax(0,1fr));} }
  .tick{display:flex; gap:10px; align-items:flex-start; font-size:15px; font-weight:600; margin:0 0 12px; cursor:pointer;}
  .tick input{width:20px; height:20px; flex:0 0 auto; margin-top:1px;}
  .banner{display:none; font-weight:600;}
  .banner.ok{background:var(--green-bg); color:var(--green); border-color:var(--green-line);}
  .banner.wait{background:var(--amber-bg); color:#4d3300; border-color:var(--amber-line);}
  .tag{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:6px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; background:#eeece7; color:var(--grey);}
  .tag.ok{background:var(--green-bg); color:var(--green);} .tag.bad{background:var(--red-tint); color:var(--red-dark);}
  .tag.wait{background:var(--amber-bg); color:var(--amber);} .tag.info{background:var(--blue-bg); color:var(--blue);} .tag.dark{background:var(--ink); color:#fff;}
  .tag.over{background:var(--red); color:#fff;} .tag.test{background:var(--test-bg); color:var(--test-ink);}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:9px 16px; font-size:15px; font-weight:700; background:#fff; border:1.5px solid var(--field); border-radius:8px; cursor:pointer; color:var(--ink);}
  .btn.red{background:var(--red); border-color:var(--red); color:#fff;} .btn.dark{background:var(--ink); border-color:var(--ink); color:#fff;}
  .btn.sm{min-height:38px; padding:6px 12px; font-size:14px;}
  .btn.warn{border-color:var(--red); color:var(--red);} .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btns{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
  .crumb{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 12px; font-size:14px;}
  .crumb a{color:var(--grey); cursor:pointer; font-weight:600; text-decoration:underline;}
  .box{border:1px solid var(--line); border-radius:10px; padding:12px; margin:0 0 12px; background:#fff;}
  .box.warn{background:var(--amber-bg); border-color:var(--amber-line); color:#4d3300;}
  .box.bad{background:var(--red-tint); border-color:var(--bad-line); color:var(--bad-ink);}
  .box.good{background:var(--green-bg); border-color:var(--green-line); color:var(--green);}
  .box.info{background:var(--blue-bg); border-color:var(--blue-line); color:var(--blue);}
  .box h4{margin:0 0 6px; font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; font-size:17px;}
  .q{border-top:1px solid var(--line); padding:12px 0;} .q:first-child{border-top:none; padding-top:0;}
  .q .ql{font-weight:600; font-size:15.5px; margin:0 0 8px;} .q .qn{font-size:12.5px; color:var(--grey); margin:-4px 0 8px;}
  .opt-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
  .opt{min-height:44px; padding:8px 14px; border:1.5px solid var(--field); border-radius:8px; background:#fff; font-weight:700; font-size:15px; cursor:pointer; color:var(--grey);}
  .opt.on{background:var(--ink); border-color:var(--ink); color:#fff;} .opt.on.bad{background:var(--red); border-color:var(--red);} .opt.on.good{background:var(--green); border-color:var(--green);}
  .small{font-size:13px; color:var(--grey);}
  .gt-title{font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; font-size:22px; margin:0 0 4px;}
  .gt-sub{color:var(--grey); font-size:14px; margin:0 0 12px;}
  .list-line{display:flex; justify-content:space-between; gap:8px; align-items:center; padding:9px 0; border-top:1px solid var(--line); flex-wrap:wrap;}
  .list-line:first-child{border-top:none;}
  .empty-note, .loading-note{text-align:center; color:var(--grey); font-size:14.5px; padding:18px 0;}
  .grid{display:grid; grid-template-columns:minmax(0,1fr); gap:10px;}
  @media (min-width:760px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (min-width:1150px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr));} }
  .item{border:1px solid var(--line); border-radius:12px; padding:12px; background:#fff;}
  .item .nm{font-weight:700; font-size:16px;} .item .ty{font-size:12px; color:var(--grey); text-transform:uppercase; letter-spacing:.03em; font-weight:600;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .stabs{display:flex; gap:4px; flex-wrap:wrap; margin:0 0 12px;}
  .stabs .tab{font-size:15px; padding:8px 12px; border:1px solid var(--line);}
  .stepbar{position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 0 6px; margin:0 0 10px;}
  .stepinfo{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:15px; flex-wrap:wrap;}
  .prog{height:6px; background:var(--line); border-radius:4px; margin-top:6px; overflow:hidden;} .prog i{display:block; height:100%; background:var(--red);}
  .stepnav{display:flex; gap:8px; margin:12px 0 24px;} .stepnav .btn{flex:1; justify-content:center;}
  .out{border:1px solid var(--line); border-left:5px solid var(--field); border-radius:10px; padding:10px 12px; margin:0 0 10px;}
  .out.good{border-left-color:var(--green);} .out.bad{border-left-color:var(--red);}
  .out .on{font-weight:700;} .expect{font-size:13px; color:var(--grey); margin:2px 0 8px;}
  table.sch{width:100%; border-collapse:collapse; font-size:14px;} table.sch th, table.sch td{border-top:1px solid var(--line); padding:7px 6px; text-align:left; vertical-align:top;}
  table.sch th{font-size:12px; color:var(--grey); text-transform:uppercase; letter-spacing:.03em;}
  table.sch tr.grp td{background:var(--soft); font-weight:700;}
  .sch-wrap{overflow-x:auto;}
  .ph-grid{display:flex; flex-wrap:wrap; gap:10px;} .ph-grid figure{margin:0; width:150px;} .ph-grid img{width:150px; height:112px; object-fit:cover; border-radius:8px; border:1px solid var(--line);}
  .ph-grid figcaption{font-size:12px; color:var(--grey);}
  .hz{border:1px solid var(--line); border-radius:10px; padding:12px; margin:0 0 10px;}
  .calc{background:var(--soft); border-radius:10px; padding:12px; margin:0 0 12px;}
  .calc .big{font-family:'Barlow Condensed',sans-serif; font-size:30px; font-weight:700;}
  /* v1.1: equipment and scenarios as a list + one item */
  .ed{display:grid; grid-template-columns:minmax(0,1fr); gap:14px; align-items:start;}
  @media (min-width:1000px){ .ed{grid-template-columns:380px minmax(0,1fr);} .editem{position:sticky; top:10px;} .ednav .btn{display:none;} }
  @media (max-width:999px){ .ed.has-item .edlist{display:none;} .ed:not(.has-item) .editem{display:none;} }
  .edgrp{font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; color:var(--grey); font-size:14px; margin:12px 0 4px;}
  .edrow{display:flex; justify-content:space-between; gap:8px; align-items:center; padding:10px 10px; min-height:52px; border:1px solid var(--line); border-radius:8px; margin:0 0 6px; cursor:pointer; background:#fff;}
  .edrow:hover{border-color:var(--ink);} .edrow.on{background:var(--red-tint); border-color:var(--red);}
  .edmain{min-width:0;} .edtags{display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end;}
  .ednav{display:flex; justify-content:space-between; align-items:center; gap:8px; margin:0 0 10px;}
  .ibtn{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--grey); background:#fff; color:var(--grey); font:700 13px 'Barlow',sans-serif; cursor:pointer; vertical-align:middle; margin-left:4px; padding:0; text-transform:none;}
  .itext{display:block; font-family:'Barlow',sans-serif; text-transform:none; letter-spacing:0; font-weight:400; font-size:13px; color:var(--blue); background:var(--blue-bg); border:1px solid var(--blue-line); border-radius:8px; padding:8px 10px; margin:6px 0;}
  .sup{border:1px solid var(--line); border-radius:10px; margin:0 0 10px; background:#fff;} .sup > summary{list-style:none; cursor:pointer; padding:12px; display:flex; justify-content:space-between; gap:8px; align-items:center; font-weight:700;} .sup > summary::-webkit-details-marker{display:none;} .sup > .in{padding:0 12px 12px;}
  @media (max-width:640px){ main{padding:12px;} .card{padding:14px;} header h1{font-size:16px;} header .who .name{display:none;} }
  @media (max-width:700px){ table.sch .hide-s{display:none;} }
</style>
</head>
<body>

<div id="signinScreen">
  <img src="sw-logo.png" alt="Simpson & Wood">
  <h2>AOV Testing</h2>
  <p>Sign in with your Simpson &amp; Wood Microsoft account.</p>
  <button class="ms-btn" id="msSignInBtn"><i class="ti ti-brand-windows"></i> Sign in with Microsoft</button>
  <div class="err" id="signinErr"></div>
</div>

<div id="appRoot">
  <header>
    <a class="brand" href="index.html" title="Home">
      <img src="sw-logo-white.png" alt="Simpson & Wood">
      <div><h1>AOV Testing</h1><p id="versionLabel">v1.0</p></div>
    </a>
    <div class="right"><div class="who"><div class="name" id="whoName">—</div><button id="signOutBtn">Sign out</button></div></div>
  </header>
  <main><div class="wrap">
    <div id="banner" class="banner"></div>
    <div id="view"><div class="loading-note">Loading…</div></div>
  </div></main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, OAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection,
  getDocs, doc, getDoc, query, where, serverTimestamp, onSnapshot,
  setDoc as fsSetDoc
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import * as SWS from './sw-shared.js';
import * as A from './aov-shared.js';
const { esc } = A;

const VERSION = "v1.1";
document.getElementById('versionLabel').textContent = VERSION;
console.log('AOV testing', VERSION, 'shared', A.AOV_SHARED_VERSION);

const firebaseConfig = {
  apiKey: "AIzaSyB5foKhRfIMG91bD5QyT7hHd1XBbeQGucw",
  authDomain: "simpson-wood-engineer-app.firebaseapp.com",
  projectId: "simpson-wood-engineer-app",
  storageBucket: "simpson-wood-engineer-app.firebasestorage.app",
  messagingSenderId: "201961281346",
  appId: "1:201961281346:web:3c7386b73b41ce9df35adb"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
const msProvider = new OAuthProvider('microsoft.com');
msProvider.setCustomParameters({ tenant: 'abd23e0c-2d96-49ad-a280-99ff317f7d60' });

SWS.swSetup({ db, auth, page: 'aov-test', version: VERSION });
const viewingAs = () => SWS.swViewingAs();
const isVaError = e => e && String(e.message || '').includes(SWS.SW_VA_MSG);
const setDoc = SWS.swGuard(fsSetDoc);

// ── State ─────────────────────────────────────────────────────────────────
const S = {
  user: null, level: 'engineer', sites: [], site: null, visits: [], visit: null, results: {}, base: {}, dirty: {}, timers: {},
  rules: A.clone(A.DEFAULT_RULES), rulesApproved: false, rulesVersion: null, view: 'home', setupTab: 'systems', step: 0,
  photos: [], unsubR: null, unsubS: null, schedFilter: { block: '', system: '', outstanding: false }, back: null
};
const $ = id => document.getElementById(id);
const meEmail = () => { const va = viewingAs(); return va ? va.email : String((S.user && S.user.email) || '').toLowerCase(); };
const meRaw = () => (S.user && S.user.email) || '';     // exactly as Microsoft gives it (rules compare this way)
const meName = () => { const va = viewingAs(); return va ? va.name : ((S.user && (S.user.displayName || S.user.email)) || ''); };
const banner = (txt, cls = 'wait') => { const b = $('banner'); if (!txt) { b.style.display = 'none'; return; } b.className = 'banner ' + cls; b.textContent = txt; b.style.display = 'block'; };
const scrollTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });
const clean = o => JSON.parse(JSON.stringify(o, (k, v) => (k[0] === '_' ? undefined : (v === undefined ? null : v))));
const open = v => v && ['Draft', 'Returned'].includes(v.status);

// Every write goes through this: not awaited (works with no signal), failures reported.
function write(p, what) {
  Promise.resolve(p).catch(e => {
    if (isVaError(e)) { banner(SWS.SW_VA_MSG, 'wait'); return; }
    const code = (e && (e.code || e.message)) || 'unknown';
    console.error(what, e); SWS.swReport('save', what + ' didn\'t save: ' + code);
    banner(code === 'permission-denied' ? what + ' was not saved: someone else saved it first, or it has been sent to QS. Their version is shown.' : what + ' did not save (' + code + '). Tell Rob if it keeps happening.', 'wait');
  });
}
const audit = (action, extra = {}) => { if (viewingAs()) return; write(setDoc(doc(collection(db, 'aovAudit')), { at: serverTimestamp(), atISO: new Date().toISOString(), by: meEmail(), action, ...extra }), 'Audit record'); };

// ── Sign-in (standards §1.1) ───────────────────────────────────────────────
function describeAuthError(err) {
  if (err.code === 'auth/unauthorized-domain') return 'This site\'s domain isn\'t authorised in Firebase yet.';
  if (err.code === 'auth/operation-not-allowed') return 'Microsoft sign-in isn\'t enabled in Firebase yet.';
  if (['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(err.code)) return null;
  return 'Sign-in failed — ' + (err.code || err.message || 'unknown error') + '.';
}
$('msSignInBtn').addEventListener('click', () => {
  const errBox = $('signinErr'); errBox.textContent = '';
  signInWithPopup(auth, msProvider).catch(err => {
    if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
      signInWithRedirect(auth, msProvider).catch(err2 => { const m = describeAuthError(err2); if (m) errBox.textContent = m; });
      return;
    }
    const m = describeAuthError(err); if (m) errBox.textContent = m;
  });
});
$('signOutBtn').addEventListener('click', () => signOut(auth));
getRedirectResult(auth).catch(err => { $('signinErr').textContent = 'Sign-in failed — ' + (err.message || 'try again.'); });

let booted = false;
onAuthStateChanged(auth, async user => {
  S.user = user;
  if (!user) { $('signinScreen').style.display = 'flex'; $('appRoot').style.display = 'none'; return; }
  $('signinScreen').style.display = 'none'; $('appRoot').style.display = 'block';
  if (booted) return; booted = true;
  const va = await SWS.swViewAsInit(user);
  $('whoName').textContent = va ? va.name : (user.displayName || user.email);
  try { S.level = (await SWS.swAccess(va ? va.email : user.email)).level; } catch (e) {}
  SWS.swExtrasStart({ page: 'aov-test', version: VERSION, level: S.level, news: NEWS, help: HELP, tab: () => ({ home: 'Sites', site: 'Sites', setup: 'Equipment', visit: 'Visit', sched: 'Visit' }[S.view] || '') });
  SWS.swuStart();
  boot();
});
window.swUpdateBlocker = () => {
  if (Object.keys(S.timers).length) return 'Your last answer is still saving. Wait a moment, then tap Update.';
  if (S.view === 'visit') return 'Tap Save first, then tap Update. You come back to the same step.';
  if (SWS.swuMine().some(x => !x.failed)) return 'Wait until your work has sent (the yellow bar goes), then tap Update.';
  return '';
};

// ── Loading ───────────────────────────────────────────────────────────────
async function boot() {
  try {
    const [sitesS, rulesS] = await Promise.all([getDocs(collection(db, 'aovSites')), getDocs(collection(db, 'aovRules'))]);
    S.sites = sitesS.docs.map(d => ({ id: d.id, ...d.data() })).filter(s => !s.deletedFlag).sort((a, b) => String(a.siteName).localeCompare(String(b.siteName)));
    const ok = rulesS.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.status === 'Approved').sort((a, b) => (b.version || 0) - (a.version || 0));
    if (ok.length) { S.rules = { ...A.clone(A.DEFAULT_RULES), ...ok[0].rules }; S.rulesApproved = true; S.rulesVersion = ok[0].version; }
  } catch (e) {
    console.error(e); if (navigator.onLine) SWS.swReport('load', 'AOV lists didn\'t load: ' + (e.code || e.message));
    banner('The site list could not load (' + (e.code || e.message) + '). Anything already saved on this phone still shows.', 'wait');
  }
  const want = new URLSearchParams(location.search).get('site');
  if (want) { const s = S.sites.find(x => x.siteRef === want || x.id === want); if (s) return openSite(s.id); }
  go('home');
}
async function openSite(id) {
  const s = S.sites.find(x => x.id === id); if (!s) return go('home');
  S.site = s; S.visit = null; watchSite();
  await loadVisits(); go('site');
}
function watchSite() {
  if (S.unsubS) S.unsubS();
  const ref = S.site.id;
  S.unsubS = onSnapshot(doc(db, 'aovSites', ref), snap => {
    if (!snap.exists() || !S.site || S.site.id !== ref) return;
    if (S.siteTimer) return;             // our own edit is waiting to save
    const d = { id: snap.id, ...snap.data() };
    if ((d.rev || 0) >= (S.site.rev || 0)) { Object.assign(S.site, d); const i = S.sites.findIndex(x => x.id === ref); if (i >= 0) S.sites[i] = S.site; if (['site', 'setup'].includes(S.view)) rerender(); }
  }, () => {});
}
async function loadVisits() {
  try {
    const snap = await getDocs(query(collection(db, 'aovTests'), where('siteRef', '==', S.site.siteRef)));
    S.visits = snap.docs.map(d => ({ _id: d.id, ...d.data() })).filter(v => !v.deletedFlag).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  } catch (e) { S.visits = []; if (navigator.onLine) SWS.swReport('load', 'AOV visits didn\'t load: ' + (e.code || e.message)); }
}

// ── Navigation ────────────────────────────────────────────────────────────
const VIEWS = { home: homeHTML, site: siteHTML, setup: setupHTML, visit: visitHTML, sched: schedHTML };
function go(view) { S.view = view; banner(''); $('view').innerHTML = VIEWS[view](); scrollTop(); }
function rerender() { const y = window.scrollY; $('view').innerHTML = VIEWS[S.view](); window.scrollTo(0, y); }
const crumb = (...parts) => `<div class="crumb">${parts.join(' <span class="small">›</span> ')}</div>`;
const link = (act, txt) => `<a data-act="${act}">${txt}</a>`;
const setupTag = s => ({ Approved: '<span class="tag ok">Set-up approved</span>', 'Ready for QS': '<span class="tag wait">Set-up with QS</span>', Changed: '<span class="tag wait">Set-up changed: QS to approve</span>' }[s.setupStatus] || '<span class="tag wait">Set-up not approved</span>');

// Saved into the site record. Each save adds 1 to rev, and the rules refuse a

function saveSite_(why) {
  const s = S.site; if (!s) return;
  if (s.setupStatus === 'Approved') s.setupStatus = 'Changed';
  if (s.setupStatus === 'Ready for QS' && why !== 'submit') s.setupStatus = 'Draft';
  s.rev = (s.rev || 0) + 1;
  const rec = clean({ blocks: s.blocks, systems: s.systems, assets: s.assets, scenarios: s.scenarios, supplies: s.supplies, timings: s.timings, intervalMonths: s.intervalMonths, setupStatus: s.setupStatus, rev: s.rev, contact: s.contact || '', notes: s.notes || '' });
  rec.updatedAt = serverTimestamp(); rec.updatedBy = meEmail();
  write(setDoc(doc(db, 'aovSites', s.id), rec, { merge: true }), 'Equipment list');
  if (S.visits.some(open)) audit('setup-changed-during-visit', { siteRef: s.siteRef, what: why || '' });
}
function queueSiteSave(why) { clearTimeout(S.siteTimer); S.siteTimer = setTimeout(() => { S.siteTimer = null; saveSite_(why); }, 900); }

async function openVisit(id) {
  const v = S.visits.find(x => x._id === id); if (!v) return;
  S.visit = v; S.results = {}; S.base = {}; S.dirty = {}; S.step = null; S.photos = [];
  if (S.unsubR) S.unsubR();
  S.unsubR = onSnapshot(query(collection(db, 'aovResults'), where('visitId', '==', id)), snap => {
    let changedByOther = null;
    snap.docChanges().forEach(ch => {
      const d = ch.doc.data(), key = d.rtKey || d.key;
      if (ch.type === 'removed') { delete S.results[key]; return; }
      const mine = S.results[key];
      if (S.timers[key]) {              // we are editing it: only give way if someone else saved a newer one
        if ((d.rev || 0) > (S.base[key] || 0) && d.by !== meEmail()) { clearTimeout(S.timers[key]); delete S.timers[key]; changedByOther = d; }
        else return;
      }
      if (!mine || (d.rev || 0) >= (mine.rev || 0)) { S.results[key] = { ...d, _id: ch.doc.id }; S.base[key] = d.rev || 0; }
    });
    if (changedByOther) banner(`${changedByOther.byName || changedByOther.by} saved "${changedByOther.title || 'this check'}" at ${A.timeLabel(changedByOther.atISO)}. Their answers are shown. Add yours again if they differ.`, 'wait');
    if (S.view === 'visit' || S.view === 'sched') rerender();
  }, e => { if (navigator.onLine) SWS.swReport('load', 'AOV results didn\'t load: ' + (e.code || e.message)); });
  go('visit');
  try { const p = await getDocs(query(collection(db, 'aovPhotos'), where('visitId', '==', id))); S.photos = p.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.n - b.n); if (S.view === 'visit') rerender(); } catch (e) {}
}

function saveResult(key, check, immediate) {

    r.rev = rev; r.by = meEmail(); r.byName = meName(); r.atISO = new Date().toISOString(); if (check) r.kind = check.kind;

  p.filter(c => ['power', 'currents', 'calc', 'links'].includes(c.kind)).forEach(c => out.push({ key: c.key, title: c.title, check: c, html: () => checkHTML(c) }));

  const blocks = [...(s.blocks || []), { id: '__none', name: '' }];

    (s.systems || []).filter(x => b.id === '__none' ? !(s.blocks || []).some(bb => bb.id === x.blockId) : x.blockId === b.id).forEach(x => {

// ═══ Submit ═══
function submitVisit() {
  const v = S.visit, p = plan(), ctx = vctx(), all = A.evaluateAll(p, S.results, ctx);

  if (todo.length && !String((v.limited || {}).reason || '').trim()) return alert('Say why it is not finished, so QS can decide.');
  const unres = all.rows.filter(x => x.check.kind === 'restore' && x.latest && x.latest.restored === 'no' && !x.latest.rangOffice);
  if (unres.length) return alert('Something is not restored. Ring the office and record the time first.');
  const badDef = Object.values(S.results).find(r => r && r.kind === 'defect' && !r.removed && !String(r.text || '').trim()); if (badDef) return alert('A problem has no description (Problems found).');

  const fields = { status: 'Ready for QS', qsed: false, submittedAt: new Date().toISOString(), submittedBy: meEmail(), submittedByName: meName(), overall: all.overall.label, tally: all.tally,
    limited: todo.length ? { ...(v.limited || {}), items: todo.map(x => x.check.title + (x.check.sub ? ' (' + x.check.sub + ')' : '')).slice(0, 80) } : null,
    signOffs: [...(v.signOffs || []).filter(x => x.email !== meEmail()), { email: meEmail(), name: meName(), at: new Date().toISOString() }],
    setupApprovedAtTest: S.site.setupStatus === 'Approved', rulesVersion: S.rulesVersion, rulesApproved: S.rulesApproved, rulesSnapshot: S.rules,

  saveVisit(fields);
  if (S.site.setupStatus === 'Draft' || S.site.setupStatus === 'Changed') { if (!A.setupGaps(S.site).gaps.length) { S.site.setupStatus = 'Ready for QS'; saveSite_('submit'); } }
  SWS.swuAdd({ c: 'aovTests', id: v._id, label: S.site.siteName, app: 'AOV testing', site: S.site.siteName, noun: 'visit' });

// A failed answer is locked when you leave its screen, so it can't be turned into a pass later.
function lockFails(onlyKey) {
  const ctx = vctx();
  plan().forEach(c => {
    const g = A.resultsFor(c.key, S.results), r = g.latest; if (!r || r.locked) return;
    const k = g.retests.length ? `${c.key}__rt${r.n}` : c.key;
    if (onlyKey && !onlyKey.includes(c.key)) return;
    if (A.evaluate(c, r, ctx).state !== 'fail') return;
    r.locked = true; S.base[k] = S.base[k] || 0;
    clearTimeout(S.timers[k]); delete S.timers[k];
    // write directly: saveResult refuses locked results
    const rev = (S.base[k] || 0) + 1; r.rev = rev; S.base[k] = rev; r.by = meEmail(); r.byName = meName(); r.atISO = new Date().toISOString();
    write(setDoc(doc(db, 'aovResults', `${S.visit._id}__${k}`), clean({ ...r, visitId: S.visit._id, siteRef: S.visit.siteRef, key: c.key, rtKey: r.retestOf ? k : null, kind: c.kind, title: c.title, testData: !!S.visit.testData, at: serverTimestamp() })), 'Answer');
    addAutoDefect(c, k, A.evaluate(c, Object.assign({}, r, { locked: false }), ctx).why);
    markTested(c);
  });
}
// The battery calculation is worked out from the supply's figures; keep a copy on the visit.
function saveCalcs(only) {
  plan().filter(c => c.kind === 'calc' && (!only || only === c.key)).forEach(c => {
    const p = (S.site.supplies || []).find(x => x.id === c.supplyId); const cc = A.batteryCalc(p, S.rules), r = ensure(c.key);
    if (r.locked) return;
    const snap = { ...cc, supply: p ? clean(p) : null };
    if (JSON.stringify(r.calc || null) === JSON.stringify(snap)) return;
    r.calc = snap; saveResult(c.key, c, true);

}
function addAutoDefect(c, k, why) {
  const dk = 'def_' + k; if (S.results[dk]) return;
  S.results[dk] = { kind: 'defect', auto: true, forKey: c.key, severity: c.kind === 'restore' ? 'Urgent' : 'Needs fixing', where: [c.title, c.sub].filter(Boolean).join(' · '), text: why, rec: '' };

}
function markTested(c) {   // equipment that has a result can be retired, not deleted
  const ids = c.assetId ? [c.assetId] : c.scenarioId ? Object.keys(((S.site.scenarios || []).find(x => x.id === c.scenarioId) || {}).expected || {}) : [];
  let ch = false; ids.forEach(id => { const a = (S.site.assets || []).find(x => x.id === id); if (a && !a.everTested && !S.visit.testData) { a.everTested = true; ch = true; } });
  if (ch && S.site.setupStatus !== 'Approved' && S.site.setupStatus !== 'Ready for QS') queueSiteSave('tested');

// ═══ Photos ═══
function compressImage(file, maxSide = 1280, targetKB = 200) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const sc = Math.min(1, maxSide / Math.max(img.width, img.height)), w = Math.round(img.width * sc), h = Math.round(img.height * sc); const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); let q = 0.8, out = c.toDataURL('image/jpeg', q); while (out.length * 0.75 > targetKB * 1024 && q > 0.35) { q -= 0.1; out = c.toDataURL('image/jpeg', q); } URL.revokeObjectURL(url); resolve(out); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That photo could not be read.')); };
    img.src = url;
  });
}
async function addPhoto(file) {
  if (!file) return;
  try {
    const data = await compressImage(file); if (data.length * 0.75 > 600 * 1024) return alert('That photo is too big even after shrinking it. Try another.');
    const n = S.photos.reduce((m, p) => Math.max(m, p.n || 0), 0) + 1, id = `${S.visit._id}_${n}`, cap = ($('photoCap') || {}).value || '';
    const rec = { visitId: S.visit._id, siteRef: S.visit.siteRef, n, caption: cap, photoBase64: data, engineerEmail: meRaw(), testData: !!S.visit.testData, createdAt: serverTimestamp() };
    write(setDoc(doc(db, 'aovPhotos', id), rec), 'Photo'); SWS.swuAdd({ c: 'aovPhotos', id, label: 'Photo', app: 'AOV testing', site: S.visit.siteName, noun: 'photo' });
    S.photos.push({ id, ...rec, createdAt: null }); rerender();
  } catch (e) { alert(e.message || 'Photo failed.'); }
}

}

});

    case 'delasset': { const x = s.assets[+d.n]; if (!confirm('Delete ' + A.assetName(x) + '? Only do this if it was added by mistake. If it has gone, use "It has gone (retire)".')) return; s.assets.splice(+d.n, 1); (s.scenarios || []).forEach(c => { if (c.expected) delete c.expected[x.id]; if (c.inputAssetId === x.id) c.inputAssetId = ''; }); S.edSel = null; queueSiteSave('asset deleted'); return rerender(); }
    case 'retireasset': { const x = s.assets[+d.n]; const why = prompt('Why has it gone? (a few words)'); if (why == null) return; Object.assign(x, { status: 'retired', retiredOn: A.todayISO(), retiredWhy: why, retiredBy: meEmail() }); (s.scenarios || []).forEach(c => { if (c.expected) delete c.expected[x.id]; }); queueSiteSave('asset retired'); return rerender(); }
    case 'replaceasset': { const x = s.assets[+d.n]; const why = prompt('What replaced it? (make / model)'); if (why == null) return; const nu = { ...A.clone(x), id: A.newId('a'), status: 'active', firstSeen: A.todayISO(), firstSeenVisit: S.visit ? S.visit._id : null, replaces: x.id, model: why, everTested: false, confirmed: false }; Object.assign(x, { status: 'retired', retiredOn: A.todayISO(), retiredWhy: 'Replaced: ' + why, replacedBy: nu.id }); s.assets.push(nu); S.edSel = s.assets.length - 1; (s.scenarios || []).forEach(c => { if (c.expected && c.expected[x.id]) { c.expected[nu.id] = c.expected[x.id]; delete c.expected[x.id]; } if (c.inputAssetId === x.id) c.inputAssetId = nu.id; }); queueSiteSave('asset replaced'); return rerender(); }
    case 'addscen': s.scenarios = [...(s.scenarios || []), { id: A.newId('c'), systemId: d.sys, name: '', inputType: A.INPUT_TYPES[0], inputRef: '', inputLocation: '', method: 'endToEnd', expected: {}, indications: '', reset: '' }]; S.edSel = s.scenarios.length - 1; queueSiteSave('scenario'); return rerender();
    case 'autoscen': {   // one scenario per detector that hasn't got one yet (this system, or every system)
      const sysIds = S.edFilter ? [S.edFilter] : (s.systems || []).map(x => x.id); let n = 0;
      sysIds.forEach(sid => {
        const dets = A.activeAssets(s).filter(x => x.systemId === sid && x.type === 'detector' && !(s.scenarios || []).some(c => !c.retired && c.inputAssetId === x.id));
        const outs = A.activeAssets(s).filter(x => x.systemId === sid && (A.ASSET_TYPES[x.type] || {}).moves);
        dets.forEach(det => { const exp = {}; outs.forEach(o => { exp[o.id] = (o.type === 'roofVent' || o.type === 'velux' || o.type === 'stairVent' || (o.floor && o.floor === det.floor)) ? 'open' : 'closed'; }); s.scenarios = [...(s.scenarios || []), { id: A.newId('c'), systemId: sid, name: (det.location || det.ref || 'Detector') + ' detector', inputType: A.INPUT_TYPES[0], inputAssetId: det.id, inputRef: det.ref || '', inputLocation: det.location || '', method: 'endToEnd', expected: exp, indications: '', reset: '' }]; n++; });
      });
      if (!n) return alert('No detectors without a scenario. Add the detectors under Equipment first.');
      queueSiteSave('scenarios'); banner(`${n} scenario(s) added. Check what opens for each: it was guessed from the floor numbers.`, 'wait'); return rerender();
    }
    case 'copyscen': { const c = A.clone(s.scenarios[+d.n]); c.id = A.newId('c'); c.name = (c.name || '') + ' (copy)'; s.scenarios.splice(+d.n + 1, 0, c); S.edSel = +d.n + 1; queueSiteSave('scenario'); return rerender(); }
    case 'delscen': { const c = s.scenarios[+d.n]; if (!confirm('Remove this scenario?')) return; if (c.everTested) c.retired = true; else s.scenarios.splice(+d.n, 1); S.edSel = null; queueSiteSave('scenario removed'); return rerender(); }
    case 'expect': { const c = s.scenarios[+d.n]; c.expected = c.expected || {}; if (d.v) c.expected[d.a] = d.v; else delete c.expected[d.a]; queueSiteSave('scenario'); return rerender(); }
    case 'addsupply': s.supplies = [...(s.supplies || []), { id: A.newId('p'), name: '', systems: S.edFilter ? [S.edFilter] : (s.systems || []).map(x => x.id), items: [], ownMains: true, batteries: { count: 2, arrangement: 'series' } }]; S.edSel = s.supplies.length - 1; queueSiteSave('supply'); return rerender();
    case 'delsupply': if (!confirm('Remove this power supply?')) return; s.supplies[+d.n].retired = true; S.edSel = null; queueSiteSave('supply'); return rerender();
    case 'supsys': { const p = s.supplies[+d.n]; p.systems = (p.systems || []).includes(d.s) ? p.systems.filter(x => x !== d.s) : [...(p.systems || []), d.s]; queueSiteSave('supply'); return rerender(); }
    case 'sendsetup': { flushSite(); const { gaps } = A.setupGaps(s); if (gaps.length) return; s.setupStatus = 'Ready for QS'; s.setupReturnNote = null; saveSite_('submit'); audit('setup-submitted', { siteRef: s.siteRef }); banner('Sent to QS.', 'ok'); return rerender(); }
    // visit
    case 'scope': { const v = S.visit; const all = (s.systems || []).map(x => x.id); let cur = (v.scope && v.scope.systems && v.scope.systems.length) ? [...v.scope.systems] : [...all]; cur = cur.includes(d.s) ? cur.filter(x => x !== d.s) : [...cur, d.s]; if (!cur.length) return alert('At least one system.'); saveVisit({ scope: { systems: cur.length === all.length ? [] : cur } }); return rerender(); }
    case 'chgpick': { const ch = S.visit.change = S.visit.change || {}; const arr = ch[d.arr] = ch[d.arr] || []; ch[d.arr] = arr.includes(d.id) ? arr.filter(x => x !== d.id) : [...arr, d.id]; saveVisit({ change: ch }); return rerender(); }
    case 'chglogic': { const ch = S.visit.change = S.visit.change || {}; ch.logic = !ch.logic; saveVisit({ change: ch }); return rerender(); }
    case 'ans': { setRes(d.k, d.f, d.v === '' ? null : (d.f === 'cant' || d.f === 'agreed' ? !!d.v : d.v)); saveResult(d.k, checkFor(d.k)); return rerender(); }
    case 'item': { const r = ensure(d.k); r.items = { ...(r.items || {}), [d.i]: d.v }; saveResult(d.k, checkFor(d.k)); return rerender(); }
    case 'outstate': { const r = ensure(d.k); r.outputs = r.outputs || {}; r.outputs[d.a] = { ...(r.outputs[d.a] || {}), state: d.v }; saveResult(d.k, checkFor(d.k)); return rerender(); }
    case 'moving': { const r = ensure(d.k); r.outputs = r.outputs || {}; const o = r.outputs[d.a] = r.outputs[d.a] || {}; o.moving = { ...(o.moving || {}), [d.i]: d.v }; saveResult(d.k, checkFor(d.k)); return rerender(); }
    case 'retest': { const g = A.resultsFor(d.k, S.results); const n = g.retests.length + 2, k = `${d.k}__rt${n}`; S.results[k] = { retestOf: d.k, n, _k: k }; S.base[k] = 0; saveResult(k, checkFor(d.k), true); return rerender(); }
    case 'adddef': case 'quickdef': { const k = 'def_' + A.newId('m'); S.results[k] = { kind: 'defect', severity: 'Needs fixing', where: a === 'quickdef' && S.screens ? S.screens[S.step].title : '', text: '', rec: '' }; saveResult(k, null, true); if (a === 'quickdef') { S.retStep = S.step; S.step = S.screens.findIndex(x => x.key === 'defects'); } return rerender(); }
    case 'deldef': { if (!confirm('Remove this problem?')) return; const r = S.results[d.k]; r.removed = true; saveResult(d.k, null, true); return rerender(); }
    case 'cantrestore': { const p = plan().filter(c => c.kind === 'restore'); let c = p[0]; if (p.length > 1) { const names = p.map((x, i) => `${i + 1}. ${x.sub}`).join('\n'); const pick = prompt('Which system?\n' + names, '1'); if (!pick) return; c = p[(+pick || 1) - 1] || p[0]; } const k = liveKey(c); setRes(k, 'restored', 'no'); saveResult(k, c, true); S.step = S.screens.findIndex(x => x.key === c.key); return rerender(); }
    case 'addnote': { const t = ($('extraNote').value || '').trim(); if (!t) return; saveVisit({ extraNotes: [...(S.visit.extraNotes || []), t] }); return rerender(); }
    case 'submit': return submitVisit();
    case 'sched': S.schedBack = S.step; return go('sched');
    case 'backvisit': if (S.schedBack != null) S.step = S.schedBack; return go('visit');
    case 'gonext': { const sc = S.screens || screens(); const i = sc.findIndex(x => x.check && ((x.check.assetId === d.a) || (x.check.kind === 'scenario' && ((s.scenarios || []).find(q => q.id === x.check.scenarioId) || { expected: {} }).expected[d.a])) && ['pending', 'incomplete'].includes(A.evaluate(x.check, A.resultsFor(x.check.key, S.results).latest, vctx()).state)); if (i >= 0) S.step = i; return go('visit'); }
    case 'nextstep': case 'prevstep': case 'gostep': case 'savestep': {
      const cur = S.screens[S.step]; if (cur && cur.check && cur.check.kind === 'calc') saveCalcs(cur.check.key); flushAll(); if (cur && (cur.check || cur.checks)) lockFails(cur.checks ? cur.checks.map(c => c.key) : [cur.check.key].filter(k => !cur.key.includes('#') || cur.key.endsWith('#r')));
      if (a === 'savestep') { banner(navigator.onLine ? 'Saved.' : 'Saved on this phone. It sends when there is signal.', 'ok'); saveStep(cur.key); return; }
      const max = S.screens.length - 1;
      S.step = a === 'nextstep' ? Math.min(max, S.step + 1) : a === 'prevstep' ? Math.max(0, S.step - 1) : +d.n;
      if (open(S.visit)) saveStep(S.screens[S.step].key);
      rerender(); return scrollTop();
    }
  }
});
window.addEventListener('beforeunload', () => { flushAll(); flushSite(); });
