<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simpson &amp; Wood — Engineer Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<style>
  :root{
    --red:#D0222A; --red-dark:#a51b22; --ink:#1a1a1a;
    --bg:#f4f3f0; --card:#ffffff; --line:#e2e0da;
    --grey:#6b6b68; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Barlow',sans-serif; background:var(--bg); color:var(--ink);}
  h1,h2,h3,.label{font-family:'Barlow Condensed',sans-serif;}
  .screen{min-height:100vh;}
  [hidden]{display:none !important;}

  /* ---- sign-in ---- */
  #signin-screen{display:flex; align-items:center; justify-content:center; padding:24px; background:var(--ink);}
  .signin-card{background:var(--card); border-radius:16px; padding:40px 32px; max-width:380px; width:100%; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,0.35);}
  .signin-logo{width:100%; max-width:260px; margin:0 auto 20px;}
  .signin-tagline{color:var(--grey); font-size:15px; margin:0 0 28px;}
  .btn-primary{width:100%; background:var(--red); color:#fff; border:none; border-radius:8px; padding:13px 16px; font-size:15px; font-family:'Barlow',sans-serif; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn-primary:hover{background:var(--red-dark);}
  .error-text{color:var(--red); font-size:13px; margin-top:14px;}

  /* ---- topbar ---- */
  .topbar{display:flex; align-items:center; justify-content:space-between; background:var(--ink); padding:10px 20px; height:56px;}
  .topbar-brand{display:flex; align-items:center; gap:10px;}
  .topbar-logo{height:28px;}
  #versionLabel{color:#8a8a86; font-size:11px; margin:0;}
  .topbar-right{display:flex; align-items:center; gap:6px;}
  .user-name{color:#cfcfcf; font-size:13px; margin-right:8px;}
  .icon-btn{background:none; border:none; color:#cfcfcf; width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px;}
  .icon-btn:hover{background:rgba(255,255,255,0.1); color:#fff;}

  /* ---- layout / tiles (mobile-first grid) ---- */
  .layout{display:block;}
  .tool-nav{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:12px; padding:20px;}
  .tool-section-label{font-size:13px; color:var(--grey); text-transform:uppercase; letter-spacing:0.04em; grid-column:1/-1; margin:8px 0 -4px;}
  .tool-section-label:first-child{margin-top:0;}
  .tile{background:var(--card); border:0.5px solid var(--line); border-radius:12px; padding:16px 8px; text-align:center; text-decoration:none; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;}
  .tile i{font-size:24px; color:var(--red);}
  .tile span{font-size:12.5px; line-height:1.25;}
  .tile.disabled{opacity:0.45; cursor:default;}
  .tile.disabled i{color:var(--grey);}
  .tile.disabled .soon{display:block; font-size:10.5px; color:var(--grey); margin-top:-4px;}
  .soon-wrap{grid-column:1/-1; margin-top:6px;}
  .soon-btn{background:none; border:none; padding:6px 0; font-family:'Barlow',sans-serif; font-size:13px; color:var(--grey); cursor:pointer; display:flex; align-items:center; gap:6px;}
  .soon-btn i{font-size:15px;}
  .soon-btn .chev{transition:transform .15s;}
  .soon-btn[aria-expanded="true"] .chev{transform:rotate(180deg);}
  .soon-list{font-size:12.5px; color:var(--grey); line-height:1.6; padding:2px 0 4px 21px;}
  .content-pane{display:none;}
  .icon-wrap{position:relative; display:inline-flex; align-items:center; justify-content:center;}
  .tile .icon-wrap .badge-check{position:absolute; bottom:-3px; right:-4px; font-size:10px !important; background:var(--card); border-radius:50%; color:#2e8b57 !important;}
  .tile .icon-wrap .badge-count{position:absolute; top:-6px; right:-8px; background:var(--red); color:#fff !important; font-size:9.5px !important; font-weight:600; min-width:15px; height:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; font-family:'Barlow',sans-serif; line-height:1;}
  .activity-list{width:100%; max-width:640px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; max-height:calc(100vh - 130px); padding:4px 2px;}
  .activity-item{display:flex; align-items:center; gap:12px; background:var(--card); border:0.5px solid var(--line); border-radius:10px; padding:12px 14px; text-decoration:none; color:var(--ink);}
  .activity-item:hover{border-color:var(--red);}
  .activity-item.pending{border-left:3px solid var(--red);}
  .activity-item i{font-size:18px; color:var(--red); flex-shrink:0;}
  .activity-item .main{flex:1; min-width:0;}
  .activity-item .title{font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .activity-item .meta{font-size:11.5px; color:var(--grey); margin-top:1px;}
  .activity-pill{font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:20px; white-space:nowrap;}
  .activity-pill.pending{background:#fbe9e9; color:#a32d2d;}
  .activity-pill.done{background:#eaf3de; color:#3b6d11;}
  .activity-heading{font-size:13px; color:var(--grey); text-transform:uppercase; letter-spacing:0.04em; margin:14px 0 2px; width:100%; max-width:640px;}
  .activity-heading:first-child{margin-top:0;}
  .content-pane-inner{width:100%; max-width:640px; display:flex; flex-direction:column; align-items:flex-start;}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity 0.2s;}
  .toast.show{opacity:1;}

  @media (min-width:900px){
    .layout{display:flex; min-height:calc(100vh - 56px);}
    .tool-nav{display:flex; flex-direction:column; width:230px; background:var(--ink); padding:20px 14px; gap:2px; flex-shrink:0; grid-template-columns:none;}
    .tool-section-label{color:#8a8a86; margin:14px 0 2px; padding:0 10px;}
    .tool-section-label:first-child{margin-top:0;}
    .tile{flex-direction:row; justify-content:flex-start; text-align:left; background:none; border:none; border-radius:8px; padding:9px 10px; gap:10px;}
    .tile:hover{background:rgba(255,255,255,0.06);}
    .tile i{font-size:17px; width:20px;}
    .tile span{font-size:13.5px; color:#e4e4e2;}
    .tile.disabled .soon{display:inline; margin:0 0 0 6px; font-size:10.5px;}
    .tile.disabled span{display:flex; align-items:center;}
    .soon-wrap{margin-top:14px; padding:0 10px;}
    .soon-btn{color:#8a8a86; font-size:12.5px;}
    .soon-btn:hover{color:#cfcfcf;}
    .soon-list{color:#8a8a86; padding-left:21px;}
    .content-pane{display:flex; flex:1; align-items:flex-start; justify-content:center; color:var(--grey); font-size:15px; padding:32px 40px; overflow-y:auto;}
  }

  /* ---- home boxes (v2.8) ---- */
  .home-boxes{width:100%; display:flex; flex-direction:column; gap:12px;}
  .home-boxes:empty{display:none;}
  .feed{width:100%; margin-top:22px;}
  .feed:empty{display:none;}
  .feed .activity-list{max-height:none; overflow:visible; max-width:none;}
  .hb-date{font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:600; color:var(--ink); line-height:1.1;}
  .hb-notice{display:flex; gap:9px; align-items:flex-start; background:#eef3fb; border:1px solid #c9d8ef; color:#1f4f8a; border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.4;}
  .hb-notice i{font-size:18px; flex-shrink:0;}
  .hb-notice.bad{background:#fbe9e9; border-color:#efc4c4; color:#a32d2d;}
  .hb-card{background:var(--card); border:0.5px solid var(--line); border-radius:12px; padding:14px 16px; color:var(--ink); font-size:14.5px; line-height:1.4;}
  .hb-card h3{margin:0 0 8px; font-size:18px; font-weight:600; display:flex; align-items:center; gap:8px;}
  .hb-card h3 i{color:var(--red); font-size:20px;}
  .hb-alert{border-left:4px solid var(--red);}
  .hb-row{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:7px 0; border-top:1px solid #efede8; color:var(--ink); text-decoration:none;}
  .hb-card h3 + .hb-row{border-top:none;}
  .hb-row .w{color:var(--grey);}
  .hb-row .w b{color:var(--ink); margin-right:4px;}
  .hb-row .n{font-weight:600; text-align:right; white-space:nowrap;}
  .hb-row.now{background:#fbf1f1; margin:0 -8px; padding:7px 8px; border-radius:8px; border-top-color:transparent;}
  .hb-row.mine .n{color:var(--red);}
  .hb-row i{color:var(--red); margin-right:4px;}
  a.hb-row:hover{color:var(--red);}
  .hb-red{color:#a32d2d; font-weight:600;}
  .hb-big{font-size:17px; font-weight:600;}
  .hb-sub{color:var(--grey); font-size:13.5px; margin-top:2px;}
  .hb-sub b{color:var(--ink);}
  .hb-empty{color:var(--grey);}
  .hb-link{display:inline-flex; align-items:center; gap:3px; margin-top:8px; color:var(--red); font-weight:600; text-decoration:none; font-size:14px;}
  .hb-acts{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .hb-btn{display:inline-flex; align-items:center; gap:6px; background:var(--red); color:#fff; border:1px solid var(--red); border-radius:8px; padding:8px 14px; font-size:14px; font-weight:600; text-decoration:none;}
  .hb-btn:hover{background:var(--red-dark);}
  .hb-btn.ghost{background:#fff; color:var(--ink); border-color:var(--line);}
  .hb-btn.ghost:hover{border-color:var(--red);}
  .hb-swap{padding:8px 0; border-top:1px solid #efede8;}
  .hb-card h3 + .hb-swap{border-top:none; padding-top:0;}
  .hb-pill{font-size:12px; font-weight:600; padding:2px 9px; border-radius:20px; background:#f1efe9; color:var(--ink); white-space:nowrap;}
  .hb-pill.red{background:#fbe9e9; color:#a32d2d;}
  .hb-pill.amber{background:#fdf1d8; color:#8a5a00;}
  .hb-pill.green{background:#eaf3de; color:#3b6d11;}
  @media (max-width:899px){
    .layout{display:flex; flex-direction:column;}
    .content-pane{display:block; order:-1; padding:16px 16px 0;}
    .content-pane-inner{max-width:none;}
    .feed{display:none;}
    .tool-nav{grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; padding:16px;}
    .tile{padding:10px 6px; gap:6px; border-radius:10px;}
    .tile i{font-size:20px;}
    .tile span{font-size:12px;}
  }
  /* The small tick on the report tiles: keep it a circle (the sidebar's 20px icon width was stretching it into a pill) */
  .tile .icon-wrap .badge-check{width:auto; height:auto; line-height:1;}

  /* ---- SHARED (keep in step across pages): View as · What's New · Help ---- */
  .sw-hbox{display:flex; gap:6px; margin-left:auto;}
  .sw-hbtn{display:inline-flex; align-items:center; gap:5px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); color:#fff; border-radius:8px; padding:6px 10px; font-family:'Barlow',sans-serif; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .sw-hbtn i{font-size:17px;}
  .sw-hbtn:hover{background:rgba(255,255,255,.2);}
  .topbar-right .sw-hbtn{margin-right:6px;}
  @media (max-width:640px){ .sw-hbtn span{display:none;} .sw-hbtn{padding:6px 8px;} }
  .sw-vabar{position:sticky; top:0; z-index:400; display:flex; flex-wrap:wrap; align-items:center; gap:8px; background:#e8a317; color:#1a1a1a; padding:8px 16px; font-family:'Barlow',sans-serif; font-size:14px;}
  .sw-vabar i{font-size:18px;}
  .sw-vabar span{flex:1; min-width:180px;}
  .sw-vabar button{background:#fff; border:1px solid #1a1a1a; border-radius:7px; padding:4px 10px; font-weight:700; font-size:13px; cursor:pointer;}
  .sw-modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:500; display:flex; align-items:center; justify-content:center; padding:16px; font-family:'Barlow',sans-serif;}
  .sw-modal{background:#fff; color:#1a1a1a; border-radius:14px; width:100%; max-width:520px; max-height:88vh; overflow:auto; padding:20px;}
  .sw-modal h3{font-family:'Barlow Condensed',sans-serif; font-size:22px; margin:0 0 12px;}
  .sw-modal h3 small{font-size:14px; color:#5c5c5c; font-weight:600;}
  .sw-news{margin:0; padding-left:20px; font-size:15.5px; line-height:1.5;}
  .sw-news li{margin-bottom:8px;}
  .sw-mbtns{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .sw-btn{background:#fff; border:1.5px solid #cfcfcf; border-radius:9px; padding:9px 16px; font-weight:700; font-size:15px; cursor:pointer; font-family:'Barlow',sans-serif;}
  .sw-btn-red{background:#D0222A; border-color:#D0222A; color:#fff;}
  .sw-inp{width:100%; padding:10px 12px; border:1.5px solid #cfcfcf; border-radius:8px; font-size:16px; font-family:'Barlow',sans-serif; margin-bottom:10px;}
  .sw-people{display:grid; gap:6px;}
  .sw-people button{display:flex; justify-content:space-between; gap:10px; text-align:left; background:#fff; border:1px solid #e2e2e2; border-radius:9px; padding:10px 12px; cursor:pointer; font-size:15px; font-family:'Barlow',sans-serif;}
  .sw-people button:hover{background:#fbe9ea;}
  .sw-people small{color:#5c5c5c;}
  .sw-help-bg{justify-content:flex-end; align-items:stretch; padding:0;}
  .sw-help{background:#fff; color:#1a1a1a; width:100%; max-width:440px; height:100%; overflow:auto; padding:18px 20px 30px; box-shadow:-6px 0 24px rgba(0,0,0,.18);}
  .sw-help-h{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .sw-help-h h3{font-family:'Barlow Condensed',sans-serif; font-size:24px; margin:0; display:flex; align-items:center; gap:6px;}
  .sw-x{background:none; border:none; font-size:28px; cursor:pointer; line-height:1; color:#5c5c5c;}
  .sw-help-t{font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700; text-transform:uppercase; color:#5c5c5c; margin:16px 0 6px;}
  .sw-help details{border:1px solid #e2e2e2; border-radius:10px; margin-bottom:8px; background:#fff;}
  .sw-help summary{cursor:pointer; padding:11px 12px; font-weight:700; font-size:15.5px; list-style:none;}
  .sw-help summary::-webkit-details-marker{display:none;}
  .sw-help summary::before{content:'+'; display:inline-block; width:18px; color:#D0222A; font-weight:700;}
  .sw-help details[open] summary::before{content:'–';}
  .sw-help details > div{padding:0 14px 12px 30px; font-size:15px; line-height:1.5;}
  .sw-help details > div p{margin:0 0 8px;}
  .sw-help-f{margin-top:20px; border-top:1px solid #e2e2e2; padding-top:14px; font-size:14px; color:#5c5c5c;}
  @media (max-width:640px){ .sw-help{max-width:none;} }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
</head>
<body>

<div id="signinScreen" class="screen">
  <div class="signin-card">
    <img src="sw-logo.png" alt="Simpson &amp; Wood" class="signin-logo">
    <p class="signin-tagline">Sign in with your Simpson &amp; Wood Microsoft account to get to your tools.</p>
    <button id="msSignInBtn" class="btn-primary"><i class="ti ti-brand-windows" aria-hidden="true"></i>Sign in with Microsoft</button>
    <p id="signinErr" class="error-text"></p>
  </div>
</div>

<div id="appRoot" class="screen" hidden>
  <header class="topbar">
    <div class="topbar-brand">
      <img src="sw-logo-white.png" alt="Simpson &amp; Wood" class="topbar-logo">
      <p id="versionLabel">v1.0</p>
    </div>
    <div class="topbar-right">
      <span id="whoName" class="user-name"></span>
      <button id="mgmtBtn" class="icon-btn" hidden title="Management"><i class="ti ti-settings" aria-hidden="true"></i></button>
      <button id="signOutBtn" class="icon-btn" title="Sign out"><i class="ti ti-logout" aria-hidden="true"></i></button>
    </div>
  </header>
  <div class="layout">
    <nav class="tool-nav" id="tool-nav"></nav>
    <div class="content-pane" id="content-pane"><div class="content-pane-inner" id="content-pane-inner"><div class="home-boxes" id="homeBoxes"></div><div class="feed" id="feed"></div></div></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, OAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, doc, getDoc, collection, getDocs, query, where, orderBy, limit, setDoc
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const VERSION = "v2.8";
document.getElementById('versionLabel').textContent = VERSION;

const firebaseConfig = {
  apiKey: "AIzaSyB5foKhRfIMG91bD5QyT7hHd1XBbeQGucw",
  authDomain: "simpson-wood-engineer-app.firebaseapp.com",
  projectId: "simpson-wood-engineer-app",
  storageBucket: "simpson-wood-engineer-app.firebasestorage.app",
  messagingSenderId: "201961281346",
  appId: "1:201961281346:web:3c7386b73b41ce9df35adb"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache() });
// Raw Firestore functions for the shared block below (this page saves
// nothing else, so there's nothing for "View as" to guard).
const swDoc = doc, swGetDoc = getDoc, swGetDocs = getDocs, swCollection = collection, swSetDoc = setDoc;

// ═══════════════════════════════════════════════════════════════════════════
//  SHARED (copied into index, timesheet, leave, timesheet-report and
//  management — keep in step): access level · View as (Rob only) ·
//  What's New · Help.   Standards §15: any page changed from now on gets
//  this block too.
// ═══════════════════════════════════════════════════════════════════════════
const SW_OWNER = 'rob.rose@simpsonandwood.co.uk';
const SW_MGMT_POSITIONS = ['Manager', 'QS', 'Director'];   // must match isManager() in the rules
let VIEW_AS = null;      // { email, name, position } while Rob is viewing the app as someone else
let SW = { page: '', version: '', level: 'engineer', news: {}, help: [], tab: () => '' };
const SW_VA_MSG = 'You\'re viewing as someone else, so nothing is saved or sent.';
const swEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function swBlocked() { return Promise.reject(new Error(SW_VA_MSG)); }
// Wrap anything that saves, so "View as" can never change real data.
function swGuard(fn) { return (...a) => VIEW_AS ? swBlocked() : fn(...a); }
function swGuardBatch(fn) { return (...a) => { const b = fn(...a); const c = b.commit.bind(b); b.commit = () => VIEW_AS ? swBlocked() : c(); return b; }; }
(() => {   // and nothing goes to Microsoft (email, calendars) while viewing as someone
  const f = window.fetch.bind(window);
  window.fetch = (u, o) => (VIEW_AS && String(u).includes('graph.microsoft.com')) ? swBlocked() : f(u, o);
})();
// Who someone is: 'management' (Manager / QS / Director, or the console-only
// managers list), 'office' or 'engineer'.
async function swAccess(email) {
  let managers = false, position = '', staff = null;
  try { managers = (await swGetDoc(swDoc(db, 'managers', email))).exists(); } catch (e) {}
  try { const s = await swGetDoc(swDoc(db, 'staff', String(email).toLowerCase())); if (s.exists()) { staff = s.data(); position = staff.position || ''; } } catch (e) {}
  const level = (managers || SW_MGMT_POSITIONS.includes(position)) ? 'management' : position === 'Office' ? 'office' : 'engineer';
  return { level, position, staff, isManager: level === 'management', isOffice: level === 'office' };
}
function swHeaderButton(id, icon, label, onClick) {
  if (document.getElementById(id)) return;
  const b = document.createElement('button');
  b.type = 'button'; b.id = id; b.className = 'sw-hbtn'; b.title = label; b.setAttribute('aria-label', label);
  b.innerHTML = `<i class="ti ${icon}" aria-hidden="true"></i><span>${swEsc(label)}</span>`;
  b.addEventListener('click', onClick);
  const right = document.querySelector('.topbar-right');
  if (right) right.prepend(b);
  else { const who = document.querySelector('header .who'); let box = document.getElementById('swHbox'); if (!box) { box = document.createElement('div'); box.id = 'swHbox'; box.className = 'sw-hbox'; who.parentNode.insertBefore(box, who); } box.appendChild(b); }
}
function swModal(html, cls) {
  const bg = document.createElement('div');
  bg.className = 'sw-modal-bg ' + (cls || '');
  bg.innerHTML = html;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-swclose]')) bg.remove(); });
  document.body.appendChild(bg);
  return bg;
}

// ---- View as (Rob only) ----------------------------------------------------
// Rob picks a person and every page shows what they'd see, read-only. The
// choice lasts for this browser tab (all pages) until he presses Stop. Data is
// still read with Rob's own access, so it shows screens, not the database rules.
async function swViewAsInit(user) {
  const real = String(user.email || '').toLowerCase();
  if (real !== SW_OWNER) return null;

  let v = null;

  try { const s = await swGetDoc(swDoc(db, 'staff', v)); if (s.exists()) { name = s.data().name || v; position = s.data().position || ''; } } catch (e) {}

  return VIEW_AS;
}
async function swPickViewAs() {

async function swNewsCheck() {

function renderTools(tools, isManager, isOffice){
  const nav = document.getElementById('tool-nav');
  nav.innerHTML = '';
  let lastSection = null;
  // Tools that aren't switched on go in one "Coming soon" line at the bottom,
  // not as greyed tiles in their sections (19 Oct 2026: the list was too long).
  const toolLive = tool => { const en = (tools && tools[tool.pairKey]) || {}; return (tool.alwaysLive && !(tools && tools[tool.pairKey])) || !!en.live; };
  const soon = TOOLS.filter(t => !toolLive(t));
  const addSoon = () => {
    if (!soon.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'soon-wrap';
    wrap.innerHTML = '<button type="button" class="soon-btn" aria-expanded="false"><i class="ti ti-hourglass" aria-hidden="true"></i>Coming soon (' + soon.length + ')<i class="ti ti-chevron-down chev" aria-hidden="true"></i></button><div class="soon-list" hidden>' + soon.map(t => t.name).join('<br>') + '</div>';
    const btn = wrap.querySelector('.soon-btn'), list = wrap.querySelector('.soon-list');
    btn.addEventListener('click', () => { const open = list.hidden; list.hidden = !open; btn.setAttribute('aria-expanded', String(open)); });
    nav.appendChild(wrap);
  };
  TOOLS.forEach(tool => {
    if (!toolLive(tool)) return;
    if (tool.section !== lastSection){
      const label = document.createElement('div');
      label.className = 'tool-section-label';
      label.textContent = tool.section;
      nav.appendChild(label);
      lastSection = tool.section;
    }
    const entry = (tools && tools[tool.pairKey]) || {};
    const isLive = (tool.alwaysLive && !(tools && tools[tool.pairKey])) || !!entry.live;
    const href = entry.href || tool.href;
    let el;
    if (isLive){
      el = document.createElement('a');
      el.href = href;
      el.className = 'tile';
    } else {
      el = document.createElement('div');
      el.className = 'tile disabled';
      el.addEventListener('click', () => showToast(tool.name + ' is coming soon'));
    }
    el.innerHTML = '<i class="ti ' + tool.icon + '" aria-hidden="true"></i><span>' + tool.name +
      (isLive ? '' : '<span class="soon">Coming soon</span>') + '</span>';
    nav.appendChild(el);
  });

  if (!isManager){
    if (isOffice){
      const lab = document.createElement('div');
      lab.className = 'tool-section-label';
      lab.textContent = 'Office';
      nav.appendChild(lab);
      nav.appendChild(timesheetsTile(tools));
    }
    addSoon();
    return;
  }

  const reportEntries = REPORT_TOOLS
    .map(t => ({ tool: t, entry: (tools && tools[t.pairKey]) || {} }))
    .filter(x => x.entry.live && x.entry.reportHref);

  const label = document.createElement('div');
  label.className = 'tool-section-label';
  label.textContent = 'QS & Reporting';
  nav.appendChild(label);

  // Timesheets & leave (managers' view) — always shown to managers / QS.

  reportEntries.forEach(({ tool, entry }) => {
    const el = document.createElement('a');
    el.href = entry.reportHref;
    el.className = 'tile';
    el.innerHTML =
      '<span class="icon-wrap"><i class="ti ' + tool.icon + '" aria-hidden="true"></i><i class="ti ti-circle-check badge-check" aria-hidden="true"></i>' +
      '<span class="badge-count" data-count-id="' + tool.id + '" hidden>0</span></span>' +
      '<span>' + tool.name + ' reports</span>';
    nav.appendChild(el);
  });
  addSoon();
}

async function renderActivityFeed(reportEntries){
  const pane = document.getElementById('feed');
  if (reportEntries.length === 0){
    pane.innerHTML = '';
    return;
  }
  pane.innerHTML = 'Loading recent activity…';

  let allRecords = [];
  await Promise.all(reportEntries.map(async ({ tool, entry }) => {
    try {
      const q = query(collection(db, tool.id + 'Tests'), orderBy('date', 'desc'), limit(30));
      const snap = await getDocs(q);
      snap.forEach(d => {
        const r = d.data();
        if (r.deletedFlag) return;
        allRecords.push({
          tool, entry,
          title: r.equipmentId || r.category || tool.name,
          site: r.siteName || r.siteRef || '',
          date: r.date || '',
          qsed: !!r.qsed,
          siteRef: r.siteRef || ''
        });
      });
    } catch (e) {
      console.error('Could not load recent activity for ' + tool.id, e);
    }
  }));

  const pending = allRecords.filter(r => !r.qsed).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const recent = allRecords.filter(r => r.qsed).sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  // Badge counts come from this same fetch, not a separate query — a
  // Firestore query for qsed == false would silently miss any record where
  // qsed was never set at all (missing != false in a query), while "pending"
  // here already treats missing the same as false. Same source, so the
  // sidebar badge and the "Ready for QS" list can never disagree.
  const countsByTool = {};
  pending.forEach(r => { countsByTool[r.tool.id] = (countsByTool[r.tool.id] || 0) + 1; });
  Object.keys(countsByTool).forEach(id => {
    const badge = document.querySelector('[data-count-id="' + id + '"]');
    if (badge){ badge.textContent = countsByTool[id] > 99 ? '99+' : String(countsByTool[id]); badge.hidden = false; }
  });
  homeQS(countsByTool, reportEntries);

  if (pending.length === 0 && recent.length === 0){
    pane.innerHTML = 'No recent activity yet.';
    return;
  }

  function renderItem(r){
    const href = r.entry.reportHref + (r.siteRef ? ('?site=' + encodeURIComponent(r.siteRef)) : '');
    return '<a class="activity-item' + (r.qsed ? '' : ' pending') + '" href="' + href + '">' +
      '<i class="ti ' + r.tool.icon + '" aria-hidden="true"></i>' +
      '<div class="main"><div class="title">' + r.title + '</div><div class="meta">' + r.site + ' · ' + r.date + '</div></div>' +
      '<span class="activity-pill ' + (r.qsed ? 'done' : 'pending') + '">' + (r.qsed ? 'QSed' : 'Ready for QS') + '</span>' +
      '</a>';
  }

  let html = '<div class="activity-list">';
  if (pending.length){
    html += '<div class="activity-heading">Ready for QS</div>';
    html += pending.map(renderItem).join('');
  }
  if (recent.length){
    html += '<div class="activity-heading">Recent submissions</div>';
    html += recent.map(renderItem).join('');
  }
  html += '</div>';
  pane.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════════════════
//  HOME BOXES (v2.8). Dates, bank holidays, shift times and rota pieces are
//  copied from leave.html (keep in step).
// ═══════════════════════════════════════════════════════════════════════════
// England & Wales bank holidays, from gov.uk/bank-holidays (checked 10 Oct 2026).
// Same list as timesheet.html: add the next year each autumn (on the to-do list).
const BANK_HOLIDAYS = {
  '2026-01-01': "New Year's Day", '2026-04-03': 'Good Friday', '2026-04-06': 'Easter Monday',
  '2026-05-04': 'Early May bank holiday', '2026-05-25': 'Spring bank holiday', '2026-08-31': 'Summer bank holiday',
  '2026-12-25': 'Christmas Day', '2026-12-28': 'Boxing Day (substitute day)',
  '2027-01-01': "New Year's Day", '2027-03-26': 'Good Friday', '2027-03-29': 'Easter Monday',
  '2027-05-03': 'Early May bank holiday', '2027-05-31': 'Spring bank holiday', '2027-08-30': 'Summer bank holiday',
  '2027-12-27': 'Christmas Day (substitute day)', '2027-12-28': 'Boxing Day (substitute day)',
  '2028-01-03': "New Year's Day (substitute day)", '2028-04-14': 'Good Friday', '2028-04-17': 'Easter Monday',
  '2028-05-01': 'Early May bank holiday', '2028-05-29': 'Spring bank holiday', '2028-08-28': 'Summer bank holiday',
  '2028-12-25': 'Christmas Day', '2028-12-26': 'Boxing Day'
};
const BH_LAST_YEAR = 2028;
const SHIFT_DAY_START = 16 * 60 + 30;   // weekday on-call starts 4:30pm
const SHIFT_OFF_START = 8 * 60;         // weekend / bank holiday / shutdown day starts 8am
const SHIFT_END = 8 * 60;               // every shift ends 8am the next morning

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseISO(s); d.setDate(d.getDate() + n); return isoOf(d); }
function todayISO() { return isoOf(new Date()); }
function dow(s) { return parseISO(s).getDay(); }
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function longDate(s) { return parseISO(s).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
function shortDate(s) { return parseISO(s).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
function shortDateY(s) { return parseISO(s).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); }
const firstName = n => String(n || '').split(/[\s@.]/)[0] || n;

let SETTINGS = { shutdown: {}, swapEmails: [], nameMap: {}, infoEmail: 'info@simpsonandwood.co.uk' };
let STAFF = new Map();   // email -> { name, position }
function isShutdown(d) { return (SETTINGS.shutdown[d.slice(0, 4)] || []).includes(d); }
function isOffDay(d) { const w = dow(d); return w === 0 || w === 6 || !!BANK_HOLIDAYS[d] || isShutdown(d); }
function dayNote(d) { return BANK_HOLIDAYS[d] ? BANK_HOLIDAYS[d] : isShutdown(d) ? 'Christmas shutdown' : (dow(d) === 0 || dow(d) === 6) ? 'Weekend' : ''; }
function shiftStart(d) { return isOffDay(d) ? SHIFT_OFF_START : SHIFT_DAY_START; }
function shiftLen(d) { return 1440 - shiftStart(d) + SHIFT_END; }
// 990 -> "4:30pm", 480 -> "8am"
function clock(min) {
  min = ((min % 1440) + 1440) % 1440;
  const h = Math.floor(min / 60), m = min % 60;
  if (h === 0 && m === 0) return 'midnight';
  if (h === 12 && m === 0) return 'midday';
  return (h % 12 || 12) + (m ? ':' + pad(m) : '') + (h < 12 ? 'am' : 'pm');
}
function partLabel(d, s, e) { return clock(shiftStart(d) + s) + ' – ' + clock(shiftStart(d) + e); }
function shiftLabel(d) { return partLabel(d, 0, shiftLen(d)); }
// The real date and time an offset into a shift falls on: "YYYY-MM-DDTHH:MM:00".
function nowLocal() { const n = new Date(); return isoOf(n) + 'T' + pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':00'; }
function shiftTime(d, off) { const t = shiftStart(d) + off; return addDays(d, Math.floor(t / 1440)) + 'T' + pad(Math.floor((t % 1440) / 60)) + ':' + pad(t % 60) + ':00'; }
function staffName(email) { const s = STAFF.get(email); return (s && s.name) || ''; }
function nameOf(email) { return staffName(email) || email || ''; }
// Rota names from the old spreadsheet ("Mike") are matched to staff emails in
// the Settings tab of the Timesheets & leave page (leaveSettings/main.nameMap).
function emailForName(n) { return (n && SETTINGS.nameMap[n]) || ''; }
function holderOf(day) {
  const email = String(day.email || emailForName(day.name) || '').toLowerCase();
  return { email, name: (email && staffName(email)) || day.name || '' };
}
// A rota day as a list of pieces covering the whole shift: [{ s, e, email, name }]
// (s and e are minutes from the shift's start). "parts" are the bits someone
// else covers (part swaps); the main person has the rest.
function segmentsOf(day) {
  const len = shiftLen(day.date), main = holderOf(day);
  const parts = (day.parts || []).filter(p => p.e > p.s).slice().sort((a, b) => a.s - b.s);
  const out = []; let t = 0;
  parts.forEach(p => {
    const s = Math.max(p.s, t), e = Math.min(p.e, len);
    if (s > t) out.push({ s: t, e: s, email: main.email, name: main.name });
    if (e > s) { const em = String(p.email || emailForName(p.name) || '').toLowerCase(); out.push({ s, e, email: em, name: (em && staffName(em)) || p.name || '' }); }
    t = Math.max(t, e);
  });
  if (t < len) out.push({ s: t, e: len, email: main.email, name: main.name });

function heldBy(day, email) { return segmentsOf(day).filter(x => x.email && x.email === email); }
function coversRange(day, email, s, e) {
  let t = s;

  return t >= e;

// What the home page loaded. "my*" are the signed-in person's own; the rest

const H = { me: '', level: 'engineer', tools: {}, rota: new Map(), myLeave: [], mySwaps: [], myTs: [], leave: [], swaps: [], ts: [], qs: null, failed: 0 };
const SWAP_LATE_HOURS = 48;   // same as Timesheets & leave: unanswered after this, or the shift is this close
const LOOKBACK_DAYS = 31;     // same as the timesheet pages: how far back "missing" looks
const HB_AHEAD = 31;          // "and N more" on My next on-call counts this far ahead

const tsOf = v => v && typeof v.seconds === 'number' ? v.seconds * 1000 : (typeof v === 'number' ? v : 0);

const rangeText = l => shortDate(l.from) + (l.to && l.to !== l.from ? ' – ' + shortDate(l.to) : '');
const hbClock = s => clock(+s.slice(11, 13) * 60 + +s.slice(14, 16));   // "2026-10-23T16:30:00" -> "4:30pm"
function hbWhen(a, b) {   // "4:30pm – 8am" (overnight), or "4:30pm – Mon 26 Oct, 8am" when it runs longer
  const t = hbClock;
  const da = a.slice(0, 10), db = b.slice(0, 10);
  if (db === da || db === addDays(da, 1)) return `${t(a)} – ${t(b)}`;
  return `${t(a)} – ${shortDate(db)}, ${t(b)}`;
}

async function loadHome(email, level) {
  const me = email.toLowerCase(), today = todayISO();

  const docs = snap => { const out = []; snap.forEach(d => out.push(Object.assign({ id: d.id }, d.data()))); return out; };
  const jobs = [
    getDocs(collection(db, 'staff')).then(snap => { STAFF = new Map(); snap.forEach(d => { const x = d.data(); STAFF.set(d.id.toLowerCase(), { name: x.name || d.id, position: x.position || '', fills: x.fillsTimesheets !== false }); }); }),
    getDoc(doc(db, 'leaveSettings', 'main')).then(s => { if (s.exists()) SETTINGS = Object.assign(SETTINGS, s.data()); }),
    getDocs(query(collection(db, 'oncall'), where('date', '>=', addDays(today, -1)))).then(snap => { H.rota = new Map(); snap.forEach(d => H.rota.set(d.id, Object.assign({ date: d.id }, d.data()))); }),
    getDocs(query(collection(db, 'leave'), where('email', '==', me))).then(snap => { H.myLeave = real(docs(snap)); }),
    Promise.all([getDocs(query(collection(db, 'oncallSwaps'), where('aEmail', '==', me))), getDocs(query(collection(db, 'oncallSwaps'), where('bEmail', '==', me)))])
      .then(([a, b]) => { H.mySwaps = real([...docs(a), ...docs(b)]); }),
    getDocs(query(collection(db, 'timesheets'), where('engineerEmail', '==', me))).then(snap => { H.myTs = real(docs(snap)); })
  ];
  if (level !== 'engineer') jobs.push(
    getDocs(query(collection(db, 'leave'), where('to', '>=', addDays(today, -62)))).then(snap => { H.leave = real(docs(snap)); }),
    getDocs(query(collection(db, 'oncallSwaps'), where('firstShift', '>=', addDays(today, -31)))).then(snap => { H.swaps = real(docs(snap)); }),
    // Two months is enough to work out the last 31 days (the report page loads them all).
    getDocs(query(collection(db, 'timesheets'), where('date', '>=', addDays(today, -62)))).then(snap => { H.ts = real(docs(snap)); })
  );
  const res = await Promise.allSettled(jobs);
  H.failed = res.filter(r => r.status === 'rejected').length;
  res.filter(r => r.status === 'rejected').forEach(r => console.error('Home box data:', r.reason));

// ---- the rota as one timeline: back-to-back pieces for the same person joined up
function rotaBlocks() {
  const out = [];
  [...H.rota.keys()].sort().forEach(d => {
    segmentsOf(H.rota.get(d)).forEach(x => {
      const start = shiftTime(d, x.s), end = shiftTime(d, x.e), last = out[out.length - 1];
      if (last && last.end === start && last.email === x.email && last.name === x.name) last.end = end;
      else out.push({ start, end, email: x.email, name: x.name || 'Not set' });
    });
  });
  return out;
}
// The end of the coming weekend (or this one, if it's the weekend now):
// the Monday at 8am, pushed on past a bank holiday Monday.
function weekendEnd() {
  const today = todayISO(); let sat = today;
  while (dow(sat) !== 6) sat = addDays(sat, dow(sat) === 0 ? -1 : 1);
  let mon = addDays(sat, 2);
  while (isOffDay(mon)) mon = addDays(mon, 1);
  return mon + 'T08:00:00';
}

// ---- Office / management: what needs doing
function swapLate(s) {
  const items = [...(s.aGives || []), ...(s.bGives || [])];
  const firstStart = items.map(x => shiftTime(x.date, x.s)).sort()[0];
  if (Date.now() - tsOf(s.createdAt) > SWAP_LATE_HOURS * 3600000) return true;
  return !!(firstStart && (new Date(firstStart) - Date.now()) < SWAP_LATE_HOURS * 3600000);
}
function approvedFullOff(list, email, date) {
  return list.some(l => l.status === 'approved' && (l.email || '').toLowerCase() === email && (l.days || []).some(x => x.date === date && x.part === 'full'));
}
// Same rules as Timesheets & leave: from their first timesheet, weekdays only,
// not bank holidays, shutdown or a full day of approved leave, not today.
function missingFor(email, recs, leaveList) {
  if (!recs.length) return [];
  const have = new Set(recs.map(r => r.date)), today = todayISO();
  let from = recs.reduce((m, r) => r.date < m ? r.date : m, recs[0].date);
  if (from < addDays(today, -LOOKBACK_DAYS)) from = addDays(today, -LOOKBACK_DAYS);
  const out = [];
  for (let d = from; d < today; d = addDays(d, 1)) {
    if (isOffDay(d) || approvedFullOff(leaveList, email, d)) continue;
    if (!have.has(d)) out.push(d);
  }
  return out;
}
function teamMissing() {
  const by = new Map();
  H.ts.forEach(r => { const e = (r.engineerEmail || '').toLowerCase(); if (!by.has(e)) by.set(e, []); by.get(e).push(r); });
  let people = 0, days = 0;
  by.forEach((recs, e) => { const s = STAFF.get(e); if (s && !s.fills) return; const n = missingFor(e, recs, H.leave).length; if (n) { people++; days += n; } });
  return { people, days };
}
function diaryCount() {
  const today = todayISO();
  const add = [...H.leave.filter(l => l.status === 'approved' && l.type === 'holiday' && l.to >= today), ...H.swaps.filter(s => s.status === 'approved' && (s.firstShift || '') >= addDays(today, -3))]
    .filter(x => x.infoCal && x.infoCal.status === 'failed').length;
  const rm = [...H.leave, ...H.swaps].filter(x => ['cancelled', 'declined', 'rejected'].includes(x.status) && x.infoCal && (x.infoCal.ids || []).length).length;
  return add + rm;
}

// ---- the boxes
const hbLeaveLink = (tab, extra) => `leave.html?tab=${tab}${extra || ''}`;
function hbDate() {
  const today = todayISO(), end = addDays(today, 7), notes = [];
  const yr = today.slice(0, 4), shut = [...(SETTINGS.shutdown[yr] || []), ...(SETTINGS.shutdown[String(+yr + 1)] || [])].sort();
  const inWeek = shut.filter(d => d >= today && d <= end);
  let sFrom = '', sTo = '';
  if (inWeek.length) {
    const y = inWeek[0].slice(0, 4), all = (SETTINGS.shutdown[y] || []).slice().sort();
    sFrom = all[0]; sTo = all[all.length - 1];
    notes.push(`<i class="ti ti-christmas-tree"></i><span><b>Christmas shutdown</b> ${today >= sFrom ? 'until' : 'from'} ${esc(shortDate(today >= sFrom ? sTo : sFrom))}${today >= sFrom ? '' : ' to ' + esc(shortDate(sTo))}.</span>`);
  }
  for (let d = today; d <= end; d = addDays(d, 1)) {
    if (!BANK_HOLIDAYS[d] || (sFrom && d >= sFrom && d <= sTo)) continue;
    notes.push(`<i class="ti ti-calendar-star"></i><span><b>Bank holiday</b> ${d === today ? 'today' : 'on ' + esc(shortDate(d))}: ${esc(BANK_HOLIDAYS[d])}.</span>`);
  }
  return `<div class="hb-date">${esc(parseISO(today).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }))}</div>` +
    notes.map(n => `<div class="hb-notice">${n}</div>`).join('');
}
function hbOnCallNow(blocks) {
  if (!blocks.length) return `<div class="hb-card"><h3><i class="ti ti-phone-call"></i> On call</h3><div class="hb-empty">The rota isn't in the app yet.</div></div>`;
  const now = nowLocal(), until = weekendEnd();
  // Up to the end of the coming weekend, but always at least the next three.
  const ahead = blocks.filter(b => b.end > now), within = ahead.filter(b => b.start < until);
  const rows = (within.length >= 3 ? within : ahead.slice(0, 3)).slice(0, 6).map(b => {
    const isNow = b.start <= now, sd = b.start.slice(0, 10), ed = b.end.slice(0, 10);
    const day = isNow ? 'Now' : sd === todayISO() ? (+b.start.slice(11, 13) >= 12 ? 'Tonight' : 'Today') : shortDate(sd);
    const span = isNow ? 'until ' + (ed <= addDays(todayISO(), 1) ? hbClock(b.end) : shortDate(ed) + ', ' + hbClock(b.end)) : hbWhen(b.start, b.end);
    return `<div class="hb-row${isNow ? ' now' : ''}${b.email === H.me ? ' mine' : ''}"><span class="w"><b>${esc(day)}</b> ${esc(span)}</span><span class="n">${esc(b.email === H.me ? 'You' : b.name)}</span></div>`;

}
function hbMyOnCall(blocks, always) {

}

    const reportEntries = REPORT_TOOLS
      .map(t => ({ tool: t, entry: (tools && tools[t.pairKey]) || {} }))
      .filter(x => x.entry.live && x.entry.reportHref);
    renderActivityFeed(reportEntries);
  }
  SW = Object.assign(SW, { page: 'index', version: VERSION, level: isManager ? 'management' : isOffice ? 'office' : 'engineer', news: NEWS, help: HELP });
  swExtrasStart();
});

document.getElementById('mgmtBtn').addEventListener('click', () => { location.href = 'management.html'; });
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(err => console.error("Service worker registration failed:", err));
  });
}
</script>
