<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Simpson &amp; Wood — Engineer Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.49.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="sw-design.css">
<style>
  /* Colours, type and the shared blocks' styles come from sw-design.css (design guide). */
  :root{ --radius:10px; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Barlow',sans-serif; background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%;}
  button{font-family:inherit;}
  h1,h2,h3,.label{font-family:'Barlow Condensed',sans-serif;}
  .screen{min-height:100vh;}
  [hidden]{display:none !important;}

  /* ---- sign-in ---- */
  #signinScreen{display:flex; min-height:100vh; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;}
  #signinScreen img{height:44px; margin-bottom:28px;}
  #signinScreen h2{font-weight:700; text-transform:uppercase; font-size:20px; margin:0 0 8px;}
  #signinScreen p{color:var(--grey); font-size:14px; max-width:320px; margin:0 0 26px;}
  .ms-btn{display:flex; align-items:center; gap:10px; background:var(--ink); color:#fff; border:none; padding:13px 22px; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer;}
  #signinErr{color:var(--red); font-size:13px; margin:16px 0 0; max-width:320px;}

  /* ---- topbar ---- */
  .topbar{display:flex; align-items:center; justify-content:space-between; background:var(--ink); padding:calc(10px + env(safe-area-inset-top)) 20px 10px; min-height:calc(56px + env(safe-area-inset-top));}
  .topbar-brand{display:flex; align-items:center; gap:10px; text-decoration:none;}
  .topbar-logo{height:28px;}
  #versionLabel{color:var(--hdr-muted); font-size:11px; margin:0;}
  .topbar-right{display:flex; align-items:center; gap:6px;}
  .user-name{color:var(--field); font-size:13px; margin-right:8px;}
  .icon-btn{background:none; border:none; color:var(--field); width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px;}
  .icon-btn:hover{background:rgba(255,255,255,0.1); color:#fff;}

  /* ---- layout / tiles (mobile-first grid) ---- */
  .layout{display:block; gap:0; align-items:stretch;}   /* (sw-design.css has a .layout grid for other pages; not this one) */
  .tool-nav{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:12px; padding:20px;}
  .tool-section-label{font-size:13px; color:var(--grey); text-transform:uppercase; letter-spacing:0.04em; grid-column:1/-1; margin:8px 0 -4px;}
  .tool-section-label:first-child{margin-top:0;}
  .tile{position:relative; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 8px; text-align:center; text-decoration:none; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;}
  .tile i{font-size:24px; color:var(--red);}
  .tile span{font-size:12.5px; line-height:1.25;}
  .tile.disabled{opacity:0.45; cursor:default;}
  .tile.disabled i{color:var(--grey);}
  .tile.disabled .soon{display:block; font-size:10.5px; color:var(--grey); margin-top:-4px;}
  .soon-wrap{grid-column:1/-1; margin-top:6px;}
  .soon-btn{background:none; border:none; padding:6px 0; font-family:'Barlow',sans-serif; font-size:13px; color:var(--grey); cursor:pointer; display:flex; align-items:center; gap:6px;}
  .soon-btn i{font-size:15px;}
  .soon-btn .chev{transition:transform .15s;}
  .soon-btn[aria-expanded="true"] .chev{transform:rotate(180deg);}
  .soon-list{font-size:12.5px; color:var(--grey); line-height:1.6; padding:2px 0 4px 21px;}
  .content-pane{display:none;}
  .icon-wrap{position:relative; display:inline-flex; align-items:center; justify-content:center;}
  /* v3.0: the QS count sits at the end of the row (PC) or on the tile's corner (phone), never on the icon */
  .tile .tile-count{position:absolute; top:-7px; right:-7px; background:var(--red); color:#fff; font-size:11px; font-weight:600; min-width:20px; height:18px; border-radius:20px; display:inline-flex; align-items:center; justify-content:center; padding:0 5px; line-height:1;}
  .content-pane-inner{width:100%; max-width:1500px; display:flex; flex-direction:column; align-items:stretch;}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity 0.2s;}
  .toast.show{opacity:1;}

  @media (min-width:900px){
    .layout{display:flex; min-height:calc(100vh - 56px);}
    .tool-nav{display:flex; flex-direction:column; width:230px; background:var(--ink); padding:20px 14px; gap:2px; flex-shrink:0; grid-template-columns:none;}
    .tool-section-label{color:var(--hdr-muted); margin:14px 0 2px; padding:0 10px;}
    .tool-section-label:first-child{margin-top:0;}
    .tile{flex-direction:row; justify-content:flex-start; text-align:left; background:none; border:none; border-radius:8px; padding:9px 10px; gap:10px;}
    .tile:hover{background:rgba(255,255,255,0.06);}
    .tile i{font-size:17px; width:20px;}
    .tile span{font-size:13.5px; color:var(--line);}
    .tile .tile-count{position:static; margin-left:auto; flex-shrink:0; font-size:11.5px; min-width:22px; height:20px; padding:0 7px; color:#fff;}
    .tile.disabled .soon{display:inline; margin:0 0 0 6px; font-size:10.5px;}
    .tile.disabled span{display:flex; align-items:center;}
    .soon-wrap{margin-top:14px; padding:0 10px;}
    .soon-btn{color:var(--hdr-muted); font-size:12.5px;}
    .soon-btn:hover{color:var(--field);}
    .soon-list{color:var(--hdr-muted); padding-left:21px;}
    .content-pane{display:flex; flex:1; align-items:flex-start; justify-content:center; color:var(--grey); font-size:15px; padding:28px 32px 40px; overflow-y:auto; min-width:0;}
  }

  /* ---- home boxes (v2.8) ---- */
  .home-boxes{width:100%; display:flex; flex-direction:column; gap:12px;}
  .home-boxes:empty{display:none;}
  /* v4.0: two columns on a PC (main + side, layout option C), one on a phone; Arrange */
  .hb-head{display:flex; align-items:center; justify-content:space-between; gap:10px 14px; flex-wrap:wrap;}
  .hb-arr{display:flex; gap:8px; flex-wrap:wrap;}
  .hb-arr .btn{min-height:38px; padding:7px 12px; font-size:14px; color:var(--ink);}
  .hb-arr .btn.primary{background:var(--red); border-color:var(--red); color:#fff;}
  .hb-arrnote{flex-basis:100%; font-size:14px; color:var(--grey); margin:-2px 0 0;}
  .hb-cols{display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:14px; align-items:start;}
  .hb-cols.phone{display:block;}
  .hb-cols.solo{display:block;}
  .hb-cols.solo .hb-col{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); align-items:start;}
  .hb-col{display:flex; flex-direction:column; gap:14px; min-width:0;}
  .hb-box{min-width:0;}
  .hb-col-label{font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--grey);}
  .arranging .hb-col{min-height:110px; border:2px dashed var(--field); border-radius:14px; padding:10px; background:rgba(255,255,255,.45);}
  .arranging .hb-col.over{border-color:var(--red); background:var(--red-tint);}
  .arranging .hb-box .hb-card{border-top-left-radius:0; border-top-right-radius:0;}
  .arranging .hb-card a, .arranging .hb-card button{pointer-events:none;}
  .arranging .pc .hb-box{cursor:grab;}
  .hb-box.dragging{opacity:.4;}
  .hb-ctl{display:flex; flex-wrap:wrap; gap:6px; align-items:center; background:var(--ink); color:#fff; border-radius:12px 12px 0 0; padding:6px 8px; font-size:13px;}
  .hb-ctl .grip{margin-right:auto; display:inline-flex; gap:5px; align-items:center; font-weight:600; padding:0 4px;}
  .hb-ctl .grip i{font-size:18px; color:#fff;}
  .hb-ctl button{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28); color:#fff; border-radius:8px; padding:5px 10px; min-height:34px; font-size:13.5px; font-weight:600; cursor:pointer; display:inline-flex; gap:4px; align-items:center;}
  .hb-ctl button i{font-size:16px; color:#fff;}
  .hb-ctl button:disabled{opacity:.35; cursor:default;}
  .hb-tray{background:var(--card); border:1.5px dashed var(--field); border-radius:12px; padding:12px 14px; color:var(--ink); font-size:14.5px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .hb-tray b{margin-right:4px;}
  .hb-tray .chip i{color:var(--red);}
  @media (max-width:899px){ .hb-ctl button{min-height:40px;} }
  .hb-date{font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:600; color:var(--ink); line-height:1.1;}
  .hb-notice{display:flex; gap:9px; align-items:flex-start; background:var(--blue-bg); border:1px solid var(--blue-line); color:var(--blue); border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.4;}
  .hb-notice i{font-size:18px; flex-shrink:0;}
  .hb-notice.bad{background:var(--red-tint); border-color:var(--bad-line); color:var(--bad-ink);}
  .hb-card{background:var(--card); border:0.5px solid var(--line); border-radius:12px; padding:14px 16px; color:var(--ink); font-size:14.5px; line-height:1.4;}
  .hb-card h3{margin:0 0 8px; font-size:18px; font-weight:600; display:flex; align-items:center; gap:8px;}
  .hb-card h3 i{color:var(--red); font-size:20px;}
  .hb-alert{border-left:4px solid var(--red);}
  .hb-row{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:7px 0; border-top:1px solid var(--line); color:var(--ink); text-decoration:none;}
  .hb-card h3 + .hb-row{border-top:none;}
  .hb-row .w{color:var(--grey);}
  .hb-row .w b{color:var(--ink); margin-right:4px;}
  .hb-row .n{font-weight:600; text-align:right; white-space:nowrap;}
  .hb-row.now{background:var(--red-tint); margin:0 -8px; padding:7px 8px; border-radius:8px; border-top-color:transparent;}
  .hb-row.mine .n{color:var(--red);}
  .hb-row i{color:var(--red); margin-right:4px;}
  a.hb-row:hover{color:var(--red);}
  .hb-red{color:var(--bad-ink); font-weight:600;}
  .hb-big{font-size:17px; font-weight:600;}
  .hb-sub{color:var(--grey); font-size:13.5px; margin-top:2px;}
  .hb-sub b{color:var(--ink);}
  .hb-empty{color:var(--grey);}
  .hb-link{display:inline-flex; align-items:center; gap:3px; margin-top:8px; color:var(--red); font-weight:600; text-decoration:none; font-size:14px;}
  .hb-acts{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .hb-btn{display:inline-flex; align-items:center; gap:6px; background:var(--red); color:#fff; border:1px solid var(--red); border-radius:8px; padding:8px 14px; font-size:14px; font-weight:600; text-decoration:none;}
  .hb-btn:hover{background:var(--red-dark);}
  .hb-btn.ghost{background:var(--card); color:var(--ink); border-color:var(--line);}
  .hb-btn.ghost:hover{border-color:var(--red);}
  .hb-swap{padding:8px 0; border-top:1px solid var(--line);}
  .hb-card h3 + .hb-swap{border-top:none; padding-top:0;}
  .hb-pill{font-size:12px; font-weight:600; padding:2px 9px; border-radius:20px; background:var(--soft); color:var(--ink); white-space:nowrap;}
  .hb-pill.red{background:var(--red-tint); color:var(--bad-ink);}
  .hb-pill.amber{background:var(--amber-bg); color:var(--amber);}
  .hb-pill.green{background:var(--green-bg); color:var(--green);}
  @media (max-width:899px){
    .layout{display:flex; flex-direction:column;}
    .content-pane{display:block; order:-1; padding:16px 16px 0;}
    .content-pane-inner{max-width:none;}
    .tool-nav{grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; padding:16px;}
    .tile{padding:10px 6px; gap:6px; border-radius:10px;}
    .tile i{font-size:20px;}
    .tile span{font-size:12px;}
  }

  .tile .unsent-pill{display:inline-block; margin-left:6px; background:var(--amber-bg); color:var(--amber); border-radius:20px; padding:1px 7px; font-size:10.5px; font-weight:600; white-space:nowrap;}
  .tile .unsent-pill.bad{background:var(--red-tint); color:var(--bad-ink);}
  @media (max-width:899px){ .tile .unsent-pill{display:block; margin:4px auto 0; width:max-content;} }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
</head>
<body>

<div id="signinScreen">
  <img src="sw-logo.png" alt="Simpson &amp; Wood">
  <h2>Engineer apps</h2>
  <p>Sign in with your Simpson &amp; Wood Microsoft account to get to your tools.</p>
  <button id="msSignInBtn" class="ms-btn"><i class="ti ti-brand-windows" aria-hidden="true"></i> Sign in with Microsoft</button>
  <p id="signinErr"></p>
</div>

<div id="appRoot" class="screen" hidden>
  <header class="topbar">
    <a class="topbar-brand" href="index.html" title="Home">
      <img src="sw-logo-white.png" alt="Simpson &amp; Wood" class="topbar-logo">
      <p id="versionLabel">v1.0</p>
    </a>
    <div class="topbar-right">
      <span id="whoName" class="user-name"></span>
      <button id="mgmtBtn" class="icon-btn" hidden title="Management"><i class="ti ti-settings" aria-hidden="true"></i></button>
      <button id="signOutBtn" class="icon-btn" title="Sign out"><i class="ti ti-logout" aria-hidden="true"></i></button>
    </div>
  </header>
  <div class="layout">
    <nav class="tool-nav" id="tool-nav"></nav>
    <div class="content-pane" id="content-pane"><div class="content-pane-inner" id="content-pane-inner"><div class="home-boxes" id="homeBoxes"></div></div></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, OAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, getDocFromServer,
  collection, getDocs, query, where, orderBy, limit, setDoc
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
// v4.0: View as, What's New, Help, Not sent yet, the update bar and error
// reporting come from the shared file (standards §15), not copies in this page.
import * as SWS from './sw-shared.js';

const VERSION = "v4.0";
document.getElementById('versionLabel').textContent = VERSION;

const firebaseConfig = {
  apiKey: "AIzaSyB5foKhRfIMG91bD5QyT7hHd1XBbeQGucw",
  authDomain: "simpson-wood-engineer-app.firebaseapp.com",
  projectId: "simpson-wood-engineer-app",
  storageBucket: "simpson-wood-engineer-app.firebasestorage.app",
  messagingSenderId: "201961281346",
  appId: "1:201961281346:web:3c7386b73b41ce9df35adb"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
// v4.0 (27 Oct 2026): shared files (sw-design.css, sw-shared.js, with error
// reporting); the Ready for QS / Recent submissions list removed; PC layout
// in two columns (main + side); Arrange (move / hide boxes, own layout on PC
// and phone); Rob's To do shows errors to look at.
// v3.0 (27 Oct 2026): design catch-up (guide colours, plain sign-in with the
// black Microsoft button, Barlow 400-700, icons pinned to Tabler 3.49.0, logo
// links home), QS counts moved to the end of the row / tile corner with the
// ticks gone, and the Timesheet fallback link fixed.
// v2.9: the multi-tab cache, so this page, the engineer apps and any second
// tab share the phone's saved data and unsent queue safely.
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
SWS.swSetup({ db, auth, page: 'index', version: VERSION });

// "A new version is ready" bar (in sw-shared.js): wait for unsent tests.
window.swUpdateBlocker = () => SWS.swuMine().some(x => !x.failed) ? 'Wait until your tests have sent (the yellow bar goes), then tap Update.' : '';

// Homepage: the tool's tile says how many of its tests are still waiting.
document.addEventListener('swu-change', e => {
  const all = [...e.detail.waiting, ...e.detail.failed];
  const byColl = {};
  all.forEach(x => { (byColl[x.c] = byColl[x.c] || { n: 0, bad: 0 }).n++; if (x.failed) byColl[x.c].bad++; });
  document.querySelectorAll('.tile[data-tool]').forEach(t => {
    const c = byColl[t.dataset.tool + 'Tests'];
    let pill = t.querySelector('.unsent-pill');
    if (!c) { if (pill) pill.remove(); return; }
    if (!pill) { pill = document.createElement('span'); pill.className = 'unsent-pill'; t.querySelector('span').appendChild(pill); }
    pill.className = 'unsent-pill' + (c.bad ? ' bad' : '');
    pill.textContent = c.bad ? c.bad + ' didn\'t save' : c.n + ' not sent';
  });
});

const msProvider = new OAuthProvider('microsoft.com');
msProvider.setCustomParameters({ tenant: 'abd23e0c-2d96-49ad-a280-99ff317f7d60' });

// Tool catalogue. "pairKey" maps to the live/coming-later flag stored in
// Firestore at config/homepage -> tools.{pairKey}. v2.6: the timesheet is on
// the Live apps panel too. Until it has an entry there it stays live on
// timesheet.html (alwaysLive); once it has one, the panel decides (off = off).
// v3.0: the fallback pointed at sw-timesheet.html, deleted 23 Oct 2026.
const TOOLS = [
  { section: "Daily tools", id: "timesheet", name: "Timesheet", icon: "ti-clock", href: "timesheet.html", pairKey: "timesheet", alwaysLive: true },
  { section: "Daily tools", id: "holiday", name: "Leave & on-call", icon: "ti-calendar-event", href: "leave.html", pairKey: "holiday" },
  { section: "Reference", id: "firetoolkit", name: "Fire toolkit", icon: "ti-flame", href: "fire-toolkit.html", pairKey: "firetoolkit" },
  { section: "Customer reports", id: "isolator", name: "Isolator testing", icon: "ti-bolt", href: "isolator-interlock-test.html", pairKey: "isolator" },
  { section: "Customer reports", id: "aov", name: "AOV testing", icon: "ti-window", href: "aov-test.html", pairKey: "aov" },
  { section: "Customer reports", id: "gate", name: "Gate service", icon: "ti-fence", href: "gate-test.html", pairKey: "gate" },
  { section: "Customer reports", id: "cctv", name: "CCTV service", icon: "ti-video", href: "cctv-service.html", pairKey: "cctv" },
  { section: "Customer reports", id: "pfc", name: "Power factor correction", icon: "ti-circuit-capacitor", href: "pfc-service.html", pairKey: "pfc" },
  { section: "Admin & compliance", id: "vancheck", name: "Van check", icon: "ti-truck", href: "van-check.html", pairKey: "vancheck" },
  { section: "Admin & compliance", id: "laddercheck", name: "Step / ladder check", icon: "ti-stairs", href: "ladder-check.html", pairKey: "laddercheck" },
  { section: "Admin & compliance", id: "firstaid", name: "First aid kit check", icon: "ti-first-aid-kit", href: "first-aid-check.html", pairKey: "firstaid" },
  { section: "Admin & compliance", id: "harness", name: "Harness inspection", icon: "ti-fall", href: "harness-check.html", pairKey: "harness" }
];

// Customer-report tools double up as "QS & Reporting" entries for managers —
// same icon as the matching test tool (with a checkmark badge added in CSS),
// pointing at that tool's report file instead of its engineer file. Each
// app's un-QSed count comes from querying "{id}Tests" for qsed == false,
// per the qsed convention agreed for every customer-report app.
const REPORT_TOOLS = TOOLS.filter(t => t.section === "Customer reports");

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// The managers' Timesheets & leave page. Managers / QS see it under QS &
// Reporting; Office staff (Jan) get it in an Office section of their own.
function timesheetsTile(tools){
  const entry = (tools && tools.timesheet) || {};
  const ts = document.createElement('a');
  ts.href = entry.reportHref || 'timesheet-report.html';
  ts.className = 'tile';
  ts.innerHTML = '<i class="ti ti-clock" aria-hidden="true"></i><span>Timesheets &amp; leave</span>';
  return ts;
}

function renderTools(tools, isManager, isOffice){
  const nav = document.getElementById('tool-nav');
  nav.innerHTML = '';
  let lastSection = null;
  // Tools that aren't switched on go in one "Coming soon" line at the bottom,
  // not as greyed tiles in their sections (19 Oct 2026: the list was too long).
  const toolLive = tool => { const en = (tools && tools[tool.pairKey]) || {}; return (tool.alwaysLive && !(tools && tools[tool.pairKey])) || !!en.live; };
  const soon = TOOLS.filter(t => !toolLive(t));
  const addSoon = () => {
    if (!soon.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'soon-wrap';
    wrap.innerHTML = '<button type="button" class="soon-btn" aria-expanded="false"><i class="ti ti-hourglass" aria-hidden="true"></i>Coming soon (' + soon.length + ')<i class="ti ti-chevron-down chev" aria-hidden="true"></i></button><div class="soon-list" hidden>' + soon.map(t => t.name).join('<br>') + '</div>';
    const btn = wrap.querySelector('.soon-btn'), list = wrap.querySelector('.soon-list');
    btn.addEventListener('click', () => { const open = list.hidden; list.hidden = !open; btn.setAttribute('aria-expanded', String(open)); });
    nav.appendChild(wrap);
  };
  TOOLS.forEach(tool => {
    if (!toolLive(tool)) return;
    if (tool.section !== lastSection){
      const label = document.createElement('div');
      label.className = 'tool-section-label';
      label.textContent = tool.section;
      nav.appendChild(label);
      lastSection = tool.section;
    }
    const entry = (tools && tools[tool.pairKey]) || {};

  const label = document.createElement('div');

async function loadQsCounts(reportEntries){

  '2026-01-01': "New Year's Day", '2026-04-03': 'Good Friday', '2026-04-06': 'Easter Monday',
  '2026-05-04': 'Early May bank holiday', '2026-05-25': 'Spring bank holiday', '2026-08-31': 'Summer bank holiday',

  '2027-01-01': "New Year's Day", '2027-03-26': 'Good Friday', '2027-03-29': 'Easter Monday',
  '2027-05-03': 'Early May bank holiday', '2027-05-31': 'Spring bank holiday', '2027-08-30': 'Summer bank holiday',
  '2027-12-27': 'Christmas Day (substitute day)', '2027-12-28': 'Boxing Day (substitute day)',
  '2028-01-03': "New Year's Day (substitute day)", '2028-04-14': 'Good Friday', '2028-04-17': 'Easter Monday',
  '2028-05-01': 'Early May bank holiday', '2028-05-29': 'Spring bank holiday', '2028-08-28': 'Summer bank holiday',

};
const BH_LAST_YEAR = 2028;
const SHIFT_DAY_START = 16 * 60 + 30;   // weekday on-call starts 4:30pm
const SHIFT_OFF_START = 8 * 60;         // weekend / bank holiday / shutdown day starts 8am
const SHIFT_END = 8 * 60;               // every shift ends 8am the next morning

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseISO(s); d.setDate(d.getDate() + n); return isoOf(d); }
function todayISO() { return isoOf(new Date()); }
function dow(s) { return parseISO(s).getDay(); }
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function longDate(s) { return parseISO(s).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
function shortDate(s) { return parseISO(s).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
function shortDateY(s) { return parseISO(s).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); }
const firstName = n => String(n || '').split(/[\s@.]/)[0] || n;

let SETTINGS = { shutdown: {}, swapEmails: [], nameMap: {}, infoEmail: 'info@simpsonandwood.co.uk' };
let STAFF = new Map();   // email -> { name, position }
function isShutdown(d) { return (SETTINGS.shutdown[d.slice(0, 4)] || []).includes(d); }
function isOffDay(d) { const w = dow(d); return w === 0 || w === 6 || !!BANK_HOLIDAYS[d] || isShutdown(d); }
function dayNote(d) { return BANK_HOLIDAYS[d] ? BANK_HOLIDAYS[d] : isShutdown(d) ? 'Christmas shutdown' : (dow(d) === 0 || dow(d) === 6) ? 'Weekend' : ''; }
function shiftStart(d) { return isOffDay(d) ? SHIFT_OFF_START : SHIFT_DAY_START; }
function shiftLen(d) { return 1440 - shiftStart(d) + SHIFT_END; }
// 990 -> "4:30pm", 480 -> "8am"
function clock(min) {
  min = ((min % 1440) + 1440) % 1440;
  const h = Math.floor(min / 60), m = min % 60;
  if (h === 0 && m === 0) return 'midnight';
  if (h === 12 && m === 0) return 'midday';
  return (h % 12 || 12) + (m ? ':' + pad(m) : '') + (h < 12 ? 'am' : 'pm');
}
function partLabel(d, s, e) { return clock(shiftStart(d) + s) + ' – ' + clock(shiftStart(d) + e); }
function shiftLabel(d) { return partLabel(d, 0, shiftLen(d)); }
// The real date and time an offset into a shift falls on: "YYYY-MM-DDTHH:MM:00".
function nowLocal() { const n = new Date(); return isoOf(n) + 'T' + pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':00'; }
function shiftTime(d, off) { const t = shiftStart(d) + off; return addDays(d, Math.floor(t / 1440)) + 'T' + pad(Math.floor((t % 1440) / 60)) + ':' + pad(t % 60) + ':00'; }
function staffName(email) { const s = STAFF.get(email); return (s && s.name) || ''; }
function nameOf(email) { return staffName(email) || email || ''; }
// Rota names from the old spreadsheet ("Mike") are matched to staff emails in
// the Settings tab of the Timesheets & leave page (leaveSettings/main.nameMap).
function emailForName(n) { return (n && SETTINGS.nameMap[n]) || ''; }
function holderOf(day) {
  const email = String(day.email || emailForName(day.name) || '').toLowerCase();
  return { email, name: (email && staffName(email)) || day.name || '' };
}
// A rota day as a list of pieces covering the whole shift: [{ s, e, email, name }]
// (s and e are minutes from the shift's start). "parts" are the bits someone
// else covers (part swaps); the main person has the rest.
function segmentsOf(day) {
  const len = shiftLen(day.date), main = holderOf(day);
  const parts = (day.parts || []).filter(p => p.e > p.s).slice().sort((a, b) => a.s - b.s);
  const out = []; let t = 0;
  parts.forEach(p => {
    const s = Math.max(p.s, t), e = Math.min(p.e, len);
    if (s > t) out.push({ s: t, e: s, email: main.email, name: main.name });
    if (e > s) { const em = String(p.email || emailForName(p.name) || '').toLowerCase(); out.push({ s, e, email: em, name: (em && staffName(em)) || p.name || '' }); }
    t = Math.max(t, e);
  });
  if (t < len) out.push({ s: t, e: len, email: main.email, name: main.name });
  return out;
}
function heldBy(day, email) { return segmentsOf(day).filter(x => x.email && x.email === email); }
function coversRange(day, email, s, e) {
  let t = s;
  for (const x of heldBy(day, email)) { if (x.s <= t && x.e > t) t = x.e; }
  return t >= e;
}

const SWAP_LATE_HOURS = 48;   // same as Timesheets & leave: unanswered after this, or the shift is this close
const LOOKBACK_DAYS = 31;     // same as the timesheet pages: how far back "missing" looks
const HB_AHEAD = 31;          // "and N more" on My next on-call counts this far ahead

const tsOf = v => v && typeof v.seconds === 'number' ? v.seconds * 1000 : (typeof v === 'number' ? v : 0);
const real = list => list.filter(x => !x.testData);
// A swap still "waiting" after its first shift has gone is stale: not worth showing.
const swapLive = s => (s.firstShift || '9') >= addDays(todayISO(), -1);
const itemText = x => `${shortDate(x.date)} ${partLabel(x.date, x.s, x.e)}`;
const rangeText = l => shortDate(l.from) + (l.to && l.to !== l.from ? ' – ' + shortDate(l.to) : '');
const hbClock = s => clock(+s.slice(11, 13) * 60 + +s.slice(14, 16));   // "2026-10-23T16:30:00" -> "4:30pm"
function hbWhen(a, b) {   // "4:30pm – 8am" (overnight), or "4:30pm – Mon 26 Oct, 8am" when it runs longer
  const t = hbClock;
  const da = a.slice(0, 10), db = b.slice(0, 10);

}

// ---- the rota as one timeline: back-to-back pieces for the same person joined up
function rotaBlocks() {
  const out = [];
  [...H.rota.keys()].sort().forEach(d => {
    segmentsOf(H.rota.get(d)).forEach(x => {
      const start = shiftTime(d, x.s), end = shiftTime(d, x.e), last = out[out.length - 1];
      if (last && last.end === start && last.email === x.email && last.name === x.name) last.end = end;
      else out.push({ start, end, email: x.email, name: x.name || 'Not set' });
    });
  });
  return out;
}
// The end of the coming weekend (or this one, if it's the weekend now):
// the Monday at 8am, pushed on past a bank holiday Monday.
function weekendEnd() {
  const today = todayISO(); let sat = today;
  while (dow(sat) !== 6) sat = addDays(sat, dow(sat) === 0 ? -1 : 1);
  let mon = addDays(sat, 2);
  while (isOffDay(mon)) mon = addDays(mon, 1);
  return mon + 'T08:00:00';
}

// ---- Office / management: what needs doing
function swapLate(s) {
  const items = [...(s.aGives || []), ...(s.bGives || [])];
  const firstStart = items.map(x => shiftTime(x.date, x.s)).sort()[0];
  if (Date.now() - tsOf(s.createdAt) > SWAP_LATE_HOURS * 3600000) return true;
  return !!(firstStart && (new Date(firstStart) - Date.now()) < SWAP_LATE_HOURS * 3600000);
}
function approvedFullOff(list, email, date) {
  return list.some(l => l.status === 'approved' && (l.email || '').toLowerCase() === email && (l.days || []).some(x => x.date === date && x.part === 'full'));
}
// Same rules as Timesheets & leave: from their first timesheet, weekdays only,
// not bank holidays, shutdown or a full day of approved leave, not today.
function missingFor(email, recs, leaveList) {
  if (!recs.length) return [];
  const have = new Set(recs.map(r => r.date)), today = todayISO();
  let from = recs.reduce((m, r) => r.date < m ? r.date : m, recs[0].date);
  if (from < addDays(today, -LOOKBACK_DAYS)) from = addDays(today, -LOOKBACK_DAYS);
  const out = [];
  for (let d = from; d < today; d = addDays(d, 1)) {
    if (isOffDay(d) || approvedFullOff(leaveList, email, d)) continue;
    if (!have.has(d)) out.push(d);
  }
  return out;
}
function teamMissing() {
  const by = new Map();
  H.ts.forEach(r => { const e = (r.engineerEmail || '').toLowerCase(); if (!by.has(e)) by.set(e, []); by.get(e).push(r); });
  let people = 0, days = 0;
  by.forEach((recs, e) => { const s = STAFF.get(e); if (s && !s.fills) return; const n = missingFor(e, recs, H.leave).length; if (n) { people++; days += n; } });
  return { people, days };
}
function diaryCount() {
  const today = todayISO();
  const add = [...H.leave.filter(l => l.status === 'approved' && l.type === 'holiday' && l.to >= today), ...H.swaps.filter(s => s.status === 'approved' && (s.firstShift || '') >= addDays(today, -3))]
    .filter(x => x.infoCal && x.infoCal.status === 'failed').length;
  const rm = [...H.leave, ...H.swaps].filter(x => ['cancelled', 'declined', 'rejected'].includes(x.status) && x.infoCal && (x.infoCal.ids || []).length).length;
  return add + rm;
}

// ---- the boxes
const hbLeaveLink = (tab, extra) => `leave.html?tab=${tab}${extra || ''}`;
function hbDate() {
  const today = todayISO(), end = addDays(today, 7), notes = [];
  const yr = today.slice(0, 4), shut = [...(SETTINGS.shutdown[yr] || []), ...(SETTINGS.shutdown[String(+yr + 1)] || [])].sort();
  const inWeek = shut.filter(d => d >= today && d <= end);
  let sFrom = '', sTo = '';
  if (inWeek.length) {
    const y = inWeek[0].slice(0, 4), all = (SETTINGS.shutdown[y] || []).slice().sort();
    sFrom = all[0]; sTo = all[all.length - 1];
    notes.push(`<i class="ti ti-christmas-tree"></i><span><b>Christmas shutdown</b> ${today >= sFrom ? 'until' : 'from'} ${esc(shortDate(today >= sFrom ? sTo : sFrom))}${today >= sFrom ? '' : ' to ' + esc(shortDate(sTo))}.</span>`);
  }
  for (let d = today; d <= end; d = addDays(d, 1)) {
    if (!BANK_HOLIDAYS[d] || (sFrom && d >= sFrom && d <= sTo)) continue;
    notes.push(`<i class="ti ti-calendar-star"></i><span><b>Bank holiday</b> ${d === today ? 'today' : 'on ' + esc(shortDate(d))}: ${esc(BANK_HOLIDAYS[d])}.</span>`);
  }
  return `<div class="hb-date">${esc(parseISO(today).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }))}</div>` +
    notes.map(n => `<div class="hb-notice">${n}</div>`).join('');
}
function hbOnCallNow(blocks) {
  if (!blocks.length) return `<div class="hb-card"><h3><i class="ti ti-phone-call"></i> On call</h3><div class="hb-empty">The rota isn't in the app yet.</div></div>`;
  const now = nowLocal(), until = weekendEnd();
  // Up to the end of the coming weekend, but always at least the next three.
  const ahead = blocks.filter(b => b.end > now), within = ahead.filter(b => b.start < until);
  const rows = (within.length >= 3 ? within : ahead.slice(0, 3)).slice(0, 6).map(b => {
    const isNow = b.start <= now, sd = b.start.slice(0, 10), ed = b.end.slice(0, 10);
    const day = isNow ? 'Now' : sd === todayISO() ? (+b.start.slice(11, 13) >= 12 ? 'Tonight' : 'Today') : shortDate(sd);
    const span = isNow ? 'until ' + (ed <= addDays(todayISO(), 1) ? hbClock(b.end) : shortDate(ed) + ', ' + hbClock(b.end)) : hbWhen(b.start, b.end);
    return `<div class="hb-row${isNow ? ' now' : ''}${b.email === H.me ? ' mine' : ''}"><span class="w"><b>${esc(day)}</b> ${esc(span)}</span><span class="n">${esc(b.email === H.me ? 'You' : b.name)}</span></div>`;
  });
  return `<div class="hb-card"><h3><i class="ti ti-phone-call"></i> On call</h3>${rows.join('') || '<div class="hb-empty">Nobody\'s on the rota for this week yet.</div>'}
    <a class="hb-link" href="${hbLeaveLink('rota')}">The whole rota <i class="ti ti-chevron-right"></i></a></div>`;
}
function hbMyOnCall(blocks, always) {
  const now = nowLocal(), mine = blocks.filter(b => b.email === H.me && b.end > now);
  if (!mine.length && !always) return '';
  const horizon = addDays(todayISO(), HB_AHEAD) + 'T23:59:00';

  { levels: ['management'], q: 'What\'s the red number by a report?', a: '<p>How many test results are waiting to be QSed for that tool. It\'s at the end of the line (on a phone, on the corner of the tile). The same counts are in the To do box.</p>' },
  { levels: ['management'], q: 'Where do I add staff or change someone\'s position?', a: '<p>Press the <b>cog</b> at the top right to open Management.</p>' }
];

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    document.getElementById('signinScreen').hidden = false;
    document.getElementById('appRoot').hidden = true;
    return;
  }
  document.getElementById('signinScreen').hidden = true;
  document.getElementById('appRoot').hidden = false;
  const va = await SWS.swViewAsInit(user);
  document.getElementById('whoName').textContent = va ? va.name : (user.displayName || user.email);

  let isManager = false, isOffice = false;
  try {
    ({ isManager, isOffice } = await getAccessLevel(va ? va.email : user.email));
    document.getElementById('mgmtBtn').hidden = !isManager;
  } catch (e) {
    console.error('Access check failed:', e);
    SWS.swReport('load', 'Access check didn\'t load: ' + (e.code || e.message));
  }

  const tools = await loadTools();
  renderTools(tools, isManager, isOffice);
  H.tools = tools || {};
  const level = isManager ? 'management' : isOffice ? 'office' : 'engineer';
  loadHome(va ? va.email : user.email, level).then(() => {
    renderHome();
    if (!va && String(user.email).toLowerCase() === SWS.SW_OWNER) loadErrorCount();
  });

  if (isManager){
    const reportEntries = REPORT_TOOLS
      .map(t => ({ tool: t, entry: (tools && tools[t.pairKey]) || {} }))
      .filter(x => x.entry.live && x.entry.reportHref);
    loadQsCounts(reportEntries);
  }
  SWS.swExtrasStart({ page: 'index', version: VERSION, level, news: NEWS, help: HELP });
  SWS.swuStart();
});

document.getElementById('mgmtBtn').addEventListener('click', () => { location.href = 'management.html'; });
</script>
</body>
</html>
