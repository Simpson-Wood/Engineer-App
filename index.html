<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simpson &amp; Wood — Engineer Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<style>
  :root{
    --red:#D0222A; --red-dark:#a51b22; --ink:#1a1a1a;
    --bg:#f4f3f0; --card:#ffffff; --line:#e2e0da;
    --grey:#6b6b68; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Barlow',sans-serif; background:var(--bg); color:var(--ink);}
  h1,h2,h3,.label{font-family:'Barlow Condensed',sans-serif;}
  .screen{min-height:100vh;}
  [hidden]{display:none !important;}

  /* ---- sign-in ---- */
  #signin-screen{display:flex; align-items:center; justify-content:center; padding:24px; background:var(--ink);}
  .signin-card{background:var(--card); border-radius:16px; padding:40px 32px; max-width:380px; width:100%; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,0.35);}
  .signin-logo{width:100%; max-width:260px; margin:0 auto 20px;}
  .signin-tagline{color:var(--grey); font-size:15px; margin:0 0 28px;}
  .btn-primary{width:100%; background:var(--red); color:#fff; border:none; border-radius:8px; padding:13px 16px; font-size:15px; font-family:'Barlow',sans-serif; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn-primary:hover{background:var(--red-dark);}
  .error-text{color:var(--red); font-size:13px; margin-top:14px;}

  /* ---- topbar ---- */
  .topbar{display:flex; align-items:center; justify-content:space-between; background:var(--ink); padding:10px 20px; height:56px;}
  .topbar-brand{display:flex; align-items:center; gap:10px;}
  .topbar-logo{height:28px;}
  #versionLabel{color:#8a8a86; font-size:11px; margin:0;}
  .topbar-right{display:flex; align-items:center; gap:6px;}
  .user-name{color:#cfcfcf; font-size:13px; margin-right:8px;}
  .icon-btn{background:none; border:none; color:#cfcfcf; width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px;}
  .icon-btn:hover{background:rgba(255,255,255,0.1); color:#fff;}

  /* ---- layout / tiles (mobile-first grid) ---- */
  .layout{display:block;}
  .tool-nav{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:12px; padding:20px;}
  .tool-section-label{font-size:13px; color:var(--grey); text-transform:uppercase; letter-spacing:0.04em; grid-column:1/-1; margin:8px 0 -4px;}
  .tool-section-label:first-child{margin-top:0;}
  .tile{background:var(--card); border:0.5px solid var(--line); border-radius:12px; padding:16px 8px; text-align:center; text-decoration:none; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;}
  .tile i{font-size:24px; color:var(--red);}
  .tile span{font-size:12.5px; line-height:1.25;}
  .tile.disabled{opacity:0.45; cursor:default;}
  .tile.disabled i{color:var(--grey);}
  .tile.disabled .soon{display:block; font-size:10.5px; color:var(--grey); margin-top:-4px;}
  .content-pane{display:none;}
  .icon-wrap{position:relative; display:inline-flex; align-items:center; justify-content:center;}
  .tile .icon-wrap .badge-check{position:absolute; bottom:-3px; right:-4px; font-size:10px !important; background:var(--card); border-radius:50%; color:#2e8b57 !important;}
  .tile .icon-wrap .badge-count{position:absolute; top:-6px; right:-8px; background:var(--red); color:#fff !important; font-size:9.5px !important; font-weight:600; min-width:15px; height:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; font-family:'Barlow',sans-serif; line-height:1;}
  .activity-list{width:100%; max-width:640px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; max-height:calc(100vh - 130px); padding:4px 2px;}
  .activity-item{display:flex; align-items:center; gap:12px; background:var(--card); border:0.5px solid var(--line); border-radius:10px; padding:12px 14px; text-decoration:none; color:var(--ink);}
  .activity-item:hover{border-color:var(--red);}
  .activity-item.pending{border-left:3px solid var(--red);}
  .activity-item i{font-size:18px; color:var(--red); flex-shrink:0;}
  .activity-item .main{flex:1; min-width:0;}
  .activity-item .title{font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .activity-item .meta{font-size:11.5px; color:var(--grey); margin-top:1px;}
  .activity-pill{font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:20px; white-space:nowrap;}
  .activity-pill.pending{background:#fbe9e9; color:#a32d2d;}
  .activity-pill.done{background:#eaf3de; color:#3b6d11;}
  .activity-heading{font-size:13px; color:var(--grey); text-transform:uppercase; letter-spacing:0.04em; margin:14px 0 2px; width:100%; max-width:640px;}
  .activity-heading:first-child{margin-top:0;}
  .content-pane-inner{width:100%; max-width:640px; display:flex; flex-direction:column; align-items:flex-start;}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity 0.2s;}
  .toast.show{opacity:1;}

  @media (min-width:900px){
    .layout{display:flex; min-height:calc(100vh - 56px);}
    .tool-nav{display:flex; flex-direction:column; width:230px; background:var(--ink); padding:20px 14px; gap:2px; flex-shrink:0; grid-template-columns:none;}
    .tool-section-label{color:#8a8a86; margin:14px 0 2px; padding:0 10px;}
    .tool-section-label:first-child{margin-top:0;}
    .tile{flex-direction:row; justify-content:flex-start; text-align:left; background:none; border:none; border-radius:8px; padding:9px 10px; gap:10px;}
    .tile:hover{background:rgba(255,255,255,0.06);}
    .tile i{font-size:17px; width:20px;}
    .tile span{font-size:13.5px; color:#e4e4e2;}
    .tile.disabled .soon{display:inline; margin:0 0 0 6px; font-size:10.5px;}
    .tile.disabled span{display:flex; align-items:center;}
    .content-pane{display:flex; flex:1; align-items:flex-start; justify-content:center; color:var(--grey); font-size:15px; padding:32px 40px; overflow-y:auto;}
  }

  /* ---- SHARED (keep in step across pages): View as · What's New · Help ---- */
  .sw-hbox{display:flex; gap:6px; margin-left:auto;}
  .sw-hbtn{display:inline-flex; align-items:center; gap:5px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); color:#fff; border-radius:8px; padding:6px 10px; font-family:'Barlow',sans-serif; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .sw-hbtn i{font-size:17px;}
  .sw-hbtn:hover{background:rgba(255,255,255,.2);}
  .topbar-right .sw-hbtn{margin-right:6px;}
  @media (max-width:640px){ .sw-hbtn span{display:none;} .sw-hbtn{padding:6px 8px;} }
  .sw-vabar{position:sticky; top:0; z-index:400; display:flex; flex-wrap:wrap; align-items:center; gap:8px; background:#e8a317; color:#1a1a1a; padding:8px 16px; font-family:'Barlow',sans-serif; font-size:14px;}
  .sw-vabar i{font-size:18px;}
  .sw-vabar span{flex:1; min-width:180px;}
  .sw-vabar button{background:#fff; border:1px solid #1a1a1a; border-radius:7px; padding:4px 10px; font-weight:700; font-size:13px; cursor:pointer;}
  .sw-modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:500; display:flex; align-items:center; justify-content:center; padding:16px; font-family:'Barlow',sans-serif;}
  .sw-modal{background:#fff; color:#1a1a1a; border-radius:14px; width:100%; max-width:520px; max-height:88vh; overflow:auto; padding:20px;}
  .sw-modal h3{font-family:'Barlow Condensed',sans-serif; font-size:22px; margin:0 0 12px;}
  .sw-modal h3 small{font-size:14px; color:#5c5c5c; font-weight:600;}
  .sw-news{margin:0; padding-left:20px; font-size:15.5px; line-height:1.5;}
  .sw-news li{margin-bottom:8px;}
  .sw-mbtns{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .sw-btn{background:#fff; border:1.5px solid #cfcfcf; border-radius:9px; padding:9px 16px; font-weight:700; font-size:15px; cursor:pointer; font-family:'Barlow',sans-serif;}
  .sw-btn-red{background:#D0222A; border-color:#D0222A; color:#fff;}
  .sw-inp{width:100%; padding:10px 12px; border:1.5px solid #cfcfcf; border-radius:8px; font-size:16px; font-family:'Barlow',sans-serif; margin-bottom:10px;}
  .sw-people{display:grid; gap:6px;}
  .sw-people button{display:flex; justify-content:space-between; gap:10px; text-align:left; background:#fff; border:1px solid #e2e2e2; border-radius:9px; padding:10px 12px; cursor:pointer; font-size:15px; font-family:'Barlow',sans-serif;}
  .sw-people button:hover{background:#fbe9ea;}
  .sw-people small{color:#5c5c5c;}
  .sw-help-bg{justify-content:flex-end; align-items:stretch; padding:0;}
  .sw-help{background:#fff; color:#1a1a1a; width:100%; max-width:440px; height:100%; overflow:auto; padding:18px 20px 30px; box-shadow:-6px 0 24px rgba(0,0,0,.18);}
  .sw-help-h{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .sw-help-h h3{font-family:'Barlow Condensed',sans-serif; font-size:24px; margin:0; display:flex; align-items:center; gap:6px;}
  .sw-x{background:none; border:none; font-size:28px; cursor:pointer; line-height:1; color:#5c5c5c;}
  .sw-help-t{font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700; text-transform:uppercase; color:#5c5c5c; margin:16px 0 6px;}
  .sw-help details{border:1px solid #e2e2e2; border-radius:10px; margin-bottom:8px; background:#fff;}
  .sw-help summary{cursor:pointer; padding:11px 12px; font-weight:700; font-size:15.5px; list-style:none;}
  .sw-help summary::-webkit-details-marker{display:none;}
  .sw-help summary::before{content:'+'; display:inline-block; width:18px; color:#D0222A; font-weight:700;}
  .sw-help details[open] summary::before{content:'–';}
  .sw-help details > div{padding:0 14px 12px 30px; font-size:15px; line-height:1.5;}
  .sw-help details > div p{margin:0 0 8px;}
  .sw-help-f{margin-top:20px; border-top:1px solid #e2e2e2; padding-top:14px; font-size:14px; color:#5c5c5c;}
  @media (max-width:640px){ .sw-help{max-width:none;} }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
</head>
<body>

<div id="signinScreen" class="screen">
  <div class="signin-card">
    <img src="sw-logo.png" alt="Simpson &amp; Wood" class="signin-logo">
    <p class="signin-tagline">Sign in with your Simpson &amp; Wood Microsoft account to get to your tools.</p>
    <button id="msSignInBtn" class="btn-primary"><i class="ti ti-brand-windows" aria-hidden="true"></i>Sign in with Microsoft</button>
    <p id="signinErr" class="error-text"></p>
  </div>
</div>

<div id="appRoot" class="screen" hidden>
  <header class="topbar">
    <div class="topbar-brand">
      <img src="sw-logo-white.png" alt="Simpson &amp; Wood" class="topbar-logo">
      <p id="versionLabel">v1.0</p>
    </div>
    <div class="topbar-right">
      <span id="whoName" class="user-name"></span>
      <button id="mgmtBtn" class="icon-btn" hidden title="Management"><i class="ti ti-settings" aria-hidden="true"></i></button>
      <button id="signOutBtn" class="icon-btn" title="Sign out"><i class="ti ti-logout" aria-hidden="true"></i></button>
    </div>
  </header>
  <div class="layout">
    <nav class="tool-nav" id="tool-nav"></nav>
    <div class="content-pane" id="content-pane"><div class="content-pane-inner" id="content-pane-inner">Select a tool from the menu.</div></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, OAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, doc, getDoc, collection, getDocs, query, orderBy, limit, setDoc
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const VERSION = "v2.7";
document.getElementById('versionLabel').textContent = VERSION;

const firebaseConfig = {
  apiKey: "AIzaSyB5foKhRfIMG91bD5QyT7hHd1XBbeQGucw",
  authDomain: "simpson-wood-engineer-app.firebaseapp.com",
  projectId: "simpson-wood-engineer-app",
  storageBucket: "simpson-wood-engineer-app.firebasestorage.app",
  messagingSenderId: "201961281346",
  appId: "1:201961281346:web:3c7386b73b41ce9df35adb"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache() });
// Raw Firestore functions for the shared block below (this page saves
// nothing else, so there's nothing for "View as" to guard).
const swDoc = doc, swGetDoc = getDoc, swGetDocs = getDocs, swCollection = collection, swSetDoc = setDoc;

// ═══════════════════════════════════════════════════════════════════════════
//  SHARED (copied into index, timesheet, leave, timesheet-report and
//  management — keep in step): access level · View as (Rob only) ·
//  What's New · Help.   Standards §15: any page changed from now on gets
//  this block too.
// ═══════════════════════════════════════════════════════════════════════════
const SW_OWNER = 'rob.rose@simpsonandwood.co.uk';
const SW_MGMT_POSITIONS = ['Manager', 'QS', 'Director'];   // must match isManager() in the rules
let VIEW_AS = null;      // { email, name, position } while Rob is viewing the app as someone else
let SW = { page: '', version: '', level: 'engineer', news: {}, help: [], tab: () => '' };
const SW_VA_MSG = 'You\'re viewing as someone else, so nothing is saved or sent.';
const swEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function swBlocked() { return Promise.reject(new Error(SW_VA_MSG)); }
// Wrap anything that saves, so "View as" can never change real data.
function swGuard(fn) { return (...a) => VIEW_AS ? swBlocked() : fn(...a); }
function swGuardBatch(fn) { return (...a) => { const b = fn(...a); const c = b.commit.bind(b); b.commit = () => VIEW_AS ? swBlocked() : c(); return b; }; }
(() => {   // and nothing goes to Microsoft (email, calendars) while viewing as someone
  const f = window.fetch.bind(window);
  window.fetch = (u, o) => (VIEW_AS && String(u).includes('graph.microsoft.com')) ? swBlocked() : f(u, o);
})();
// Who someone is: 'management' (Manager / QS / Director, or the console-only
// managers list), 'office' or 'engineer'.
async function swAccess(email) {
  let managers = false, position = '', staff = null;
  try { managers = (await swGetDoc(swDoc(db, 'managers', email))).exists(); } catch (e) {}
  try { const s = await swGetDoc(swDoc(db, 'staff', String(email).toLowerCase())); if (s.exists()) { staff = s.data(); position = staff.position || ''; } } catch (e) {}
  const level = (managers || SW_MGMT_POSITIONS.includes(position)) ? 'management' : position === 'Office' ? 'office' : 'engineer';
  return { level, position, staff, isManager: level === 'management', isOffice: level === 'office' };
}
function swHeaderButton(id, icon, label, onClick) {
  if (document.getElementById(id)) return;
  const b = document.createElement('button');
  b.type = 'button'; b.id = id; b.className = 'sw-hbtn'; b.title = label; b.setAttribute('aria-label', label);
  b.innerHTML = `<i class="ti ${icon}" aria-hidden="true"></i><span>${swEsc(label)}</span>`;
  b.addEventListener('click', onClick);
  const right = document.querySelector('.topbar-right');
  if (right) right.prepend(b);
  else { const who = document.querySelector('header .who'); let box = document.getElementById('swHbox'); if (!box) { box = document.createElement('div'); box.id = 'swHbox'; box.className = 'sw-hbox'; who.parentNode.insertBefore(box, who); } box.appendChild(b); }
}
function swModal(html, cls) {
  const bg = document.createElement('div');
  bg.className = 'sw-modal-bg ' + (cls || '');
  bg.innerHTML = html;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-swclose]')) bg.remove(); });
  document.body.appendChild(bg);
  return bg;
}

// ---- View as (Rob only) ----------------------------------------------------
// Rob picks a person and every page shows what they'd see, read-only. The
// choice lasts for this browser tab (all pages) until he presses Stop. Data is
// still read with Rob's own access, so it shows screens, not the database rules.
async function swViewAsInit(user) {
  const real = String(user.email || '').toLowerCase();
  if (real !== SW_OWNER) return null;
  swHeaderButton('swViewAsBtn', 'ti-eye', 'View as', swPickViewAs);
  let v = null;
  try { v = sessionStorage.getItem('sw-viewas'); } catch (e) {}
  if (!v) return null;
  let name = v, position = '';
  try { const s = await swGetDoc(swDoc(db, 'staff', v)); if (s.exists()) { name = s.data().name || v; position = s.data().position || ''; } } catch (e) {}
  VIEW_AS = { email: v, name, position };
  const bar = document.createElement('div');
  bar.className = 'sw-vabar';
  bar.innerHTML = `<i class="ti ti-eye"></i><span>Viewing as <b>${swEsc(name)}</b>${position ? ' (' + swEsc(position) + ')' : ''}. Nothing can be saved or sent.</span><button type="button" data-va="change">Change</button><button type="button" data-va="stop">Stop</button>`;
  bar.addEventListener('click', e => {
    const b = e.target.closest('[data-va]'); if (!b) return;
    if (b.dataset.va === 'change') swPickViewAs();
    else { try { sessionStorage.removeItem('sw-viewas'); } catch (er) {} location.reload(); }
  });
  document.body.prepend(bar);
  document.body.classList.add('sw-va-on');
  return VIEW_AS;
}
async function swPickViewAs() {
  let people = [];
  try { const snap = await swGetDocs(swCollection(db, 'staff')); snap.forEach(d => { const x = d.data(); people.push({ email: d.id.toLowerCase(), name: x.name || d.id, position: x.position || '' }); }); } catch (e) {}
  people = people.filter(p => p.email !== SW_OWNER).sort((a, b) => a.name.localeCompare(b.name));
  const m = swModal(`<div class="sw-modal"><h3>View the app as…</h3><input class="sw-inp" placeholder="Type a name" data-q><div class="sw-people" data-list></div>
    <div class="sw-mbtns"><button type="button" class="sw-btn" data-swclose>Cancel</button></div></div>`);
  const draw = () => {
    const q = m.querySelector('[data-q]').value.trim().toLowerCase();
    m.querySelector('[data-list]').innerHTML = people.filter(p => !q || p.name.toLowerCase().includes(q)).map(p => `<button type="button" data-pick="${swEsc(p.email)}"><b>${swEsc(p.name)}</b><small>${swEsc(p.position || 'No position')}</small></button>`).join('') || '<p>Nobody found.</p>';
  };
  m.querySelector('[data-q]').addEventListener('input', draw);
  m.addEventListener('click', e => { const p = e.target.closest('[data-pick]'); if (!p) return; try { sessionStorage.setItem('sw-viewas', p.dataset.pick); } catch (er) {} location.reload(); });
  draw(); m.querySelector('[data-q]').focus();
}

// ---- What's New + Help -------------------------------------------------------
// Each page sets SW.page, SW.version, SW.news (notes per level) and SW.help
// (questions; each with the tab it belongs to and, if not everyone, the
// levels it's for), then calls swExtrasStart().
function swNewsItems() { return SW.news[SW.level] || SW.news.all || []; }
function swShowNews() {
  const items = swNewsItems();
  swModal(`<div class="sw-modal"><h3>What's new <small>${swEsc(SW.version)}</small></h3>${items.length ? `<ul class="sw-news">${items.map(i => `<li>${i}</li>`).join('')}</ul>` : '<p>Nothing new for you on this page.</p>'}
    <div class="sw-mbtns"><button type="button" class="sw-btn sw-btn-red" data-swclose>OK</button></div></div>`);
}
async function swNewsCheck() {
  if (VIEW_AS || !swNewsItems().length || !auth.currentUser) return;
  const key = 'seen_' + SW.page;
  try {
    const ref = swDoc(db, 'userPrefs', auth.currentUser.email);
    const snap = await swGetDoc(ref);
    if (snap.exists() && snap.data()[key] === SW.version) return;
    swShowNews();
    await swSetDoc(ref, { [key]: SW.version }, { merge: true });
  } catch (e) { console.warn('What\'s new check failed', e); }
}
function swShowHelp() {
  const tab = SW.tab() || '';
  const mine = SW.help.filter(h => !h.levels || h.levels.includes(SW.level));
  const groups = new Map();
  mine.forEach(h => { const g = h.tab || ''; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(h); });
  const order = [...groups.keys()].sort((a, b) => (a === tab ? -1 : b === tab ? 1 : 0));
  const m = swModal(`<aside class="sw-help"><div class="sw-help-h"><h3><i class="ti ti-help-circle"></i> Help</h3><button type="button" class="sw-x" data-swclose aria-label="Close">×</button></div>
    ${order.map(g => `<div class="sw-help-g">${g ? `<div class="sw-help-t">${swEsc(g)}</div>` : ''}${groups.get(g).map(h => `<details ${g === tab && groups.get(g)[0] === h ? 'open' : ''}><summary>${swEsc(h.q)}</summary><div>${h.a}</div></details>`).join('')}</div>`).join('') || '<p>No help for this page yet.</p>'}
    <div class="sw-help-f"><button type="button" class="sw-btn" data-swnews>What's new in ${swEsc(SW.version)}</button><p>Still stuck? Ask Rob.</p></div></aside>`, 'sw-help-bg');
  m.querySelector('[data-swnews]').addEventListener('click', () => { m.remove(); swShowNews(); });
}
function swExtrasStart() {
  swHeaderButton('swHelpBtn', 'ti-help-circle', 'Help', swShowHelp);
  swNewsCheck();
}

const msProvider = new OAuthProvider('microsoft.com');

// Customer-report tools double up as "QS & Reporting" entries for managers —
// same icon as the matching test tool (with a checkmark badge added in CSS),
// pointing at that tool's report file instead of its engineer file. Each
// app's un-QSed count comes from querying "{id}Tests" for qsed == false,
// per the qsed convention agreed for every customer-report app.
const REPORT_TOOLS = TOOLS.filter(t => t.section === "Customer reports");

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// The managers' Timesheets & leave page. Managers / QS see it under QS &
// Reporting; Office staff (Jan) get it in an Office section of their own.
function timesheetsTile(tools){
  const entry = (tools && tools.timesheet) || {};
  const ts = document.createElement('a');
  ts.href = entry.reportHref || 'timesheet-report.html';
  ts.className = 'tile';
  ts.innerHTML = '<span class="icon-wrap"><i class="ti ti-clock" aria-hidden="true"></i><i class="ti ti-circle-check badge-check" aria-hidden="true"></i></span><span>Timesheets &amp; leave</span>';
  return ts;
}

function renderTools(tools, isManager, isOffice){
  const nav = document.getElementById('tool-nav');
  nav.innerHTML = '';
  let lastSection = null;
  TOOLS.forEach(tool => {
    if (tool.section !== lastSection){
      const label = document.createElement('div');
      label.className = 'tool-section-label';
      label.textContent = tool.section;
      nav.appendChild(label);
      lastSection = tool.section;
    }
    const entry = (tools && tools[tool.pairKey]) || {};
    const isLive = (tool.alwaysLive && !(tools && tools[tool.pairKey])) || !!entry.live;
    const href = entry.href || tool.href;
    let el;
    if (isLive){
      el = document.createElement('a');
      el.href = href;
      el.className = 'tile';
    } else {
      el = document.createElement('div');
      el.className = 'tile disabled';
      el.addEventListener('click', () => showToast(tool.name + ' is coming soon'));
    }
    el.innerHTML = '<i class="ti ' + tool.icon + '" aria-hidden="true"></i><span>' + tool.name +
      (isLive ? '' : '<span class="soon">Coming soon</span>') + '</span>';
    nav.appendChild(el);
  });

  if (!isManager){
    if (isOffice){
      const lab = document.createElement('div');
      lab.className = 'tool-section-label';
      lab.textContent = 'Office';
      nav.appendChild(lab);
      nav.appendChild(timesheetsTile(tools));
    }
    return;
  }

  const reportEntries = REPORT_TOOLS
    .map(t => ({ tool: t, entry: (tools && tools[t.pairKey]) || {} }))
    .filter(x => x.entry.live && x.entry.reportHref);

  const label = document.createElement('div');
  label.className = 'tool-section-label';
  label.textContent = 'QS & Reporting';
  nav.appendChild(label);

  // Timesheets & leave (managers' view) — always shown to managers / QS.
  nav.appendChild(timesheetsTile(tools));

  reportEntries.forEach(({ tool, entry }) => {
    const el = document.createElement('a');
    el.href = entry.reportHref;
    el.className = 'tile';
    el.innerHTML =
      '<span class="icon-wrap"><i class="ti ' + tool.icon + '" aria-hidden="true"></i><i class="ti ti-circle-check badge-check" aria-hidden="true"></i>' +
      '<span class="badge-count" data-count-id="' + tool.id + '" hidden>0</span></span>' +
      '<span>' + tool.name + ' reports</span>';
    nav.appendChild(el);
  });
}

async function renderActivityFeed(reportEntries){
  const pane = document.getElementById('content-pane-inner');
  if (reportEntries.length === 0){
    pane.innerHTML = 'Select a tool from the menu.';
    return;
  }
  pane.innerHTML = 'Loading recent activity…';

  let allRecords = [];
  await Promise.all(reportEntries.map(async ({ tool, entry }) => {
    try {
      const q = query(collection(db, tool.id + 'Tests'), orderBy('date', 'desc'), limit(30));
      const snap = await getDocs(q);
      snap.forEach(d => {
        const r = d.data();
        if (r.deletedFlag) return;
        allRecords.push({
          tool, entry,
          title: r.equipmentId || r.category || tool.name,
          site: r.siteName || r.siteRef || '',
          date: r.date || '',
          qsed: !!r.qsed,
          siteRef: r.siteRef || ''
        });
      });
    } catch (e) {
      console.error('Could not load recent activity for ' + tool.id, e);
    }
  }));

  const pending = allRecords.filter(r => !r.qsed).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const recent = allRecords.filter(r => r.qsed).sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  // Badge counts come from this same fetch, not a separate query — a
  // Firestore query for qsed == false would silently miss any record where
  // qsed was never set at all (missing != false in a query), while "pending"
  // here already treats missing the same as false. Same source, so the
  // sidebar badge and the "Ready for QS" list can never disagree.
  const countsByTool = {};
  pending.forEach(r => { countsByTool[r.tool.id] = (countsByTool[r.tool.id] || 0) + 1; });
  Object.keys(countsByTool).forEach(id => {
    const badge = document.querySelector('[data-count-id="' + id + '"]');
    if (badge){ badge.textContent = countsByTool[id] > 99 ? '99+' : String(countsByTool[id]); badge.hidden = false; }
  });

  if (pending.length === 0 && recent.length === 0){
    pane.innerHTML = 'No recent activity yet.';
    return;
  }

  function renderItem(r){
    const href = r.entry.reportHref + (r.siteRef ? ('?site=' + encodeURIComponent(r.siteRef)) : '');
    return '<a class="activity-item' + (r.qsed ? '' : ' pending') + '" href="' + href + '">' +
      '<i class="ti ' + r.tool.icon + '" aria-hidden="true"></i>' +
      '<div class="main"><div class="title">' + r.title + '</div><div class="meta">' + r.site + ' · ' + r.date + '</div></div>' +
      '<span class="activity-pill ' + (r.qsed ? 'done' : 'pending') + '">' + (r.qsed ? 'QSed' : 'Ready for QS') + '</span>' +
      '</a>';
  }

  let html = '<div class="activity-list">';
  if (pending.length){
    html += '<div class="activity-heading">Ready for QS</div>';
    html += pending.map(renderItem).join('');
  }
  if (recent.length){
    html += '<div class="activity-heading">Recent submissions</div>';
    html += recent.map(renderItem).join('');
  }
  html += '</div>';
  pane.innerHTML = html;
}

async function loadTools(){
  try {
    const snap = await getDoc(doc(db, 'config', 'homepage'));
    if (snap.exists()) return snap.data().tools || {};
  } catch (e) {
    console.error('Could not load app config, falling back to defaults', e);
  }
  // Fallback if Firestore is unreachable or the doc doesn't exist yet
  return { isolator: { live: true } };
}

// A manager is either in the console-only /managers failsafe list, or a
// staff record whose position is Manager, QS or Director (Director added
// 19 Oct 2026) — position alone is now the
// normal way to grant/revoke management access, self-service from
// management.html's Staff list. Office is a separate, narrower tier: it
// only unlocks the activity feed below, never the QS & Reporting tiles or
// management.html itself.
async function getAccessLevel(email){
  let isManager = false, isOffice = false;
  try {
    const mgrSnap = await getDoc(doc(db, 'managers', email));
    if (mgrSnap.exists()) isManager = true;
  } catch (e) { console.error('managers check failed', e); }
  try {
    const staffSnap = await getDoc(doc(db, 'staff', email.toLowerCase()));
    if (staffSnap.exists()){
      const pos = staffSnap.data().position;
      if (pos === 'Manager' || pos === 'QS' || pos === 'Director') isManager = true;
      if (pos === 'Office') isOffice = true;
    }
  } catch (e) { console.error('staff check failed', e); }
  return { isManager, isOffice };
}

function describeAuthError(err) {
  if (err.code === 'auth/unauthorized-domain') return 'This site\'s domain isn\'t authorised in Firebase yet.';
  if (err.code === 'auth/operation-not-allowed') return 'Microsoft sign-in isn\'t enabled in Firebase yet.';
  if (['auth/popup-blocked','auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(err.code)) return null;
  return 'Sign-in failed — ' + (err.code || err.message || 'unknown error') + '.';
}
document.getElementById('msSignInBtn').addEventListener('click', () => {
  const errBox = document.getElementById('signinErr');
  errBox.textContent = '';
  signInWithPopup(auth, msProvider).catch(err => {
    if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
      signInWithRedirect(auth, msProvider).catch(err2 => { const msg = describeAuthError(err2); if (msg) errBox.textContent = msg; });
      return;
    }
    const msg = describeAuthError(err); if (msg) errBox.textContent = msg;
  });
});
document.getElementById('signOutBtn').addEventListener('click', () => signOut(auth));
getRedirectResult(auth).catch(err => {
  document.getElementById('signinErr').textContent = 'Sign-in failed — ' + (err.message || 'try again.');
});

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    document.getElementById('signinScreen').hidden = false;
    document.getElementById('appRoot').hidden = true;
    return;
  }
  document.getElementById('signinScreen').hidden = true;
  document.getElementById('appRoot').hidden = false;
  const va = await swViewAsInit(user);
  document.getElementById('whoName').textContent = va ? va.name : (user.displayName || user.email);

  let isManager = false, isOffice = false;
  try {
    ({ isManager, isOffice } = await getAccessLevel(va ? va.email : user.email));
    document.getElementById('mgmtBtn').hidden = !isManager;
  } catch (e) {
    console.error('Access check failed:', e);
  }

  const tools = await loadTools();
  renderTools(tools, isManager, isOffice);

  if (isManager || isOffice){
    const reportEntries = REPORT_TOOLS
      .map(t => ({ tool: t, entry: (tools && tools[t.pairKey]) || {} }))
      .filter(x => x.entry.live && x.entry.reportHref);
    renderActivityFeed(reportEntries);
  }
  SW = Object.assign(SW, { page: 'index', version: VERSION, level: isManager ? 'management' : isOffice ? 'office' : 'engineer', news: NEWS, help: HELP });
  swExtrasStart();
});
