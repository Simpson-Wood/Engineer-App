<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simpson & Wood — Engineer Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#D0222A; --red-dark:#a91b22; --ink:#1a1a1a; --grey:#6b6b6b;
    --line:#e2e2e2; --bg:#f2f1ee; --card:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:'Barlow',sans-serif;background:var(--bg);color:var(--ink);}
  header{background:var(--ink);padding:16px 18px calc(14px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:12px;}
  header .brand{display:flex;align-items:center;gap:12px;}
  header img{height:32px;display:block;}
  header .title-block h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;letter-spacing:.02em;color:#fff;margin:0;text-transform:uppercase;}
  header .title-block p{margin:2px 0 0;font-size:11px;color:#8f8f8f;}
  header .who{text-align:right;}
  header .who .name{color:#fff;font-size:12px;font-weight:600;}
  header .who button{background:none;border:none;color:#e2b0b3;font-size:11px;cursor:pointer;text-decoration:underline;padding:0;margin-top:2px;}

  main{max-width:520px;margin:0 auto;padding:28px 20px 40px;}

  .group-label{
    font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    color:var(--grey);margin:0 0 14px 2px;
  }
  .group-label:not(:first-child){margin-top:32px;}

  .app-icon-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(84px, 1fr));gap:22px 14px;}
  .app-tile{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--ink);}
  .app-icon{
    width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .1s ease;
  }
  .app-icon svg{width:28px;height:28px;}
  .app-icon.red{background:linear-gradient(160deg,#e4383f,var(--red-dark));}
  .app-icon.dark{background:linear-gradient(160deg,#3a3a3a,var(--ink));}
  .app-tile:active .app-icon{transform:scale(.9);}
  .app-label{margin-top:8px;font-size:12px;font-weight:600;text-align:center;line-height:1.25;}

  .empty-note{color:var(--grey);font-size:12.5px;text-align:center;padding:20px 0;}

  #signinScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--bg);}
  #signinScreen img{height:44px;margin-bottom:28px;}
  #signinScreen h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;font-size:20px;margin:0 0 8px;}
  #signinScreen p{color:var(--grey);font-size:14px;max-width:320px;margin:0 0 26px;}
  .ms-btn{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border:none;padding:13px 22px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;}
  .ms-btn:active{background:#000;}
  #signinScreen .err{color:var(--red);font-size:13px;margin-top:16px;max-width:320px;}
  #appRoot{display:none;}
</style>
</head>
<body>

<div id="signinScreen">
  <img src="sw-logo.png" alt="Simpson & Wood">
  <h2>Engineer Apps</h2>
  <p>Sign in with your Simpson &amp; Wood Microsoft account to see what's available to you.</p>
  <button class="ms-btn" id="msSignInBtn">Sign in with Microsoft</button>
  <div class="err" id="signinErr"></div>
</div>

<div id="appRoot">
  <header>
    <div class="brand">
      <img src="sw-logo.png" alt="Simpson & Wood">
      <div class="title-block">
        <h1>Engineer Apps</h1>
        <p>One login, everything in one place</p>
      </div>
    </div>
    <div class="who">
      <div class="name" id="whoName">—</div>
      <button id="signOutBtn">Sign out</button>
    </div>
  </header>

  <main>
    <p class="group-label">Isolator / Interlock</p>
    <div class="app-icon-grid">
      <a class="app-tile" href="isolator-interlock-test.html">
        <div class="app-icon red">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="3" width="14" height="18" rx="2"></rect>
            <rect x="9" y="1.5" width="6" height="3" rx="1"></rect>
            <polyline points="8.5 12.5 11 15 16 9.5"></polyline>
          </svg>
        </div>
        <div class="app-label">Log a Test</div>
      </a>
      <a class="app-tile" href="isolator-interlock-report.html" id="reportsTile" style="display:none;">
        <div class="app-icon dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="3" width="16" height="18" rx="2"></rect>
            <line x1="8" y1="8" x2="16" y2="8"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
            <line x1="8" y1="16" x2="13" y2="16"></line>
          </svg>
        </div>
        <div class="app-label">Reports</div>
      </a>
    </div>
    <div class="empty-note" id="noAppsNote" style="display:none;">Nothing else available to you yet.</div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, OAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB5foKhRfIMG91bD5QyT7hHd1XBbeQGucw",
  authDomain: "simpson-wood-engineer-app.firebaseapp.com",
  projectId: "simpson-wood-engineer-app",
  storageBucket: "simpson-wood-engineer-app.firebasestorage.app",
  messagingSenderId: "201961281346",
  appId: "1:201961281346:web:3c7386b73b41ce9df35adb"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache() });
const msProvider = new OAuthProvider('microsoft.com');
msProvider.setCustomParameters({ tenant: 'abd23e0c-2d96-49ad-a280-99ff317f7d60' });

function describeAuthError(err) {
  if (err.code === 'auth/unauthorized-domain') return 'This site\'s domain isn\'t authorised in Firebase yet.';
  if (err.code === 'auth/operation-not-allowed') return 'Microsoft sign-in isn\'t enabled in Firebase yet.';
  if (['auth/popup-blocked','auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(err.code)) return null;
  return 'Sign-in failed — ' + (err.code || err.message || 'unknown error') + '.';
}
document.getElementById('msSignInBtn').addEventListener('click', () => {
  const errBox = document.getElementById('signinErr');
  errBox.textContent = '';
  signInWithPopup(auth, msProvider).catch(err => {
    if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
      signInWithRedirect(auth, msProvider).catch(err2 => { const msg = describeAuthError(err2); if (msg) errBox.textContent = msg; });
      return;
    }
    const msg = describeAuthError(err); if (msg) errBox.textContent = msg;
  });
});
document.getElementById('signOutBtn').addEventListener('click', () => signOut(auth));
getRedirectResult(auth).catch(err => {
  document.getElementById('signinErr').textContent = 'Sign-in failed — ' + (err.message || 'try again.');
});

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    document.getElementById('signinScreen').style.display = 'flex';
    document.getElementById('appRoot').style.display = 'none';
    return;
  }
  document.getElementById('signinScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  document.getElementById('whoName').textContent = user.displayName || user.email;

  try {
    const snap = await getDoc(doc(db, 'managers', user.email));
    if (snap.exists()) document.getElementById('reportsTile').style.display = 'flex';
  } catch (e) {
    console.error('Manager check failed:', e);
  }
});
</script>

</body>
</html>
